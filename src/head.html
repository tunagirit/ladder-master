<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ladder Ustası — PLC Mantık Bulmacası</title>
<style>
:root{--bg:#0d1117;--p1:#151b23;--p2:#1c242e;--ln:#2a3542;--tx:#d7dee7;--dim:#7d8a99;--neon:#39ff6a;--amb:#ffb020;--red:#ff4d4d;--blu:#4da3ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:#06090d;color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 40px #000}
#sceneWrap{flex:0 0 38%;min-height:210px;position:relative;border-bottom:2px solid var(--ln)}
#cv{width:100%;height:100%;display:block}
#err{position:absolute;left:8px;right:8px;bottom:62px;background:rgba(120,15,15,.95);border:2px solid var(--red);border-radius:10px;padding:10px 12px;display:none;z-index:5;box-shadow:0 0 18px rgba(255,77,77,.5)}
#err b{display:block;font-size:13.5px;line-height:1.35;margin-bottom:8px}
#err .row{display:flex;gap:8px}
#mid{background:var(--p1);padding:6px 8px 6px;border-bottom:1px solid var(--ln)}
#mtop{display:flex;align-items:center;gap:6px}
#title{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title small{color:var(--dim);font-weight:500;margin-right:6px}
.ib{background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:8px;min-width:36px;height:34px;font-size:16px;padding:0 8px}
.ib:active{background:#26323f}
#task{font-size:11.5px;line-height:1.35;color:#aab6c3;margin:5px 0 6px;max-height:3.9em;overflow:hidden;cursor:pointer}
#ctrl{display:flex;gap:6px;align-items:center}
#run{flex:1;height:38px;border-radius:9px;border:0;font-weight:800;font-size:15px;letter-spacing:.5px;color:#06210f;background:var(--neon);box-shadow:0 0 12px rgba(57,255,106,.35)}
#run.on{background:var(--red);color:#fff;box-shadow:0 0 12px rgba(255,77,77,.4)}
#pill{font-size:10px;font-weight:800;padding:3px 7px;border-radius:99px;background:#222c37;color:var(--dim);border:1px solid var(--ln)}
#pill.run{background:#0d3a1a;color:var(--neon);border-color:#1f7a37}
#pill.bad{background:#4a1111;color:var(--red);border-color:#8a2222}
#editor{flex:1;min-height:0;display:flex;flex-direction:column;background:#0f141b}
#ehead{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:11px;color:var(--dim);border-bottom:1px solid #1b242e}
#ehead .sp{flex:1;line-height:1.25}
#ehead .sp b{color:var(--tx)}
.sm{background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:7px;height:28px;padding:0 9px;font-size:12px}
#rungs{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 6px 14px;-webkit-overflow-scrolling:touch}
.rung{display:flex;align-items:flex-start;margin-bottom:5px}
.gut{width:30px;flex:0 0 30px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1px 0}
.rn{font-size:10px;color:var(--dim);font-family:ui-monospace,monospace}
.rm{background:#1a222c;border:1px solid #2a3542;color:var(--dim);border-radius:6px;width:24px;height:22px;font-size:13px;line-height:1;padding:0}
.grid{position:relative;background:repeating-linear-gradient(0deg,transparent 0 43px,#131b24 43px 44px)}
.rail{position:absolute;top:0;bottom:0;width:4px;background:#46576b;border-radius:2px}
.grid.on .rail{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.cell{position:absolute;height:44px;border-radius:5px}
.cell svg{display:block;overflow:visible}
.cell svg *{fill:none;stroke-linecap:round}
.cell .wl,.cell .wr{stroke:#3a4757;stroke-width:2.5}
.cell .sym{stroke:#9fb0c2;stroke-width:2.5}
.cell .ad{fill:#cfe0f2;stroke:none;font:600 9.5px ui-monospace,Menlo,monospace;text-anchor:middle}
.cell .tg{fill:#7d8a99;stroke:none;font:8.5px system-ui;text-anchor:middle}
.cell .ph{stroke:#2b3744;stroke-width:1.5;stroke-dasharray:3 3}
.cell .plus{stroke:#2b3744;stroke-width:2}
.cell .bx{fill:#141c25;stroke:#6d8097;stroke-width:2}
.cell .bt{fill:#dfe8f2;stroke:none;font:700 10px ui-monospace,monospace;text-anchor:middle}
.cell .bv{fill:#9fe8b3;stroke:none;font:600 9.5px ui-monospace,monospace;text-anchor:middle}
.cell .cl{fill:#cfe0f2;stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.cell.lp .wl,.cell.rp .wr{stroke:var(--neon);filter:drop-shadow(0 0 3px var(--neon))}
.cell.ps .sym{stroke:var(--neon);filter:drop-shadow(0 0 3px var(--neon))}
.cell.ps .bx{stroke:var(--neon);fill:#0d2615}
.cell.ps .cl{fill:var(--neon)}
.cell.qq .bx{fill:#12461f}
.vw{position:absolute;width:3px;background:#3a4757;border-radius:2px}
.vw.on{background:var(--neon);box-shadow:0 0 6px var(--neon)}
#rungs[data-tool="c"] .cell.ec,#rungs[data-tool="o"] .cell.eo{background:rgba(77,163,255,.12);outline:1.5px dashed #4da3ff;animation:pl 1s infinite}
@keyframes pl{50%{background:rgba(77,163,255,.25)}}
#addr{margin:2px 0 0 30px;width:calc(100% - 30px);height:34px;border:1.5px dashed #2f3d4c;background:transparent;color:var(--dim);border-radius:8px;font-size:12px}
#palette{flex:0 0 66px;display:flex;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;background:var(--p1);border-top:2px solid var(--ln)}
.pal{flex:0 0 62px;border-radius:9px;background:var(--p2);border:1.5px solid var(--ln);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;font-size:9px}
.pal svg{display:block}
.pal svg *{fill:none;stroke:#b6c4d3;stroke-width:2.2;stroke-linecap:round}
.pal svg text{fill:#dfe8f2;stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.pal.sel{border-color:var(--blu);background:#14263a;box-shadow:0 0 10px rgba(77,163,255,.5)}
.ov{position:absolute;inset:0;background:rgba(3,6,10,.82);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.ov.mid{align-items:center}
#ovCard{z-index:30}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:#161d27;border:1px solid var(--ln);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.card{width:90%;max-height:90%;overflow-y:auto;background:#161d27;border:1px solid var(--ln);border-radius:16px;padding:16px;text-align:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3,.card h3{margin:0 0 4px;font-size:16px}
.grp{font-size:10px;color:var(--dim);margin:10px 0 4px;letter-spacing:.8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#1d2733;border:1.5px solid var(--ln);color:var(--tx);border-radius:9px;padding:5px 9px;font:600 12px ui-monospace,monospace;text-align:left;min-width:62px}
.chip small{display:block;font:9px system-ui;color:var(--dim)}
.chip.sel{border-color:var(--neon);background:#0f2a18;box-shadow:0 0 8px rgba(57,255,106,.35)}
.fld{display:flex;gap:8px;align-items:center;margin-top:10px}
.fld label{font-size:11px;color:var(--dim);flex:0 0 70px}
.fld input{flex:1;height:34px;background:#0e141b;border:1.5px solid var(--ln);border-radius:8px;color:var(--tx);padding:0 10px;font-size:14px;user-select:text;-webkit-user-select:text}
.step{display:flex;align-items:center;gap:10px}
.step b{font:700 16px ui-monospace,monospace;min-width:64px;text-align:center;color:var(--amb)}
.btn{height:42px;border-radius:10px;border:1.5px solid var(--ln);background:#212c38;color:var(--tx);font-size:14px;font-weight:700;padding:0 14px}
.btn.pri{background:var(--neon);color:#06210f;border-color:var(--neon)}
.btn.dan{background:#3b1414;border-color:#7a2323;color:#ff9a9a}
.btn.wide{flex:1}
.brow{display:flex;gap:8px;margin-top:14px}
.mi{display:block;width:100%;text-align:left;height:46px;margin-bottom:6px;background:#1d2733;border:1.5px solid var(--ln);border-radius:10px;color:var(--tx);font-size:14px;padding:0 14px}
#menu{background:var(--bg)}
#menu .sheet{height:100%;max-height:100%;border-radius:0;background:var(--bg);border:0}
.cat{margin:14px 0 6px;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--amb)}
.cat small{display:block;color:var(--dim);font-weight:500;letter-spacing:0}
.lvs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:12px;background:var(--p2);border:1.5px solid var(--ln);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.lv small{font-size:10px;color:var(--amb);letter-spacing:1px;min-height:12px}
.lv.lock{opacity:.4}
.lv.cur{border-color:var(--neon)}
.stars{font-size:30px;letter-spacing:6px;color:#3a4552;margin:6px 0}
.stars .f{color:var(--amb);text-shadow:0 0 12px var(--amb)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:#243242;border:1px solid #3a4b5f;color:#fff;font-size:12.5px;padding:8px 14px;border-radius:99px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
p.t{font-size:13px;line-height:1.5;color:#b9c5d2;text-align:left;margin:8px 0}

.pal{touch-action:pan-x}
#doneBar{flex:0 0 66px;display:none;align-items:center;gap:10px;padding:8px 10px;background:#0f2a18;border-top:2px solid #1f7a37;font-size:12.5px;line-height:1.3}
#doneBar span{flex:1}
#doneBar b{color:var(--neon)}
#ghost{position:fixed;left:0;top:0;width:62px;height:54px;border-radius:10px;background:#14263a;border:1.5px solid var(--blu);box-shadow:0 6px 18px rgba(0,0,0,.6),0 0 14px rgba(77,163,255,.6);display:none;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:var(--tx);pointer-events:none;z-index:99;opacity:.95}
#ghost svg *{fill:none;stroke:#cfe0f2;stroke-width:2.2;stroke-linecap:round}
#ghost svg text{fill:#dfe8f2;stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.cell.dz{background:rgba(57,255,106,.25)!important;outline:2px solid var(--neon)!important;animation:none!important}
.cell.dragsrc{opacity:.35}
.cell.full{touch-action:none;cursor:grab}
.cell.dz.sw{background:rgba(255,176,32,.25)!important;outline-color:var(--amb)!important}
#palette.trash{background:#3b1414;border-top-color:var(--red)}
#palette.trash>*{opacity:.15}
#palette.trash::after{content:"🗑  Silmek için buraya bırak";position:absolute;left:0;right:0;text-align:center;line-height:54px;color:#ff9a9a;font-weight:800;font-size:14px}
#palette.trash.hot{background:#5a1717;box-shadow:inset 0 0 20px rgba(255,77,77,.6)}
#palette{position:relative}
#menu{background:radial-gradient(120% 70% at 50% 0%,#132a1c 0%,#0d1117 55%)}
#menu .sheet{background:transparent}
.mm{display:flex;flex-direction:column;gap:10px;min-height:100%;padding-bottom:10px}
#mcv{width:100%;height:150px;display:block}
.mm-title{text-align:center;font-weight:900;font-size:40px;letter-spacing:3px;line-height:1;color:#eafff0;text-shadow:0 0 10px var(--neon),0 0 28px rgba(57,255,106,.55);margin-top:2px}
.mm-title span{display:block;font-size:26px;letter-spacing:10px;color:var(--amb);text-shadow:0 0 12px rgba(255,176,32,.6);margin-top:4px}
.mm-sub{text-align:center;font-size:10.5px;letter-spacing:2.5px;color:var(--dim);margin-bottom:6px}
.pts{align-self:center;background:#0f2a18;border:1.5px solid #1f7a37;color:var(--neon);font-weight:800;border-radius:99px;padding:6px 16px;font-size:14px;margin-bottom:6px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--ln);background:#161e28;color:var(--tx);font-size:16px;font-weight:800}
.bigbtn small{font-weight:500;color:var(--dim);font-size:11px}
.bigbtn.play{min-height:62px;font-size:22px;letter-spacing:2px;color:#06210f;border:0;background:linear-gradient(90deg,#22d957,#39ff6a);box-shadow:0 0 24px rgba(57,255,106,.45)}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topbar h3{flex:1;margin:0;font-size:17px}
.topbar .pp{color:var(--neon);font-weight:800;font-size:13px}
.ccard{display:flex;gap:12px;align-items:center;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--ln);background:#141b24;text-align:left;color:var(--tx);margin-bottom:10px}
.ccard .ic{flex:0 0 58px;height:58px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:#0b1016;border:1.5px solid currentColor}
.ccard .ic svg *{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.ccard .ic svg text{fill:currentColor;stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.ccard .bd{flex:1;min-width:0}
.ccard b{display:block;font-size:17px}
.ccard small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.ccard .cnt{font:800 13px ui-monospace,monospace;color:var(--tx)}
.bar{height:6px;border-radius:3px;background:#222c37;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px}
.lvs5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.lv5{aspect-ratio:1;border-radius:10px;background:var(--p2);border:1.5px solid var(--ln);color:var(--tx);font:800 15px ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.lv5 small{font-size:10px;line-height:1}
.lv5.dn{background:#0f2a18;border-color:#1f7a37;color:var(--neon)}
.lv5.lock{opacity:.35}
.lv5.cur{box-shadow:0 0 0 2px var(--blu)}
.gain{font-size:28px;font-weight:900;color:var(--amb);text-shadow:0 0 14px rgba(255,176,32,.6);margin:8px 0}
.prow{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}
.prow span{flex:0 0 46px;color:var(--dim)}
.prow .bar{flex:1;margin:0}
.prow b{flex:0 0 54px;text-align:right;font-family:ui-monospace,monospace}
</style></head><body>
<div id="app">
 <div id="sceneWrap"><canvas id="cv"></canvas><div id="err"><b id="errT"></b><div class="row"><button class="btn pri wide" id="errRetry">↻ Tekrar Dene</button><button class="btn wide" id="errEdit">✎ Düzenle</button></div></div></div>
 <div id="mid">
  <div id="mtop"><button class="ib" id="bMenu" title="Bölümler">☰</button><div id="title"></div><span id="pill">STOP</span><button class="ib" id="bSnd">🔊</button></div>
  <div id="task"></div>
  <div id="ctrl"><button id="run">▶ RUN</button><button class="ib" id="bSpd">1x</button><button class="ib" id="bHint">?</button></div>
 </div>
 <div id="editor"><div id="ehead"><div class="sp" id="einfo"></div><button class="sm" id="bClear">🗑 Temizle</button></div><div id="rungs"></div></div>
 <div id="palette"></div>
 <div id="doneBar"><span><b>✔ Bu bölüm tamamlandı.</b><br>Sıfırlamak ister misiniz?</span><button class="btn dan" id="bReset">↺ Sıfırla</button></div>
 <div class="ov" id="ovSheet"><div class="sheet" id="sheet"></div></div>
 <div class="ov mid" id="ovCard"><div class="card" id="card"></div></div>
 <div class="ov" id="menu"><div class="sheet" id="menuIn"></div></div>
 <div id="toast"></div>
 <div id="ghost"></div>
</div>
<script>
