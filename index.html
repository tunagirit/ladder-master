<div id="app">
 <div id="sceneWrap"><canvas id="cv"></canvas><div id="err"><b id="errT"></b><div class="row"><button class="btn pri wide" id="errRetry">↻ Tekrar Dene</button><button class="btn wide" id="errEdit">✎ Düzenle</button></div></div></div>
 <div id="mid">
  <div id="mtop"><button class="ib" id="bMenu" title="Bölümler">☰</button><div id="title"></div><span id="pill">STOP</span><button class="ib" id="bSnd">🔊</button></div>
  <div id="task"></div>
  <div id="ctrl"><button id="run">▶ RUN</button><button class="ib" id="bSpd">1x</button><button class="ib" id="bHint">?</button></div>
 </div>
 <div id="editor"><div id="ehead"><div class="sp" id="einfo"></div><button class="sm" id="bClear">🗑 Temizle</button></div><div id="rungs"></div></div>
 <div id="palette"></div>
 <div id="doneBar"><span><b>✔ Bu bölüm tamamlandı.</b><br>Sıfırlamak ister misiniz?</span><button class="btn dan" id="bReset">↺ Sıfırla</button></div>
 <div class="ov" id="ovSheet"><div class="sheet" id="sheet"></div></div>
 <div class="ov mid" id="ovCard"><div class="card" id="card"></div></div>
 <div class="ov" id="menu"><div class="sheet" id="menuIn"></div></div>
 <div id="toast"></div>
 <div id="ghost"></div>
</div>
<script>
'use strict';
/* ===== PLC LADDER BULMACA — MANTIK ÇEKİRDEĞİ ===== */
const COLS=5, OUTC=4, SCAN=0.02, BW=4, PIST_V=3;
const OUTT=['COIL','SET','RST','TON','TOF','CTU','CTD'];
const isOut=t=>OUTT.indexOf(t)>=0;
function parseCell(s){ if(!s) return null; const p=s.split(' '); const o={t:p[0],a:p[1]}; if(p[2]!==undefined) o.pv=parseFloat(p[2]); return o; }
function mkRung(){ return {br:false,c:[Array(COLS).fill(null),Array(COLS).fill(null)]}; }
function R(row0,row1){ const rg=mkRung(); rg.br=!!row1; row0.forEach((s,i)=>{rg.c[0][i]=parseCell(s);}); if(row1) row1.forEach((s,i)=>{rg.c[1][i]=parseCell(s);}); return rg; }
function countBlocks(p){ let n=0; for(const rg of p.rungs) for(const row of rg.c) for(const c of row) if(c) n++; return n; }
function branchSpan(rg){ let f=-1,t=-1; if(rg.br) for(let c=0;c<OUTC;c++) if(rg.c[1][c]){ if(f<0) f=c; t=c; } return f<0?null:{from:f,to:t}; }

/* ---------- PLC (sanal scan cycle) ---------- */
class PLC{
  constructor(){ this.reset(); }
  reset(){ this.b={}; this.T={}; this.C={}; this.res=[]; }
  rd(a){ const k=a[0]; if(k==='T') return !!(this.T[a]&&this.T[a].q); if(k==='C') return !!(this.C[a]&&this.C[a].q); return !!this.b[a]; }
  scan(prog,dt){ this.res=[]; for(const rg of prog.rungs) this.res.push(this.rung(rg,dt)); }
  rung(rg,dt){
    const Rs={in:[[],[]],out:[[],[]],outIn:false};
    const pass=(r,c)=>{ const x=rg.c[r][c]; if(!x||isOut(x.t)) return true; const v=this.rd(x.a); return x.t==='NC'?!v:v; };
    const sp=branchSpan(rg); let p=true,c=0;
    while(c<OUTC){
      if(sp&&c===sp.from){
        let pa=p,pb=p;
        for(let k=sp.from;k<=sp.to;k++){ Rs.in[0][k]=pa; pa=pa&&pass(0,k); Rs.out[0][k]=pa; Rs.in[1][k]=pb; pb=pb&&pass(1,k); Rs.out[1][k]=pb; }
        p=pa||pb; c=sp.to+1;
      } else { Rs.in[0][c]=p; p=p&&pass(0,c); Rs.out[0][c]=p; c++; }
    }
    Rs.outIn=p;
    const o=rg.c[0][OUTC]; if(o&&isOut(o.t)) this.exec(o,p,dt);
    return Rs;
  }
  exec(o,p,dt){
    const a=o.a;
    switch(o.t){
      case 'COIL': this.b[a]=p; break;
      case 'SET': if(p) this.b[a]=true; break;
      case 'RST': if(p){
        if(a[0]==='T'){ const t=this.T[a]; if(t){ t.et=0; t.q=false; } }
        else if(a[0]==='C'){ const c=this.C[a]; if(c){ c.cv=c.type==='CTD'?c.pv:0; c.q=c.type==='CTD'?c.cv<=0:c.cv>=c.pv; } }
        else this.b[a]=false; } break;
      case 'TON': { let t=this.T[a]; if(!t||t.type!=='TON') t=this.T[a]={type:'TON',et:0,q:false,pv:0};
        t.pv=(o.pv||2)*1000; if(p){ t.et=Math.min(t.et+dt,t.pv); t.q=t.et>=t.pv; } else { t.et=0; t.q=false; } break; }
      case 'TOF': { let t=this.T[a]; if(!t||t.type!=='TOF') t=this.T[a]={type:'TOF',et:0,q:false,pv:0};
        t.pv=(o.pv||2)*1000; if(p){ t.q=true; t.et=0; } else if(t.q){ t.et+=dt; if(t.et>=t.pv){ t.et=t.pv; t.q=false; } } break; }
      case 'CTU': case 'CTD': { let c=this.C[a]; const pv=o.pv||3;
        if(!c||c.type!==o.t) c=this.C[a]={type:o.t,cv:o.t==='CTD'?pv:0,pv:pv,q:false,pi:false};
        c.pv=pv; if(p&&!c.pi){ if(o.t==='CTU') c.cv=Math.min(c.cv+1,999); else c.cv=Math.max(c.cv-1,-99); } c.pi=p;
        c.q=o.t==='CTU'?c.cv>=c.pv:c.cv<=0; break; }
    }
  }
}

/* ---------- FABRİKA DÜNYASI ---------- */
class World{
  constructor(lv){ this.lv=lv; const s=lv.scene;
    this.sc=Object.assign({speed:20,gap:1.2,sensors:[],pistons:[],valves:[],lamps:[],endDrop:'err'},s); this.reset(); }
  mk(id){ return {id,x:0,st:'belt',py:0,fill:0,wait:0,ft:0,chk:false}; }
  reset(){
    this.t=0; this.boxes=[this.mk(1)]; this.nid=1; this.spawnT=0; this.err=null; this.done=false;
    this.delivered=0; this.diverted=0; this.filled=0; this.cntRises=0; this.batches=0;

  const I=['I0.0','I0.1','I0.2','I0.3','I0.4','I0.5','I0.6','I0.7'], Q=['Q0.0','Q0.1','Q0.2','Q0.3','Q0.4','Q0.5'];

  return '';
}

let drag=null;
function cellAt(x,y){ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('#rungs .cell'):null; }
function inPalette(x,y){ const el=document.elementFromPoint(x,y); return !!(el&&el.closest&&el.closest('#palette')); }
function dragClean(){ document.querySelectorAll('.cell.dz,.dragsrc').forEach(x=>x.classList.remove('dz','sw','dragsrc')); $('#ghost').style.display='none'; $('#palette').classList.remove('trash','hot'); refreshTool(); }
// hedef hücre için eylem: 'move' | 'swap' | hata mesajı
function dropAction(d,i,r,c){
  if(!d.from) return canPlace(d.t,i,r,c)||'new';
  const f=d.from; if(f.i===i&&f.r===r&&f.c===c) return 'x';
  const rs=S.prog.rungs, src=rs[f.i].c[f.r][f.c], dst=rs[i].c[r][c];
  if(r===1&&!rs[i].br) return 'x';
  rs[f.i].c[f.r][f.c]=null;
  let res;
  if(!dst) res=canPlace(src.t,i,r,c)||'move';
  else { rs[i].c[r][c]=null; const a=canPlace(src.t,i,r,c), b=canPlace(dst.t,f.i,f.r,f.c); rs[i].c[r][c]=dst; res=a||b?(a||b):'swap'; }
  rs[f.i].c[f.r][f.c]=src; return res;
}
$('#palette').addEventListener('pointerdown',e=>{ const b=e.target.closest('.pal'); if(!b||S.view) return; drag={t:b.dataset.t,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false}; });
$('#rungs').addEventListener('pointerdown',e=>{
  const ce=e.target.closest('.cell'); if(!ce||S.view) return;
  const i=+ce.closest('.rung').dataset.i, r=+ce.dataset.r, c=+ce.dataset.c, cell=S.prog.rungs[i].c[r][c]; if(!cell) return;
  drag={t:cell.t,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false,from:{i,r,c,el:ce}};
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  if(!drag.on){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y, dist=Math.hypot(dx,dy);
    if(drag.from){ if(dist<7) return; drag.from.el.classList.add('dragsrc'); $('#palette').classList.add('trash'); }
    else { if(dist<10) return; if(e.pointerType!=='mouse'&&Math.abs(dy)<Math.abs(dx)){ drag=null; return; } }
    drag.on=true; const g=$('#ghost'); g.innerHTML=palSym(drag.t)+'<span>'+(drag.from?drag.from.el.querySelector('.ad,.bt')?.textContent||BS[drag.t]:BS[drag.t])+'</span>'; g.style.display='flex';
    $('#rungs').dataset.tool=isOut(drag.t)?'o':'c'; Snd.init(); Snd.click();
  }
  e.preventDefault();
  $('#ghost').style.transform=`translate(${e.clientX-31}px,${e.clientY-64}px)`;
  const rb=$('#rungs').getBoundingClientRect();
  if(e.clientY<rb.top+28&&e.clientY>rb.top-40) $('#rungs').scrollTop-=7; else if(e.clientY>rb.bottom-28&&e.clientY<rb.bottom+4) $('#rungs').scrollTop+=7;
  if(drag.from) $('#palette').classList.toggle('hot',inPalette(e.clientX,e.clientY));
  const ce=cellAt(e.clientX,e.clientY);
  document.querySelectorAll('.cell.dz').forEach(x=>{ if(x!==ce) x.classList.remove('dz','sw'); });
  if(ce){ const a=dropAction(drag,+ce.closest('.rung').dataset.i,+ce.dataset.r,+ce.dataset.c);
    if(a==='new'||a==='move'||a==='swap'){ ce.classList.add('dz'); ce.classList.toggle('sw',a==='swap'); } }
},{passive:false});
document.addEventListener('touchmove',e=>{ if(drag&&drag.on) e.preventDefault(); },{passive:false});
window.addEventListener('pointerup',e=>{
  if(!drag||e.pointerId!==drag.pid) return; const d=drag; drag=null; dragClean();
  if(!d.on) return; justDragged=true; setTimeout(()=>justDragged=false,60); Snd.init();
  const rs=S.prog.rungs;
  if(d.from&&inPalette(e.clientX,e.clientY)){ rs[d.from.i].c[d.from.r][d.from.c]=null; saveDraft(); renderLadder(); Snd.click(); toast('Blok silindi'); return; }
  const ce=cellAt(e.clientX,e.clientY); if(!ce) return;
  const i=+ce.closest('.rung').dataset.i, r=+ce.dataset.r, c=+ce.dataset.c, a=dropAction(d,i,r,c);
  if(a==='new') openEditor(i,r,c,{t:d.t,a:null,pv:defPV(d.t)},true);
  else if(a==='move'){ rs[i].c[r][c]=rs[d.from.i].c[d.from.r][d.from.c]; rs[d.from.i].c[d.from.r][d.from.c]=null; saveDraft(); renderLadder(); Snd.place(); }
  else if(a==='swap'){ const t=rs[i].c[r][c]; rs[i].c[r][c]=rs[d.from.i].c[d.from.r][d.from.c]; rs[d.from.i].c[d.from.r][d.from.c]=t; saveDraft(); renderLadder(); Snd.place(); toast('Bloklar yer değiştirdi'); }
  else if(a!=='dolu'&&a!=='x') toast(a);
});
window.addEventListener('pointercancel',e=>{ if(drag&&e.pointerId===drag.pid){ drag=null; dragClean(); } });
/* ---------- Ladder çizimi ---------- */
function calcCW(){ const w=$('#rungs').clientWidth-12-30-10; return Math.max(54,Math.min(84,Math.floor(w/COLS))); }
function cellSVG(cell,r,c,cw,inSpan,brEmpty){
  const m=cw/2,y=22; let s=`<svg width="${cw}" height="44" viewBox="0 0 ${cw} 44">`;
  const tag=cell&&S.tags[cell.a]?S.tags[cell.a]:'';
  if(!cell){
    if(c<OUTC){
      if(r===0||inSpan) s+=`<path class="wl" d="M0 ${y}H${m}"/><path class="wr" d="M${m} ${y}H${cw}"/>`;
      s+=`<path class="plus" d="M${m-4} ${y}H${m+4}M${m} ${y-4}V${y+4}"/>`;
    } else s+=`<path class="wl" d="M0 ${y}H${m-14}"/><path class="ph" d="M${m-5} 10Q${m-13} ${y} ${m-5} 34M${m+5} 10Q${m+13} ${y} ${m+5} 34"/>`;
    return s+'</svg>';
  }
  const t=cell.t;
  if(t==='NO'||t==='NC'){
    s+=`<path class="wl" d="M0 ${y}H${m-8}"/><path class="wr" d="M${m+8} ${y}H${cw}"/><path class="sym" d="M${m-8} 11V33M${m+8} 11V33"/>`;
    if(t==='NC') s+=`<path class="sym" d="M${m-10} 31L${m+10} 13"/>`;
    s+=`<text class="ad" x="${m}" y="9">${cell.a}</text><text class="tg" x="${m}" y="43">${tag.slice(0,12)}</text>`;
  } else if(t==='COIL'||t==='SET'||t==='RST'){
    s+=`<path class="wl" d="M0 ${y}H${m-13}"/><path class="wr" d="M${m+13} ${y}H${cw}"/><path class="sym" d="M${m-5} 10Q${m-14} ${y} ${m-5} 34M${m+5} 10Q${m+14} ${y} ${m+5} 34"/>`;
    if(t!=='COIL') s+=`<text class="cl" x="${m}" y="26">${t==='SET'?'S':'R'}</text>`;
    s+=`<text class="ad" x="${m}" y="9">${cell.a}</text><text class="tg" x="${m}" y="43">${tag.slice(0,12)}</text>`;
  } else {
    s+=`<path class="wl" d="M0 ${y}H${m-26}"/><path class="wr" d="M${m+26} ${y}H${cw}"/><rect class="bx" x="${m-26}" y="3" width="52" height="38" rx="4"/>`;
    s+=`<text class="bt" x="${m}" y="17">${t} ${cell.a}</text><text class="bv" x="${m}" y="33"></text>`;
  }
  return s+'</svg>';
}
function tvStatic(o){ return (o.t==='TON'||o.t==='TOF')?`PT ${o.pv.toFixed(1)}s`:`PV ${o.pv}`; }
function renderLadder(){
  const box=$('#rungs'); const sc=box.scrollTop; box.innerHTML=''; LIVE=[];
  const cw=S.cw=calcCW();
  S.prog.rungs.forEach((rg,i)=>{
    const rows=rg.br?2:1, sp=branchSpan(rg);
    const el=document.createElement('div'); el.className='rung'; el.dataset.i=i;
    el.innerHTML=`<div class="gut"><span class="rn">R${i+1}</span><button class="rm">⋮</button></div><div class="grid" style="width:${cw*COLS+8}px;height:${rows*44}px"><div class="rail" style="left:0"></div><div class="rail" style="left:${cw*COLS+4}px"></div></div>`;
    const g=el.querySelector('.grid'); const L={cells:[[],[]],vl:null,vr:null,grid:g};
    for(let r=0;r<rows;r++) for(let c=0;c<COLS;c++){
      if(r===1&&c===OUTC) continue;
      const cell=rg.c[r][c]; const inSp=!!sp&&c>=sp.from&&c<=sp.to;
      const d=document.createElement('div'); d.dataset.r=r; d.dataset.c=c;
      d.style.cssText=`left:${4+c*cw}px;top:${r*44}px;width:${cw}px`;
      d._b='cell'+(cell?' full':(c===OUTC?' eo':' ec')); d.className=d._b;
      d.innerHTML=cellSVG(cell,r,c,cw,inSp); d._cell=cell; d._tv=d.querySelector('.bv'); if(d._tv) d._tv.textContent=tvStatic(cell);
      g.appendChild(d); L.cells[r][c]=d;
    }
    if(sp){ for(const [k,x] of [['vl',sp.from*cw+4],['vr',(sp.to+1)*cw+4]]){ const v=document.createElement('div'); v.className='vw'; v.style.cssText=`left:${x-1.5}px;top:22px;height:44px`; g.appendChild(v); L[k]=v; } }
    box.appendChild(el); LIVE.push(L);
  });
  if(S.prog.rungs.length<8&&!S.view){ const b=document.createElement('button'); b.id='addr'; b.textContent='＋ Satır Ekle'; box.appendChild(b); }
  box.scrollTop=sc; refreshTool();
}
function updateLive(){
  const res=plc.res, live=res.length===S.prog.rungs.length&&(S.running||world.err||world.done);
  S.prog.rungs.forEach((rg,i)=>{ const L=LIVE[i]; if(!L) return; const R=res[i], rows=rg.br?2:1, sp=branchSpan(rg);
    L.grid.classList.toggle('on',!!live);
    for(let r=0;r<rows;r++) for(let c=0;c<COLS;c++){
      const el=L.cells[r][c]; if(!el) continue; let k=el._b;
      if(live&&R){ let lp,rp,ps=false;
        if(c<OUTC){ lp=!!(R.in[r]&&R.in[r][c]); rp=!!(R.out[r]&&R.out[r][c]); ps=!!el._cell&&rp; }
        else { lp=rp=R.outIn; ps=R.outIn&&!!el._cell; }
        if(lp) k+=' lp'; if(rp) k+=' rp'; if(ps) k+=' ps';
        const o=el._cell; if(o&&el._tv){ const st=(o.t==='TON'||o.t==='TOF')?plc.T[o.a]:plc.C[o.a];
          if(st&&st.q) k+=' qq';
          el._tv.textContent=(o.t==='TON'||o.t==='TOF')?`${(st?st.et/1000:0).toFixed(1)}/${o.pv.toFixed(1)}s`:`${st?st.cv:(o.t==='CTD'?o.pv:0)}/${o.pv}`; }
      } else if(el._tv&&el._cell) el._tv.textContent=tvStatic(el._cell);
      if(el.className!==k) el.className=k;
    }
    if(sp&&L.vl){ const on=live&&R&&(R.in[0][sp.from]); const on2=live&&R&&(R.out[0][sp.to]||R.out[1][sp.to]);
      L.vl.classList.toggle('on',!!on); L.vr.classList.toggle('on',!!on2); }
  });
}

function rungMenu(i){

  <button class="mi" data-a="x">Kapat</button>`;

function allowed(t){
  const lv=S.lv, g=[]; const I=lv.io.I.map(d=>d.a), Q=lv.io.Q.map(d=>d.a);
  const M=[...Array(lv.M)].map((_,i)=>'M0.'+i), T=[...Array(lv.T)].map((_,i)=>'T'+(i+1)), C=[...Array(lv.C)].map((_,i)=>'C'+(i+1));
  const add=(n,l)=>{ if(l.length) g.push([n,l]); };
  if(t==='NO'||t==='NC'){ add('GİRİŞLER (I)',I); add('ÇIKIŞLAR (Q)',Q); add('HAFIZA (M)',M); add('ZAMANLAYICI (T)',T); add('SAYICI (C)',C); }
  else if(t==='COIL'||t==='SET'){ add('ÇIKIŞLAR (Q)',Q); add('HAFIZA (M)',M); }
  else if(t==='RST'){ add('ÇIKIŞLAR (Q)',Q); add('HAFIZA (M)',M); add('ZAMANLAYICI (T)',T); add('SAYICI (C)',C); }
  else if(t==='TON'||t==='TOF') add('ZAMANLAYICI (T)',T);
  else add('SAYICI (C)',C);
  return g;
}
function openEditor(i,r,c,cell,isNew){
  const t=cell.t, groups=allowed(t); let sel=cell.a||(groups[0]&&groups[0][1][0]); let pv=cell.pv;
  const tm=(t==='TON'||t==='TOF'), ct=(t==='CTU'||t==='CTD');
  const sh=$('#sheet');
  const draw=()=>{
    sh.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><div class="pal sel" style="flex:0 0 62px;height:46px">${palSym(t)}</div><div><h3>${BN[t]}</h3><div style="font-size:11px;color:var(--dim)">Adres seç ve istersen etiket yaz</div></div></div>`+
    groups.map(([n,l])=>`<div class="grp">${n}</div><div class="chips">${l.map(a=>`<button class="chip ${a===sel?'sel':''}" data-a="${a}">${a}<small>${S.tags[a]||'—'}</small></button>`).join('')}</div>`).join('')+
    `<div class="fld"><label>Etiket (Tag)</label><input id="tgIn" maxlength="14" placeholder="örn: Bant_Motor" value="${(S.tags[sel]||'').replace(/"/g,'')}"></div>`+
    (tm?`<div class="fld"><label>Süre</label><div class="step"><button class="btn" data-s="-">−</button><b>${pv.toFixed(1)} sn</b><button class="btn" data-s="+">＋</button></div></div>`:'')+
    (ct?`<div class="fld"><label>Hedef (PV)</label><div class="step"><button class="btn" data-s="-">−</button><b>${pv}</b><button class="btn" data-s="+">＋</button></div></div>`:'')+
    `<div class="brow">${isNew?'':'<button class="btn dan" id="mDel">🗑 Sil</button>'}<button class="btn wide" id="mCan">İptal</button><button class="btn pri wide" id="mOk">✓ Tamam</button></div>`;
  };
  draw(); openSheet();
  sh.onclick=e=>{
    const ch=e.target.closest('.chip'); if(ch){ const tg=$('#tgIn'); if(tg) S.tags[sel]=tg.value.trim()||S.tags[sel]||''; sel=ch.dataset.a; Snd.click(); draw(); return; }
    const st=e.target.closest('[data-s]'); if(st){ const up=st.dataset.s==='+'; if(tm) pv=Math.max(0.5,Math.min(30,pv+(up?0.5:-0.5))); else pv=Math.max(1,Math.min(20,pv+(up?1:-1))); const tg=$('#tgIn'); if(tg) S.tags[sel]=tg.value.trim(); Snd.click(); draw(); return; }
    if(e.target.id==='mCan'){ closeAll(); return; }
    if(e.target.id==='mDel'){ S.prog.rungs[i].c[r][c]=null; saveProg(); renderLadder(); Snd.click(); closeAll(); return; }
    if(e.target.id==='mOk'){ if(!sel){ toast('Bu blok için kullanılabilir adres yok'); return; }
      const tg=$('#tgIn'); if(tg) S.tags[sel]=tg.value.trim();
      const nc={t:t,a:sel}; if(tm||ct) nc.pv=pv; S.prog.rungs[i].c[r][c]=nc; saveProg(); renderLadder(); Snd.place(); closeAll(); }
  };
}

    if(d.k==='sw'){ ctx.fillStyle=on?'#3d2a07':'#10161d'; ctx.strokeStyle=col; ctx.lineWidth=2; rr(cx-17,cy-9,34,18,9); ctx.fill(); ctx.stroke(); ctx.fillStyle=on?col:'#59697b'; ctx.beginPath(); ctx.arc(on?cx+8:cx-8,cy,7,0,7); ctx.fill(); }
    else { ctx.fillStyle=on?col:'#10161d'; ctx.strokeStyle=col; ctx.lineWidth=3; if(on){ctx.shadowColor=col;ctx.shadowBlur=14;} ctx.beginPath(); ctx.arc(cx,cy,15,0,7); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0; }
    ctx.fillStyle='#cfe0f2'; ctx.font='800 9px system-ui'; ctx.textAlign='center'; ctx.fillText(d.n,cx,H-panelH+51); 
    hits.push({a:d.a,x:cx,y:cy,r:28}); });
  // HUD
  ctx.font='700 10px system-ui'; let cx=6,cy=6; w.goalList().forEach(gl=>{ const tx=(gl.ok?'✔ ':'○ ')+gl.l, tw=ctx.measureText(tx).width+12; if(cx+tw>W-6){cx=6;cy+=19;}
    ctx.fillStyle=gl.ok?'rgba(14,58,27,.9)':'rgba(0,0,0,.5)'; ctx.strokeStyle=gl.ok?'#39ff6a':'#3a4757'; ctx.lineWidth=1; rr(cx,cy,tw,16,8); ctx.fill(); ctx.stroke(); ctx.fillStyle=gl.ok?'#39ff6a':'#aab6c3'; ctx.textAlign='left'; ctx.fillText(tx,cx+6,cy+11.5); cx+=tw+5; });
  if(w.err){ ctx.strokeStyle='rgba(255,77,77,.9)'; ctx.lineWidth=5; ctx.strokeRect(2,2,W-4,H-4); }
  if(w.done){ ctx.strokeStyle='rgba(57,255,106,.9)'; ctx.lineWidth=5; ctx.strokeRect(2,2,W-4,H-4); }
}
cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  for(const h of hits){ if(Math.hypot(x-h.x,y-h.y)<=h.r){ Snd.init(); Snd.click(); if(!S.running){ toast('Önce ▶ RUN ile simülasyonu başlat'); return; } world.press(h.a); flash[h.a]=0.25; return; } } });

/* ---------- Ana döngü ---------- */
let last=performance.now(), acc=0, fr=0;
function scanOnce(){
  const iv=world.sense(); for(const k in iv) plc.b[k]=iv[k];
  const qs=S.lv.io.Q.map(d=>d.a), before=qs.map(a=>!!plc.b[a]);
  plc.scan(S.prog,20); world.advance(plc.b,SCAN);
  let ch=false,hs=false; qs.forEach((a,i)=>{ if(!!plc.b[a]!==before[i]){ ch=true; if(world.sc.pistons.some(p=>p.a===a)) hs=true; } });
  if(ch) Snd.relay(); if(hs) Snd.hiss();
  if(world.err) onFail(); else if(world.done) onWin();
}
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  for(const k in flash) if(flash[k]>0) flash[k]-=dt;
  if(S.running){ acc+=dt*S.speed; let n=0; while(acc>=SCAN&&n<300&&S.running){ scanOnce(); acc-=SCAN; n++; } } else acc=0;
  const mOpen=$('#menu').classList.contains('show');
  if(mOpen&&S.mscr==='main') drawMenuAnim(now);
  if(!mOpen){ drawScene(); if((fr++&1)===0) updateLive(); }
  requestAnimationFrame(frame);
}
function relayout(){ resizeCanvas(); if(S.prog){ const cw=calcCW(); if(cw!==S.cw) renderLadder(); } }
window.addEventListener('resize',relayout); if(window.ResizeObserver) new ResizeObserver(relayout).observe($('#sceneWrap'));
$('#bSnd').textContent=save.sound?'🔊':'🔇';
resizeCanvas(); loadLevel(save.last>=0&&save.last<TOTAL?save.last:0);
showMenu('main');
if(!save.intro){ card(`<h3>⚡ Ladder Ustası'na hoş geldin!</h3>${HOW}<div class="brow"><button class="btn pri wide" id="ok">Başlayalım</button></div>`,e=>{ if(e.target.id==='ok'){ save.intro=true; persist(); closeAll(); showMenu('main'); } }); }
requestAnimationFrame(frame);
</script></body></html>
