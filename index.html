<!DOCTYPE html>
<html lang="tr" data-theme="dark"><head><meta charset="utf-8">
<meta name="theme-color" content="#0d1117">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Ladder Master — PLC Logic Puzzle</title>
<style>
:root{--bg:#0d1117;--p1:#151b23;--p2:#1c242e;--ln:#2a3542;--tx:#d7dee7;--dim:#7d8a99;--neon:#39ff6a;--amb:#ffb020;--red:#ff4d4d;--blu:#4da3ff;--pur:#c77dff;
--okbg:#0f2a18;--okln:#1f7a37;--tx2:#cfe0f2;--tx3:#aab6c3;--redt:#ff9a9a;--danbg:#3b1414;--danln:#7a2323;--danhot:#5a1717;--wire:#3a4757;--ph:#2b3744;--bar:#222c37;--chip:#1d2733;
--sheet:#161d27;--selbg:#14263a;--ttl:#eafff0;--sym:#9fb0c2;--bv:#9fe8b3;--bxln:#6d8097;--rail:#46576b;--toast:#243242;--act:#26323f;--btn:#212c38;--ln2:#1b242e;--big:#161e28;
--bx:#141c25;--card:#141b24;--mglow:#132a1c;--gridl:#131b24;--qq:#12461f;--ed:#0f141b;--in:#0e141b;--bxon:#0d2615;--icb:#0b1016;--app:#06090d;--ov:rgba(3,6,10,.82);--glow:1;color-scheme:dark}
html[data-theme=light]{--bg:#eef2f6;--p1:#ffffff;--p2:#f2f5f8;--ln:#cdd6e0;--tx:#18212c;--dim:#5e6b7a;--neon:#11a843;--amb:#c77a00;--red:#d92b2b;--blu:#1c6fd1;--pur:#8a3fd1;
--okbg:#dcf6e4;--okln:#7fd39b;--tx2:#1f2b38;--tx3:#3c4856;--redt:#c42020;--danbg:#fde4e4;--danln:#efa3a3;--danhot:#f8c9c9;--wire:#a9b6c4;--ph:#c3cdd8;--bar:#dde3ea;--chip:#f2f5f8;
--sheet:#ffffff;--selbg:#dceafd;--ttl:#0b3d1c;--sym:#4c5b6b;--bv:#0e7a33;--bxln:#7f8fa1;--rail:#7d8c9c;--toast:#2a3644;--act:#e3e9f0;--btn:#eef2f6;--ln2:#dfe5ec;--big:#ffffff;
--bx:#f6f8fa;--card:#ffffff;--mglow:#d6f3df;--gridl:#e4e9ef;--qq:#c6f0d3;--ed:#f7f9fb;--in:#ffffff;--bxon:#dcf6e4;--icb:#f2f5f8;--app:#cfd8e2;--ov:rgba(20,30,40,.45);--glow:0;color-scheme:light}
html[data-theme=light] #toast{color:#fff}
html[data-theme=light] .mm-title{text-shadow:0 2px 0 rgba(17,168,67,.25)}
html[data-theme=light] .mm-title span{text-shadow:none}
html[data-theme=light] #run,html[data-theme=light] .bigbtn.play{box-shadow:0 4px 14px rgba(17,168,67,.35)}
html[data-theme=light] .bigbtn.play{background:linear-gradient(90deg,#14b84a,#2fd864)}
html[data-theme=light] #run:not(.on){background:#2fd864}
html[data-theme=light] .btn.pri{background:#2fd864;border-color:#2fd864}
html[data-theme=light] .cell.lp .wl,html[data-theme=light] .cell.rp .wr,html[data-theme=light] .cell.ps .sym{filter:none}
.seg{display:flex;gap:6px;margin-bottom:6px}
.seg button{flex:1;height:42px;border-radius:10px;border:1.5px solid var(--ln);background:var(--chip);color:var(--tx);font-size:13.5px;font-weight:700}
.seg button.on{border-color:var(--neon);background:var(--okbg);color:var(--neon)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--app);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 40px #000}
#sceneWrap{flex:0 0 38%;min-height:210px;position:relative;border-bottom:2px solid var(--ln)}
#cv{width:100%;height:100%;display:block}
#err{position:absolute;left:8px;right:8px;bottom:62px;background:rgba(120,15,15,.95);border:2px solid var(--red);border-radius:10px;padding:10px 12px;display:none;z-index:5;box-shadow:0 0 18px rgba(255,77,77,.5)}
#err b{display:block;font-size:13.5px;line-height:1.35;margin-bottom:8px}
#err .row{display:flex;gap:8px}
#mid{background:var(--p1);padding:6px 8px 6px;border-bottom:1px solid var(--ln)}
#mtop{display:flex;align-items:center;gap:6px}
#title{flex:1;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#title small{color:var(--dim);font-weight:500;margin-right:6px}
.ib{background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:8px;min-width:36px;height:34px;font-size:16px;padding:0 8px}
.ib:active{background:var(--act)}
#task{font-size:11.5px;line-height:1.35;color:var(--tx3);margin:5px 0 6px;max-height:3.9em;overflow:hidden;cursor:pointer}
#ctrl{display:flex;gap:6px;align-items:center}
#run{flex:1;height:38px;border-radius:9px;border:0;font-weight:800;font-size:15px;letter-spacing:.5px;color:#06210f;background:var(--neon);box-shadow:0 0 12px rgba(57,255,106,.35)}
#run.on{background:var(--red);color:#fff;box-shadow:0 0 12px rgba(255,77,77,.4)}
#pill{font-size:10px;font-weight:800;padding:3px 7px;border-radius:99px;background:var(--bar);color:var(--dim);border:1px solid var(--ln)}
#pill.run{background:var(--okbg);color:var(--neon);border-color:var(--okln)}
#pill.bad{background:var(--danbg);color:var(--red);border-color:var(--danln)}
#editor{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--ed)}
#ehead{display:flex;align-items:center;gap:6px;padding:5px 8px;font-size:11px;color:var(--dim);border-bottom:1px solid var(--ln2)}
#ehead .sp{flex:1;line-height:1.25}
#ehead .sp b{color:var(--tx)}
.sm{background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:7px;height:28px;padding:0 9px;font-size:12px}
#rungs{flex:1;overflow-y:auto;overflow-x:hidden;padding:6px 6px 14px;-webkit-overflow-scrolling:touch}
.rung{display:flex;align-items:flex-start;margin-bottom:5px}
.gut{width:30px;flex:0 0 30px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1px 0}
.rn{font-size:10px;color:var(--dim);font-family:ui-monospace,monospace}
.rm{background:var(--chip);border:1px solid var(--ln);color:var(--dim);border-radius:6px;width:24px;height:22px;font-size:13px;line-height:1;padding:0}
.grid{position:relative;background:repeating-linear-gradient(0deg,transparent 0 43px,var(--gridl) 43px 44px)}
.rail{position:absolute;top:0;bottom:0;width:4px;background:var(--rail);border-radius:2px}
.grid.on .rail{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.cell{position:absolute;height:44px;border-radius:5px}
.cell svg{display:block;overflow:visible}
.cell svg *{fill:none;stroke-linecap:round}
.cell .wl,.cell .wr{stroke:var(--wire);stroke-width:2.5}
.cell .sym{stroke:var(--sym);stroke-width:2.5}
.cell .ad{fill:var(--tx2);stroke:none;font:600 9.5px ui-monospace,Menlo,monospace;text-anchor:middle}
.cell .tg{fill:var(--dim);stroke:none;font:8.5px system-ui;text-anchor:middle}
.cell .ph{stroke:var(--ph);stroke-width:1.5;stroke-dasharray:3 3}
.cell .plus{stroke:var(--ph);stroke-width:2}
.cell .bx{fill:var(--bx);stroke:var(--bxln);stroke-width:2}
.cell .bt{fill:var(--tx2);stroke:none;font:700 10px ui-monospace,monospace;text-anchor:middle}
.cell .bv{fill:var(--bv);stroke:none;font:600 9.5px ui-monospace,monospace;text-anchor:middle}
.cell .cl{fill:var(--tx2);stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.cell.lp .wl,.cell.rp .wr{stroke:var(--neon);filter:drop-shadow(0 0 3px var(--neon))}
.cell.ps .sym{stroke:var(--neon);filter:drop-shadow(0 0 3px var(--neon))}
.cell.ps .bx{stroke:var(--neon);fill:var(--bxon)}
.cell.ps .cl{fill:var(--neon)}
.cell.qq .bx{fill:var(--qq)}
.vw{position:absolute;width:3px;background:var(--wire);border-radius:2px}
.vw.on{background:var(--neon);box-shadow:0 0 6px var(--neon)}
#rungs[data-tool="c"] .cell.ec,#rungs[data-tool="o"] .cell.eo{background:rgba(77,163,255,.12);outline:1.5px dashed var(--blu);animation:pl 1s infinite}
@keyframes pl{50%{background:rgba(77,163,255,.25)}}
#addr{margin:2px 0 0 30px;width:calc(100% - 30px);height:34px;border:1.5px dashed var(--ph);background:transparent;color:var(--dim);border-radius:8px;font-size:12px}
#palette{flex:0 0 66px;display:flex;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;background:var(--p1);border-top:2px solid var(--ln)}
.pal{flex:0 0 62px;border-radius:9px;background:var(--p2);border:1.5px solid var(--ln);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;font-size:9px}
.pal svg{display:block}
.pal svg *{fill:none;stroke:var(--sym);stroke-width:2.2;stroke-linecap:round}
.pal svg text{fill:var(--tx2);stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.pal.sel{border-color:var(--blu);background:var(--selbg);box-shadow:0 0 10px rgba(77,163,255,.5)}
.ov{position:absolute;inset:0;background:var(--ov);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.ov.mid{align-items:center}
#ovCard{z-index:30}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--sheet);border:1px solid var(--ln);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.card{width:90%;max-height:90%;overflow-y:auto;background:var(--sheet);border:1px solid var(--ln);border-radius:16px;padding:16px;text-align:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3,.card h3{margin:0 0 4px;font-size:16px}
.grp{font-size:10px;color:var(--dim);margin:10px 0 4px;letter-spacing:.8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1.5px solid var(--ln);color:var(--tx);border-radius:9px;padding:5px 9px;font:600 12px ui-monospace,monospace;text-align:left;min-width:62px}
.chip small{display:block;font:9px system-ui;color:var(--dim)}
.chip.sel{border-color:var(--neon);background:var(--okbg);box-shadow:0 0 8px rgba(57,255,106,.35)}
.fld{display:flex;gap:8px;align-items:center;margin-top:10px}
.fld label{font-size:11px;color:var(--dim);flex:0 0 70px}
.fld input{flex:1;height:34px;background:var(--in);border:1.5px solid var(--ln);border-radius:8px;color:var(--tx);padding:0 10px;font-size:14px;user-select:text;-webkit-user-select:text}
.step{display:flex;align-items:center;gap:10px}
.step b{font:700 16px ui-monospace,monospace;min-width:64px;text-align:center;color:var(--amb)}
.btn{height:42px;border-radius:10px;border:1.5px solid var(--ln);background:var(--btn);color:var(--tx);font-size:14px;font-weight:700;padding:0 14px}
.btn.pri{background:var(--neon);color:#06210f;border-color:var(--neon)}
.btn.dan{background:var(--danbg);border-color:var(--danln);color:var(--redt)}
.btn.wide{flex:1}
.brow{display:flex;gap:8px;margin-top:14px}
.mi{display:block;width:100%;text-align:left;height:46px;margin-bottom:6px;background:var(--chip);border:1.5px solid var(--ln);border-radius:10px;color:var(--tx);font-size:14px;padding:0 14px}
#menu{background:var(--bg)}
#menu .sheet{height:100%;max-height:100%;border-radius:0;background:var(--bg);border:0}
.cat{margin:14px 0 6px;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--amb)}
.cat small{display:block;color:var(--dim);font-weight:500;letter-spacing:0}
.lvs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:12px;background:var(--p2);border:1.5px solid var(--ln);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.lv small{font-size:10px;color:var(--amb);letter-spacing:1px;min-height:12px}
.lv.lock{opacity:.4}
.lv.cur{border-color:var(--neon)}
.stars{font-size:30px;letter-spacing:6px;color:var(--wire);margin:6px 0}
.stars .f{color:var(--amb);text-shadow:0 0 12px var(--amb)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--toast);border:1px solid var(--wire);color:var(--tx);font-size:12.5px;padding:8px 14px;border-radius:99px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
p.t{font-size:13px;line-height:1.5;color:var(--tx3);text-align:left;margin:8px 0}

.pal{touch-action:pan-x}
#doneBar{flex:0 0 66px;display:none;align-items:center;gap:10px;padding:8px 10px;background:var(--okbg);border-top:2px solid var(--okln);font-size:12.5px;line-height:1.3}
#doneBar span{flex:1}
#doneBar b{color:var(--neon)}
#ghost{position:fixed;left:0;top:0;width:62px;height:54px;border-radius:10px;background:var(--selbg);border:1.5px solid var(--blu);box-shadow:0 6px 18px rgba(0,0,0,.6),0 0 14px rgba(77,163,255,.6);display:none;flex-direction:column;align-items:center;justify-content:center;font-size:9px;color:var(--tx);pointer-events:none;z-index:99;opacity:.95}
#ghost svg *{fill:none;stroke:var(--tx2);stroke-width:2.2;stroke-linecap:round}
#ghost svg text{fill:var(--tx2);stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.cell.dz{background:rgba(57,255,106,.25)!important;outline:2px solid var(--neon)!important;animation:none!important}
.cell.dragsrc{opacity:.35}
.cell.full{touch-action:none;cursor:grab}
.cell.dz.sw{background:rgba(255,176,32,.25)!important;outline-color:var(--amb)!important}
#palette.trash{background:var(--danbg);border-top-color:var(--red)}
#palette.trash>*{opacity:.15}
#palette.trash::after{content:attr(data-trash);position:absolute;left:0;right:0;text-align:center;line-height:54px;color:var(--redt);font-weight:800;font-size:14px}
#palette.trash.hot{background:var(--danhot);box-shadow:inset 0 0 20px rgba(255,77,77,.6)}
#palette{position:relative}
#menu{background:radial-gradient(120% 70% at 50% 0%,var(--mglow) 0%,var(--bg) 55%)}
#menu .sheet{background:transparent}
.mm{display:flex;flex-direction:column;gap:10px;min-height:100%;padding-bottom:10px}
#mcv{width:100%;height:150px;display:block}
.mm-title{text-align:center;font-weight:900;font-size:40px;letter-spacing:3px;line-height:1;color:var(--ttl);text-shadow:0 0 10px var(--neon),0 0 28px rgba(57,255,106,.55);margin-top:2px}
.mm-title span{display:block;font-size:26px;letter-spacing:10px;color:var(--amb);text-shadow:0 0 12px rgba(255,176,32,.6);margin-top:4px}
.mm-sub{text-align:center;font-size:10.5px;letter-spacing:2.5px;color:var(--dim);margin-bottom:6px}
.pts{align-self:center;background:var(--okbg);border:1.5px solid var(--okln);color:var(--neon);font-weight:800;border-radius:99px;padding:6px 16px;font-size:14px;margin-bottom:6px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--ln);background:var(--big);color:var(--tx);font-size:16px;font-weight:800}
.bigbtn small{font-weight:500;color:var(--dim);font-size:11px}
.bigbtn.play{min-height:62px;font-size:22px;letter-spacing:2px;color:#06210f;border:0;background:linear-gradient(90deg,#22d957,#39ff6a);box-shadow:0 0 24px rgba(57,255,106,.45)}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topbar h3{flex:1;margin:0;font-size:17px}
.topbar .pp{color:var(--neon);font-weight:800;font-size:13px}
.ccard{display:flex;gap:12px;align-items:center;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--ln);background:var(--card);text-align:left;color:var(--tx);margin-bottom:10px}
.ccard .ic{flex:0 0 58px;height:58px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--icb);border:1.5px solid currentColor}
.ccard .ic svg *{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
.ccard .ic svg text{fill:currentColor;stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.ccard .bd{flex:1;min-width:0}
.ccard b{display:block;font-size:17px}
.ccard small{display:block;color:var(--dim);font-size:11.5px;margin-top:2px}
.ccard .cnt{font:800 13px ui-monospace,monospace;color:var(--tx)}
.bar{height:6px;border-radius:3px;background:var(--bar);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:3px}
.lvs5{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.lv5{aspect-ratio:1;border-radius:10px;background:var(--p2);border:1.5px solid var(--ln);color:var(--tx);font:800 15px ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}
.lv5 small{font-size:10px;line-height:1}
.lv5.dn{background:var(--okbg);border-color:var(--okln);color:var(--neon)}
.lv5.lock{opacity:.35}
.lv5.cur{box-shadow:0 0 0 2px var(--blu)}
.gain{font-size:28px;font-weight:900;color:var(--amb);text-shadow:0 0 14px rgba(255,176,32,.6);margin:8px 0}
.prow{display:flex;align-items:center;gap:8px;font-size:12px;margin:6px 0}
.prow span{flex:0 0 46px;color:var(--dim)}
.prow .bar{flex:1;margin:0}
.prow b{flex:0 0 54px;text-align:right;font-family:ui-monospace,monospace}
.pal{position:relative}
.pal .nw{position:absolute;top:-4px;right:-4px;background:var(--amb);color:#1d1300;font:800 8px system-ui;font-style:normal;padding:2px 4px;border-radius:6px;box-shadow:0 0 8px var(--amb);animation:pl 1.2s infinite}
.nwt{font:800 11px system-ui;letter-spacing:1.5px;color:var(--amb);margin-bottom:8px}
.el{text-align:left}
.el .eh{display:flex;align-items:center;gap:10px}
.el .eh b{font-size:16px}
.ex{background:var(--ed);border:1px solid var(--ln);border-radius:10px;padding:8px 10px;margin-top:6px}
.ex small{display:block;color:var(--tx3);font-size:12px;line-height:1.4;margin-bottom:6px}
.rs{display:block;margin:2px 0}
.rs .w{fill:none;stroke:var(--neon);stroke-width:2}
.rs .rl{fill:none;stroke:var(--neon);stroke-width:3.5;stroke-linecap:round}
.rs .bg{fill:var(--ed);stroke:none}
.rs svg *{fill:none;stroke:var(--neon);stroke-width:2.2;stroke-linecap:round}
.rs svg text{fill:var(--neon);stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.rs .ad{fill:var(--tx2);font:600 9.5px ui-monospace,monospace;text-anchor:middle}
.elist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.elb{display:flex;align-items:center;gap:4px;background:var(--chip);border:1.5px solid var(--ln);border-radius:9px;padding:3px 8px 3px 3px;color:var(--tx);font-size:11.5px;font-weight:700}
.elb svg{transform:scale(.8)}

.elb svg text,.el .pal svg text{fill:var(--tx2);stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.elb.on{border-color:var(--neon);background:var(--okbg)}
.gcard{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:10px;margin-bottom:8px}
.acct{align-self:center;background:transparent;border:1.5px solid var(--ln);color:var(--tx);border-radius:99px;padding:6px 16px;font-size:13px;margin:-2px 0 4px}
.brow2{display:flex;gap:10px}.brow2 .bigbtn{flex:1;font-size:15px}
.prof{display:flex;flex-direction:column;align-items:center;gap:4px;margin:6px 0 10px}
.prof .av{width:64px;height:64px;border-radius:50%;background:var(--okbg);border:2px solid var(--neon);color:var(--neon);display:flex;align-items:center;justify-content:center;font:900 28px system-ui}
.prof b{font-size:19px}.prof span{color:var(--neon);font-weight:800}
.myr{background:var(--okbg);border:1.5px solid var(--okln);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px}
.lb{display:flex;flex-direction:column;gap:6px}

<script>
'use strict';
let LANG='tr';
const tx=(a,b)=>LANG==='en'?b:a;
const fx=x=>LANG==='en'?String(x):String(x).replace('.',',');
/* ===== PLC LADDER BULMACA — MANTIK ÇEKİRDEĞİ ===== */
const COLS=5, OUTC=4, SCAN=0.02, BW=4, PIST_V=3;
const OUTT=['COIL','SET','RST','TON','TOF','CTU','CTD'];
const isOut=t=>OUTT.indexOf(t)>=0;
function parseCell(s){ if(!s) return null; const p=s.split(' '); const o={t:p[0],a:p[1]}; if(p[2]!==undefined) o.pv=parseFloat(p[2]); return o; }
function mkRung(){ return {br:false,c:[Array(COLS).fill(null),Array(COLS).fill(null)]}; }
function R(row0,row1){ const rg=mkRung(); rg.br=!!row1; row0.forEach((s,i)=>{rg.c[0][i]=parseCell(s);}); if(row1) row1.forEach((s,i)=>{rg.c[1][i]=parseCell(s);}); return rg; }
function countBlocks(p){ let n=0; for(const rg of p.rungs) for(const row of rg.c) for(const c of row) if(c) n++; return n; }
function branchSpan(rg){ let f=-1,t=-1; if(rg.br) for(let c=0;c<OUTC;c++) if(rg.c[1][c]){ if(f<0) f=c; t=c; } return f<0?null:{from:f,to:t}; }

/* ---------- PLC (sanal scan cycle) ---------- */
class PLC{
  constructor(){ this.reset(); }
  reset(){ this.b={}; this.T={}; this.C={}; this.res=[]; }
  rd(a){ const k=a[0]; if(k==='T') return !!(this.T[a]&&this.T[a].q); if(k==='C') return !!(this.C[a]&&this.C[a].q); return !!this.b[a]; }
  scan(prog,dt){ this.res=[]; for(const rg of prog.rungs) this.res.push(this.rung(rg,dt)); }
  rung(rg,dt){
    const Rs={in:[[],[]],out:[[],[]],outIn:false};
    const pass=(r,c)=>{ const x=rg.c[r][c]; if(!x||isOut(x.t)) return true; const v=this.rd(x.a); return x.t==='NC'?!v:v; };
    const sp=branchSpan(rg); let p=true,c=0;
    while(c<OUTC){
      if(sp&&c===sp.from){
        let pa=p,pb=p;
        for(let k=sp.from;k<=sp.to;k++){ Rs.in[0][k]=pa; pa=pa&&pass(0,k); Rs.out[0][k]=pa; Rs.in[1][k]=pb; pb=pb&&pass(1,k); Rs.out[1][k]=pb; }
        p=pa||pb; c=sp.to+1;
      } else { Rs.in[0][c]=p; p=p&&pass(0,c); Rs.out[0][c]=p; c++; }
    }
    Rs.outIn=p;
    const o=rg.c[0][OUTC]; if(o&&isOut(o.t)) this.exec(o,p,dt);
    return Rs;
  }
  exec(o,p,dt){
    const a=o.a;
    switch(o.t){
      case 'COIL': this.b[a]=p; break;
      case 'SET': if(p) this.b[a]=true; break;
      case 'RST': if(p){
        if(a[0]==='T'){ const t=this.T[a]; if(t){ t.et=0; t.q=false; } }
        else if(a[0]==='C'){ const c=this.C[a]; if(c){ c.cv=c.type==='CTD'?c.pv:0; c.q=c.type==='CTD'?c.cv<=0:c.cv>=c.pv; } }
        else this.b[a]=false; } break;
      case 'TON': { let t=this.T[a]; if(!t||t.type!=='TON') t=this.T[a]={type:'TON',et:0,q:false,pv:0};
        t.pv=(o.pv||2)*1000; if(p){ t.et=Math.min(t.et+dt,t.pv); t.q=t.et>=t.pv; } else { t.et=0; t.q=false; } break; }
      case 'TOF': { let t=this.T[a]; if(!t||t.type!=='TOF') t=this.T[a]={type:'TOF',et:0,q:false,pv:0};
        t.pv=(o.pv||2)*1000; if(p){ t.q=true; t.et=0; } else if(t.q){ t.et+=dt; if(t.et>=t.pv){ t.et=t.pv; t.q=false; } } break; }
      case 'CTU': case 'CTD': { let c=this.C[a]; const pv=o.pv||3;
        if(!c||c.type!==o.t) c=this.C[a]={type:o.t,cv:o.t==='CTD'?pv:0,pv:pv,q:false,pi:false};
        c.pv=pv; if(p&&!c.pi){ if(o.t==='CTU') c.cv=Math.min(c.cv+1,999); else c.cv=Math.max(c.cv-1,-99); } c.pi=p;
        c.q=o.t==='CTU'?c.cv>=c.pv:c.cv<=0; break; }
    }
  }
}

/* ---------- FABRİKA DÜNYASI ---------- */
class World{
  constructor(lv){ this.lv=lv; const s=lv.scene;
    this.sc=Object.assign({speed:20,gap:1.2,sensors:[],pistons:[],valves:[],lamps:[],endDrop:'err'},s); this.reset(); }
  mk(id){ return {id,x:0,st:'belt',py:0,fill:0,wait:0,ft:0,chk:false}; }
  reset(){
    this.t=0; this.boxes=[this.mk(1)]; this.nid=1; this.spawnT=0; this.err=null; this.done=false;
    this.delivered=0; this.diverted=0; this.filled=0; this.cntRises=0; this.batches=0;
    this.sw={}; this.pulse={}; this.ext={}; this.f={}; this.gd=this.lv.goals.map(()=>false); this.iv={};
    this.sc.pistons.forEach(p=>{this.ext[p.a]=0;});
    this.motor=false; this.pm=false; this.beltOff=0; this.fanAng=0; this.idleT=0; this.spill=0; this.nofan=0;
    this.startPressed=false; this.startFall=null; this.pS=false; this.noStart=0; this.pP=false; this.stopWatch=0; this.stopPressT=null;
    this.pc=false; this.pendB=null; this.parkT=0; this.lpT=0; this.pA=false; this.ackSeen=false; this.pl=false;
    this.lrT=0; this.loT=0; this.andT=0; this.orT=0; this.atT=0; this.oa=0; this.ob=0; this.pkS=null; this.pLd=false; this.pSrc=false; this.srcFall=null; this.pLt=false; this.pLc=false; this.startAt=null; this.sdLamp=0; this.mFall=null; this.prevSp=false; this.prevFan=false; this.sprayOffT=null; this.q={}; this.shake=0;
  }
  fail(m){ if(!this.err&&!this.done) this.err=m; return false; }
  press(a){ const d=this.lv.io.I.find(x=>x.a===a); if(!d) return; if(d.k==='btn') this.pulse[a]=0.3; else if(d.k==='sw') this.sw[a]=!this.sw[a]; }
  sensorOn(a){ const s=this.sc.sensors.find(s=>s.a===a); if(!s) return false; return this.boxes.some(b=>b.st==='belt'&&Math.abs(b.x-s.x)<=BW); }
  sense(){
    const iv={};
    for(const d of this.lv.io.I){
      if(d.k==='btn') iv[d.a]=(this.pulse[d.a]||0)>0;
      else if(d.k==='sw') iv[d.a]=!!this.sw[d.a];
      else if(d.k==='sensor') iv[d.a]=this.sensorOn(d.a);
      else if(d.k==='limit'){ const p=this.sc.pistons.find(p=>p.lim===d.a); iv[d.a]=!!p&&this.ext[p.a]>=0.98; }
    }
    this.iv=iv; return iv;
  }
  advance(q,dt){
    if(this.err||this.done) return;
    const sc=this.sc; this.q=q; this.t+=dt;
    for(const k in this.pulse) if(this.pulse[k]>0) this.pulse[k]=Math.max(0,this.pulse[k]-dt);
    this.motor=!!q[sc.motor];
    for(const p of sc.pistons){ const tg=q[p.a]?1:0, e=this.ext[p.a], d=tg-e, st=PIST_V*dt; this.ext[p.a]=Math.abs(d)<=st?tg:e+Math.sign(d)*st; }
    if(this.motor){ this.beltOff=(this.beltOff+sc.speed*dt)%1000; for(const b of this.boxes) if(b.st==='belt') b.x+=sc.speed*dt; }
    if(sc.fan&&q[sc.fan.a]) this.fanAng+=dt*14;
    // piston itme
    for(const p of sc.pistons){ if(this.ext[p.a]>0.3){ for(const b of this.boxes){ if(b.st==='belt'&&Math.abs(b.x-p.x)<=6){
      b.st='pushed'; b.py=0;
      if(sc.divertIf&&!this.iv[sc.divertIf]) return this.fail(tx('Hata: Onay anahtarı kapalıyken kutu ayrıldı!','Error: Box diverted while the approval key was OFF!'));
      if(sc.divertEvery&&b.id%sc.divertEvery!==0) return this.fail(tx('Hata: Yanlış kutu ayrıldı! Yalnızca her '+sc.divertEvery+'. kutu ayrılmalı.','Error: Wrong box diverted! Only every '+sc.divertEvery+'th box should be diverted.'));
      if(sc.waitRange){ if(b.wait<sc.waitRange[0]) return this.fail(tx('Hata: Piston çok erken itti! Kutu sensörde beklemeliydi.','Error: Piston pushed too early! The box had to wait at the sensor.')); if(b.wait>sc.waitRange[1]) return this.fail(tx('Hata: Kutu sensörde çok uzun bekletildi!','Error: Box was held at the sensor too long!')); }
    } } } }
    for(const b of this.boxes){
      if(b.st==='pushed'){ const e=Math.max(...sc.pistons.map(p=>this.ext[p.a]),0); b.py=Math.min(1,Math.max(b.py+4*dt,e)); if(b.py>=1){ b.st='bin'; b.ft=0; this.diverted++; } }
      else if(b.st==='bin'||b.st==='end'||b.st==='removed') b.ft+=dt;
    }
    this.boxes=this.boxes.filter(b=>!((b.st==='end'&&b.ft>0.8)||(b.st==='removed'&&b.ft>0.6)||(b.st==='bin'&&b.ft>1.8)));
    // bekleme süresi
    if(sc.waitSensor){ const s=sc.sensors.find(s=>s.a===sc.waitSensor); for(const b of this.boxes) if(b.st==='belt'&&Math.abs(b.x-s.x)<=BW) b.wait+=dt; }
    // bant sonu
    for(const b of this.boxes){ if(b.st==='belt'&&b.x>=100){
      if(sc.divertEvery&&b.id%sc.divertEvery===0) return this.fail(tx('Hata: '+b.id+'. kutu ayrılmadan bant sonuna ulaştı!','Error: Box #'+b.id+' reached the end of the belt without being diverted!'));
      if(sc.divertIf&&this.iv[sc.divertIf]) return this.fail(tx('Hata: Onay anahtarı açıkken kutu ayrılmadı!','Error: Box was not diverted while the approval key was ON!'));
      if(sc.endDrop==='deliver'){ b.st='end'; b.ft=0; this.delivered++; if(b.fill>=0.95) this.filled++; }
      else return this.fail((sc.endMsg||tx('Hata: Kutu ayrılmadan bant sonuna ulaştı!','Error: Box reached the end of the belt without being diverted!')));
    } }
    // valfler
    for(const v of sc.valves){
      if(q[v.a]){ const tg=this.boxes.find(b=>b.st==='belt'&&Math.abs(b.x-v.x)<=6);
        if(tg){ tg.fill+=dt/v.fillTime; this.spill=0; if(tg.fill>1.3) return this.fail(v.kind==='spray'?tx('Hata: Fazla boya sıkıldı!','Error: Too much paint sprayed!'):tx('Hata: Şişe taştı! Valf çok uzun açık kaldı.','Error: Bottle overflowed! Valve stayed open too long.')); }
        else { this.spill+=dt; if(this.spill>0.6) return this.fail(v.kind==='spray'?tx('Hata: Boş kabine boya püskürtüldü!','Error: Paint sprayed into an empty booth!'):tx('Hata: Valf boşta açıldı, sıvı döküldü!','Error: Valve opened with no bottle, liquid spilled!')); } }
      else this.spill=0;
      for(const b of this.boxes) if(b.st==='belt'&&b.x>v.x+6&&b.fill<0.95&&!b.chk){ b.chk=true; return this.fail(v.kind==='spray'?tx('Hata: Kutu boyanmadan kabinden çıktı!','Error: Box left the booth unpainted!'):tx('Hata: Şişe dolmadan istasyondan geçti!','Error: Bottle passed the station without being filled!')); }
    }
    // spawn
    if(this.nid<sc.boxes){ this.spawnT+=dt; if(this.spawnT>=sc.gap&&!this.boxes.some(b=>b.st==='belt'&&b.x<14)){ this.boxes.push(this.mk(++this.nid)); this.spawnT=0; } }
    if(!this.checks(q,dt)) return;
    this.pm=this.motor;
    // hedefler
    const gl=this.goalList(); gl.forEach((g,i)=>{ if(g.ok) this.gd[i]=true; });
    if(this.gd.every(Boolean)){ this.done=true; return; }
    const active=this.boxes.some(b=>b.st==='belt'||b.st==='pushed');
    if(this.nid>=sc.boxes&&!active){ this.idleT+=dt; if(this.idleT>4.5) return this.fail(tx('Hedefe ulaşılamadı: kutular bitti. Programı gözden geçir.','Goal not reached: out of boxes. Review your program.')); } else this.idleT=0;
    if(this.t>240) this.fail(tx('Zaman aşımı: görev süresi doldu.','Timeout: task time is up.'));
  }
  checks(q,dt){
    const sc=this.sc, iv=this.iv||{}, goals=this.lv.goals;
    if(sc.startA){
      const s=!!iv[sc.startA];
      if(s&&!this.pS){ this.startPressed=true; this.startFall=null; this.stopPressT=null; this.startAt=this.t; this.sdLamp=0; }
      if(!s&&this.pS) this.startFall=this.t;
      this.pS=s;
      if(sc.startFirst&&!this.startPressed&&this.motor){ this.noStart+=dt; if(this.noStart>0.4) return this.fail(tx('Hata: START\'a basılmadan bant çalıştı!','Error: Belt ran before START was pressed!')); }
      if(this.startPressed&&!s&&this.startFall!==null&&this.t-this.startFall>=0.8&&this.motor) this.f.seal=true;
    }
    if(sc.stopA){
      const s=!!iv[sc.stopA];
      if(s&&!this.pP){ this.stopWatch=this.pm?0.6:0; this.stopPressT=this.pm?this.t:null; }
      this.pP=s;
      if(this.stopWatch>0){ this.stopWatch-=dt; if(!this.motor){ this.f.stop=true; this.stopWatch=0; } }
    }
    if(sc.stopDelay&&this.pm&&!this.motor&&this.stopPressT!==null){
      const td=sc.stopDelay===true?3:sc.stopDelay, d=this.t-this.stopPressT; this.stopPressT=null;
      if(d>=td-0.4&&d<=td+0.6) this.f.stopDelay=true; else return this.fail(tx('Hata: Bant STOP\'tan '+fx(d.toFixed(1))+' sn sonra durdu. Gecikme ≈'+fx(td)+' sn olmalı!','Error: Belt stopped '+d.toFixed(1)+' s after STOP. Delay should be ≈'+td+' s!'));
    }
    if(sc.countSensor){
      if(this.motor&&!this.pm) this.cntRises=0;
      const on=this.sensorOn(sc.countSensor); if(on&&!this.pc) this.cntRises++; this.pc=on;
      if(this.motor&&this.cntRises>sc.batchN) return this.fail(tx('Hata: Bant '+sc.batchN+' kutudan sonra durmadı!','Error: Belt did not stop after '+sc.batchN+' boxes!'));
      if(!this.motor&&this.pm&&this.cntRises===sc.batchN) this.pendB=0.5;
    }
    if(this.pendB!==null){ this.pendB-=dt; if(this.pendB<=0){ this.pendB=null; if(q[sc.lampA]) this.batches++; else return this.fail(tx('Hata: Parti tamamlandı ama lamba yanmadı!','Error: Batch finished but the lamp did not light!')); } }
    const pk=goals.find(g=>g.k==='park');
    if(pk){ if(!this.motor&&this.sensorOn(pk.s)) this.parkT+=dt; else this.parkT=0; }
    if(sc.lampA&&pk){ if(this.parkT>0&&q[sc.lampA]) this.lpT+=dt; if(this.lpT>=0.8) this.f.lampPark=true; }
    if(sc.ackA){
      const a=!!iv[sc.ackA];
      if(a&&!this.pA){ if(this.pl) this.ackSeen=true;
        const s=sc.sensors[0]; if(!this.motor) for(const b of this.boxes) if(b.st==='belt'&&Math.abs(b.x-s.x)<=BW){ b.st='removed'; b.ft=0; } }
      this.pA=a;
      if(this.pl&&!q[sc.lampA]&&this.ackSeen&&this.f.lampPark) this.f.lampAck=true;
      this.pl=!!q[sc.lampA];
    }
    if(goals.some(g=>g.k==='lampRun')){
      if(this.motor&&q[sc.lampA]) this.lrT+=dt;
      if(!this.motor&&this.parkT>0.2&&!q[sc.lampA]) this.loT+=dt;
      if(this.lrT>=1&&this.loT>=0.5) this.f.lampRun=true;
    }
    if(goals.some(g=>g.k==='lampPush')){ const e=Math.max(...sc.pistons.map(p=>this.ext[p.a]),0); if(q[sc.lampA]&&e>0.4) this.f.lampPush=true; }
    if(sc.fan){
      const sp=!!q[sc.fan.spray], fn=!!q[sc.fan.a];
      if(sp&&!fn){ this.nofan+=dt; if(this.nofan>0.15) return this.fail(tx('Hata: Egzoz fanı kapalıyken boya püskürtüldü!','Error: Paint sprayed while the exhaust fan was off!')); } else this.nofan=0;
      if(this.prevSp&&!sp) this.sprayOffT=this.t;
      if(this.prevFan&&!fn&&this.sprayOffT!==null){ const d=this.t-this.sprayOffT;
        const h=sc.fan.hold||3; if(d<h-0.4) return this.fail(tx('Hata: Fan çok erken durdu! Buhar için '+fx(h)+' sn beklemeli.','Error: Fan stopped too early! It must run '+h+' s for the fumes.')); if(d<=h+0.6) this.f.fanHold=true; }
      this.prevSp=sp; this.prevFan=fn;
    }
    if(sc.motorAnd){ if(this.motor&&!sc.motorAnd.every(a=>iv[a])){ this.andT+=dt; if(this.andT>0.3) return this.fail(tx('Hata: Bant yalnızca iki şalter de açıkken çalışmalı!','Error: Belt must run only when BOTH switches are ON!')); } else this.andT=0; }
    if(sc.motorAnd){ const on=sc.motorAnd.filter(a=>iv[a]).length; if(on===1&&!this.motor){ this.atT+=dt; if(this.atT>=0.8) this.f.andTest=true; } }
    if(sc.motorOr){ const [a,b]=sc.motorOr; if(this.motor&&iv[a]&&!iv[b]) this.oa+=dt; if(this.motor&&iv[b]&&!iv[a]) this.ob+=dt; if(this.oa>=0.5&&this.ob>=0.5) this.f.orTest=true; }
    if(sc.motorOr){ const any=sc.motorOr.some(a=>iv[a]), sOn=sc.sensors.some(s=>this.sensorOn(s.a)); if(any&&!this.motor&&!sOn){ this.orT+=dt; if(this.orT>0.5) return this.fail(tx('Hata: Şalterlerden herhangi biri açıkken bant çalışmalı!','Error: Belt must run when EITHER switch is ON!')); } else this.orT=0; }
    if(sc.lampDelay){ const par=!this.motor&&this.sensorOn(sc.lampDelay.s); if(par&&this.pkS===null) this.pkS=this.t; if(!par) this.pkS=null;
      const lp=!!q[sc.lampA]; if(lp&&!this.pLd){ const T=sc.lampDelay.t; if(this.pkS===null) return this.fail(tx('Hata: Lamba kutu sensörde beklerken yanmalı!','Error: Lamp must light while the box waits at the sensor!')); const d=this.t-this.pkS;
        if(d>=T-0.25&&d<=T+0.6) this.f.lampDelay=true; else return this.fail(tx('Hata: Lamba '+fx(d.toFixed(1))+' sn sonra yandı, '+fx(T)+' sn olmalı!','Error: Lamp lit after '+d.toFixed(1)+' s, should be '+T+' s!')); } this.pLd=lp; }
    if(sc.lampTof){ const sv=sc.lampTof.src==='motor'?this.motor:!!q[sc.lampTof.src]; if(this.pSrc&&!sv) this.srcFall=this.t; this.pSrc=sv;
      const lp=!!q[sc.lampA]; if(this.pLt&&!lp&&this.srcFall!==null){ const d=this.t-this.srcFall, T=sc.lampTof.t; if(d>=T-0.4&&d<=T+0.6) this.f.lampTof=true; else return this.fail(tx('Hata: Lamba '+fx(d.toFixed(1))+' sn sonra söndü, '+fx(T)+' sn olmalı!','Error: Lamp went off after '+d.toFixed(1)+' s, should be '+T+' s!')); } this.pLt=lp; }
    if(sc.startDelay){ if(this.startAt!==null&&!this.motor&&q[sc.lampA]) this.sdLamp+=dt;
      if(this.motor&&!this.pm&&this.startAt!==null){ const d=this.t-this.startAt, T=sc.startDelay; this.startAt=null;
        if(d<T-0.3||d>T+0.8) return this.fail(tx('Hata: Bant START\'tan '+fx(d.toFixed(1))+' sn sonra kalktı, '+fx(T)+' sn olmalı!','Error: Belt started '+d.toFixed(1)+' s after START, should be '+T+' s!'));
        if(this.sdLamp<T-0.6) return this.fail(tx('Hata: Bekleme süresince ikaz lambası yanmalı!','Error: Warning lamp must be on during the wait!')); this.f.startDelay=true; } }

function errMsg(j,st){
  const m=((j&&(j.msg||j.message||j.error_description||j.error))||'')+'';
  if(/already registered|already exists|duplicate|23505/i.test(m+(j&&j.code))) return tx('Bu kullanıcı adı alınmış','This username is taken');
  if(/invalid login|invalid_grant|credentials/i.test(m)) return tx('Kullanıcı adı veya şifre hatalı','Wrong username or password');
  if(/password/i.test(m)) return tx('Şifre en az 6 karakter olmalı','Password must be at least 6 characters');
  if(/confirm/i.test(m)) return tx('E-posta onayı açık — Supabase\'de kapatılmalı','Email confirmation is on — disable it in Supabase');
  if(st===0) return tx('Bağlantı yok','No connection');
  return m||tx('Bir hata oluştu','Something went wrong');
}
async function sb(path,{method='GET',body,auth=true,headers={}}={}){
  if(!NET.ok) throw {msg:'offline'};
  const h=Object.assign({'apikey':SB_KEY,'Content-Type':'application/json'},headers);
  h.Authorization='Bearer '+((auth&&NET.sess&&NET.sess.access_token)||SB_KEY);
  let r; try{ r=await fetch(SB_URL+path,{method,headers:h,body:body?JSON.stringify(body):undefined}); }catch(e){ throw {msg:errMsg(null,0)}; }
  if(r.status===401&&auth&&NET.sess&&!headers._retry){ if(await refreshSess()) return sb(path,{method,body,auth,headers:Object.assign({},headers,{_retry:1})}); }
  const txt=await r.text(); let j=null; try{ j=txt?JSON.parse(txt):null; }catch(e){}
  if(!r.ok) throw {msg:errMsg(j,r.status),status:r.status};
  return {j,r};
}
async function refreshSess(){
  try{ const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{'apikey':SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:NET.sess.refresh_token})});
    if(!r.ok){ NET.sess=null; saveSess(); return false; }
    const j=await r.json(); NET.sess={access_token:j.access_token,refresh_token:j.refresh_token,user:NET.sess.user}; saveSess(); return true;
  }catch(e){ return false; }
}

async function register(u,p){
  if(!validUser(u)) throw {msg:tx('Kullanıcı adı 3-16 karakter: harf, rakam, _','Username: 3-16 chars, letters, digits, _')};
  if(p.length<6) throw {msg:tx('Şifre en az 6 karakter olmalı','Password must be at least 6 characters')};
  const {j}=await sb('/auth/v1/signup',{method:'POST',auth:false,body:{email:u.toLowerCase()+MAILDOM,password:p,data:{username:u}}});
  if(!j||!j.access_token) throw {msg:errMsg({msg:'confirm'})};
  setSess(j,u);
  try{ await sb('/rest/v1/profiles',{method:'POST',body:{id:j.user.id,username:u,points:points()},headers:{Prefer:'return=minimal'}}); }
  catch(e){ NET.sess=null; saveSess(); throw e.status===409?{msg:tx('Bu kullanıcı adı alınmış','This username is taken')}:e; }
  await pushProgress(true);
}

const BN=I18({NO:['Açık Kontak','NO Contact'],NC:['Kapalı Kontak','NC Contact'],COIL:['Bobin','Coil'],SET:['Set Bobini','Set Coil'],RST:['Reset Bobini','Reset Coil'],TON:['TON Zamanlayıcı','TON Timer'],TOF:['TOF Zamanlayıcı','TOF Timer'],CTU:['CTU Yukarı Sayıcı','CTU Up Counter'],CTD:['CTD Aşağı Sayıcı','CTD Down Counter']});
const BS=I18({NO:['Açık','NO'],NC:['Kapalı','NC'],COIL:['Bobin','Coil'],SET:'Set',RST:'Reset',TON:'TON',TOF:'TOF',CTU:'CTU',CTD:'CTD'});
function palSym(t){
  const m=17,y=12; let s='<svg width="34" height="24" viewBox="0 0 34 24">';
  if(t==='NO'||t==='NC'){ s+=`<path d="M0 ${y}H${m-6}M${m+6} ${y}H34M${m-6} 3V21M${m+6} 3V21"/>`; if(t==='NC') s+=`<path d="M${m-8} 20L${m+8} 4"/>`; }
  else if(t==='COIL'||t==='SET'||t==='RST'){ s+=`<path d="M0 ${y}H${m-9}M${m+9} ${y}H34M${m-4} 3Q${m-11} ${y} ${m-4} 21M${m+4} 3Q${m+11} ${y} ${m+4} 21"/>`; if(t!=='COIL') s+=`<text x="${m}" y="16">${t==='SET'?'S':'R'}</text>`; }
  else s+=`<rect x="4" y="2" width="26" height="20" rx="3"/><text x="17" y="16">${t}</text>`;
  return s+'</svg>';
}
const defPV=t=>(t==='TON'||t==='TOF')?2:3;
const DEFTAG=new Set(['START','STOP','I0.0']); for(const k in TAGEN){ DEFTAG.add(k); DEFTAG.add(TAGEN[k]); }
function customTags(t){ const o={}; if(t) for(const a in t){ const v=(t[a]||'').trim(); if(v&&!DEFTAG.has(v)) o[a]=v; } return o; }
function defaultTags(lv){ const o={}; lv.io.I.concat(lv.io.Q).forEach(d=>o[d.a]=d.n); return o; }

const ELEM_ORDER=['NO','NC','COIL','BR','SET','RST','MEM','TON','TOF','CTU','CTD'];
function brSym(){ return '<svg width="34" height="24" viewBox="0 0 34 24"><path d="M2 4H32M8 4V20H26V4"/></svg>'; }
function memSym(){ return '<svg width="34" height="24" viewBox="0 0 34 24"><rect x="4" y="2" width="26" height="20" rx="3"/><text x="17" y="16">M</text></svg>'; }
function elSym(k){ return k==='BR'?brSym():k==='MEM'?memSym():palSym(k); }
// örnek satırı SVG olarak çiz: main = [[tip,adr],...] (son eleman çıkış), br = ilk sütunun altına paralel kol
function rungSVG(main,br){
  const W=290, cw=56, x0=10, y=20, H=br?76:42, outX=W-38;
  let g=`<path class="w" d="M${x0} ${y}H${outX}"/>`, k=`<path class="rl" d="M4 4V${H-4}M${W-4} 4V${H-4}"/><path class="w" d="M${W-4} ${y}H${outX+34}"/>`;
  const sym=(t,a,x,yy)=>`<svg x="${x}" y="${yy-12}" width="34" height="24" viewBox="0 0 34 24">${palSym(t).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</svg><text class="ad" x="${x+17}" y="${yy+22}">${a}</text>`;
  const n=main.length-1;
  main.forEach(([t,a],i)=>{ const x=i<n?x0+12+i*cw:outX; g+=`<rect class="bg" x="${x}" y="${y-12}" width="34" height="24"/>`+sym(t,a,x,y); });
  if(br){ const yb=y+36, xe=x0+12+br.length*cw-10; g+=`<path class="w" d="M${x0} ${y}V${yb}H${xe}V${y}"/>`;
    br.forEach(([t,a],i)=>{ const x=x0+12+i*cw; g+=`<rect class="bg" x="${x}" y="${yb-12}" width="34" height="24"/>`+sym(t,a,x,yb); }); }
  return `<svg class="rs" viewBox="0 0 ${W} ${H+8}" width="100%">${k}${g}</svg>`;
}
function elemHTML(k,full){
  const E=ELEM[k];
  let ex=rungSVG(E.ex,E.br); if(E.ex2) ex+=rungSVG(E.ex2);
  return `<div class="el"><div class="eh"><div class="pal sel" style="flex:0 0 54px;height:42px">${elSym(k)}</div><b>${tx(E.t[0],E.t[1])}</b></div>
   <p class="t">${tx(E.d[0],E.d[1])}</p>${full?`<div class="ex"><small>${tx(E.e[0],E.e[1])}</small>${ex}</div>`:''}</div>`;
}
// bölümde kullanılan elemanlar (çözüme göre)
function levelElems(lv){
  const s=new Set(); for(const rg of lv.sol.rungs){ if(rg.br&&rg.c[1].some(Boolean)) s.add('BR'); for(const row of rg.c) for(const c of row) if(c){ s.add(c.t); if(c.a&&c.a[0]==='M') s.add('MEM'); } }
  return ELEM_ORDER.filter(k=>s.has(k));
}
// yeni gösterilecek elemanlar: palette olan + çözümde geçen, henüz görülmemiş
function freshElems(lv){ const pool=new Set(lv.pal.concat(levelElems(lv))); return ELEM_ORDER.filter(k=>pool.has(k)&&!save.seen[k]); }
function showIntro(list,done){
  if(!list.length){ done&&done(); return; }
  let i=0;
  const draw=()=>card(`<div class="nwt">🆕 ${tx('YENİ ELEMAN','NEW ELEMENT')}${list.length>1?` · ${i+1}/${list.length}`:''}</div>${elemHTML(list[i],true)}
    <div class="brow"><button class="btn pri wide" id="ok">${i<list.length-1?tx('Sonraki ▶','Next ▶'):tx('Anladım, başlayalım','Got it, let\'s go')}</button></div>`,e=>{
      if(e.target.id!=='ok') return; save.seen[list[i]]=1; persist(); Snd.click();
      if(++i<list.length) draw(); else { closeAll(); done&&done(); } });
  draw();
}
/* ---------- Bölüm yükleme / mod ---------- */
function loadLevel(id,quiet){
  S.id=id; const lv=S.lv=getLevel(id); save.last=id; persist();
  const dn=save.done[id]; S.redo=false; S.tool=null;
  if(dn){ S.view=true; S.prog=clone(dn.prog); S.tags=Object.assign(defaultTags(lv),customTags(dn.tags)); }
  else { S.view=false; const d=save.draft[id]; S.prog=d&&d.rungs&&d.rungs.length?{rungs:clone(d.rungs)}:{rungs:[mkRung(),mkRung()]}; S.tags=Object.assign(defaultTags(lv),customTags(d&&d.tags)); }
  world=new World(lv); plc.reset(); stopSim(true);
  const D=DIFFS[lv.diff];
  $('#title').innerHTML=`<small style="color:${D.c}">${D.n[0]}${lv.n+1}</small>${lv.title}`;
  $('#task').textContent=lv.task;
  S.fresh=S.view?[]:freshElems(lv);
  buildPalette(); refreshMode(); renderLadder(); closeAll();
  if(!quiet&&S.fresh.length) setTimeout(()=>showIntro(S.fresh),150);
}
function refreshMode(){
  $('#palette').style.display=S.view?'none':'flex'; $('#doneBar').style.display=S.view?'flex':'none';
  $('#bClear').style.visibility=S.view?'hidden':'visible'; updInfo();
}
function saveDraft(){ if(S.view||S.redo) return; save.draft[S.id]={rungs:S.prog.rungs,tags:customTags(S.tags)}; persist(); }
const saveProg=saveDraft;
function guard(){ if(S.view){ toast(tx('Tamamlanmış bölüm — düzenlemek için alttaki Sıfırla\'ya bas','Level completed — tap Reset below to edit')); return true; } return false; }
$('#bReset').onclick=()=>{ Snd.init(); Snd.click(); S.view=false; S.redo=true; S.prog={rungs:[mkRung(),mkRung()]}; S.tags=defaultTags(S.lv); S.tool=null;
  stopSim(true); refreshMode(); renderLadder(); toast(tx('Sıfırlandı — çözmeden çıkarsan eski çözümün korunur','Reset — if you leave without solving, your old solution is kept')); };

/* ---------- Palet ---------- */
function buildPalette(){
  const p=$('#palette'); p.innerHTML='';
  S.lv.pal.forEach(t=>{ const b=document.createElement('button'); b.className='pal'; b.dataset.t=t; b.innerHTML=palSym(t)+'<span>'+BS[t]+'</span>'+((S.fresh||[]).includes(t)?'<em class="nw">'+tx('YENİ','NEW')+'</em>':''); p.appendChild(b); });
}
let justDragged=false;
$('#palette').addEventListener('click',e=>{ if(justDragged) return; const b=e.target.closest('.pal'); if(!b) return; Snd.init(); Snd.click(); S.tool=S.tool===b.dataset.t?null:b.dataset.t; refreshTool(); });
function refreshTool(){
  document.querySelectorAll('.pal').forEach(b=>b.classList.toggle('sel',b.dataset.t===S.tool));
  $('#rungs').dataset.tool=S.tool?(isOut(S.tool)?'o':'c'):''; updInfo();
}
function updInfo(){
  const n=countBlocks(S.prog);
  const msg=S.view?tx('<span style="color:var(--neon)">✔ Kayıtlı çözümün</span> — ▶ RUN ile çalıştırıp izle','<span style="color:var(--neon)">✔ Your saved solution</span> — press ▶ RUN to watch')
    :S.redo?tx('<span style="color:var(--amb)">Yeniden çözüyorsun</span> — yeni çözüm bulana kadar eskisi korunur','<span style="color:var(--amb)">Re-solving</span> — old solution kept until you solve it again')
    :S.tool?tx(`Seçili: <b style="color:var(--blu)">${BN[S.tool]}</b> — ${isOut(S.tool)?'son sütuna':'sol sütunlara'} dokun`,`Selected: <b style="color:var(--blu)">${BN[S.tool]}</b> — tap ${isOut(S.tool)?'the last column':'a left column'}`):tx('Bloğu yukarı <b>sürükle-bırak</b> ya da seç &amp; dokun','<b>Drag &amp; drop</b> a block up, or select &amp; tap');
  $('#einfo').innerHTML=tx(`Blok <b>${n}</b> · referans çözüm ${S.lv.opt} blok`,`Blocks <b>${n}</b> · reference solution ${S.lv.opt}`)+`<br>${msg}`;
}
function canPlace(t,i,r,c){
  const rg=S.prog.rungs[i]; if(!rg||rg.c[r][c]) return 'dolu'; if(r===1&&!rg.br) return 'x';
  if(isOut(t)){ if(c!==OUTC||r!==0) return r===1?tx('Paralel kolda yalnızca kontak olur','Only contacts go on a parallel branch'):tx('Bobin / zamanlayıcı / sayıcı en sağ sütuna konur','Coils / timers / counters go in the rightmost column'); }
  else if(c===OUTC) return tx('Kontaklar sol sütunlara konur','Contacts go in the left columns');
  return '';
}

/* ---------- Ladder etkileşimi ---------- */
$('#rungs').addEventListener('click',e=>{
  if(justDragged) return; Snd.init();
  if(e.target.closest('#addr')){ if(guard()) return; S.prog.rungs.push(mkRung()); saveDraft(); renderLadder(); Snd.click(); const r=$('#rungs'); r.scrollTop=r.scrollHeight; return; }
  const rm=e.target.closest('.rm'); if(rm){ if(guard()) return; rungMenu(+rm.closest('.rung').dataset.i); return; }
  const ce=e.target.closest('.cell'); if(!ce) return; if(guard()) return;
  const i=+ce.closest('.rung').dataset.i, r=+ce.dataset.r, c=+ce.dataset.c, cell=S.prog.rungs[i].c[r][c];
  if(cell){ openEditor(i,r,c,cell,false); return; }
  if(!S.tool){ toast(tx('Paletten bir bloğu buraya sürükle ya da önce seç','Drag a block here from the palette, or select one first')); return; }
  const m=canPlace(S.tool,i,r,c); if(m){ toast(m); return; }
  openEditor(i,r,c,{t:S.tool,a:null,pv:defPV(S.tool)},true);
});

/* ---------- Sürükle-bırak ---------- */
let drag=null;
function cellAt(x,y){ const el=document.elementFromPoint(x,y); return el&&el.closest?el.closest('#rungs .cell'):null; }
function inPalette(x,y){ const el=document.elementFromPoint(x,y); return !!(el&&el.closest&&el.closest('#palette')); }
function dragClean(){ document.querySelectorAll('.cell.dz,.dragsrc').forEach(x=>x.classList.remove('dz','sw','dragsrc')); $('#ghost').style.display='none'; $('#palette').classList.remove('trash','hot'); refreshTool(); }
// hedef hücre için eylem: 'move' | 'swap' | hata mesajı
function dropAction(d,i,r,c){
  if(!d.from) return canPlace(d.t,i,r,c)||'new';
  const f=d.from; if(f.i===i&&f.r===r&&f.c===c) return 'x';
  const rs=S.prog.rungs, src=rs[f.i].c[f.r][f.c], dst=rs[i].c[r][c];
  if(r===1&&!rs[i].br) return 'x';
  rs[f.i].c[f.r][f.c]=null;
  let res;
  if(!dst) res=canPlace(src.t,i,r,c)||'move';
  else { rs[i].c[r][c]=null; const a=canPlace(src.t,i,r,c), b=canPlace(dst.t,f.i,f.r,f.c); rs[i].c[r][c]=dst; res=a||b?(a||b):'swap'; }
  rs[f.i].c[f.r][f.c]=src; return res;
}
$('#palette').addEventListener('pointerdown',e=>{ const b=e.target.closest('.pal'); if(!b||S.view) return; drag={t:b.dataset.t,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false}; });
$('#rungs').addEventListener('pointerdown',e=>{
  const ce=e.target.closest('.cell'); if(!ce||S.view) return;
  const i=+ce.closest('.rung').dataset.i, r=+ce.dataset.r, c=+ce.dataset.c, cell=S.prog.rungs[i].c[r][c]; if(!cell) return;
  drag={t:cell.t,x:e.clientX,y:e.clientY,pid:e.pointerId,on:false,from:{i,r,c,el:ce}};
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.pid) return;
  if(!drag.on){
    const dx=e.clientX-drag.x, dy=e.clientY-drag.y, dist=Math.hypot(dx,dy);
    if(drag.from){ if(dist<7) return; drag.from.el.classList.add('dragsrc'); $('#palette').classList.add('trash'); }
    else { if(dist<10) return; if(e.pointerType!=='mouse'&&Math.abs(dy)<Math.abs(dx)){ drag=null; return; } }
    drag.on=true; const g=$('#ghost'); g.innerHTML=palSym(drag.t)+'<span>'+(drag.from?drag.from.el.querySelector('.ad,.bt')?.textContent||BS[drag.t]:BS[drag.t])+'</span>'; g.style.display='flex';
    $('#rungs').dataset.tool=isOut(drag.t)?'o':'c'; Snd.init(); Snd.click();
  }
  e.preventDefault();
  $('#ghost').style.transform=`translate(${e.clientX-31}px,${e.clientY-64}px)`;
  const rb=$('#rungs').getBoundingClientRect();
  if(e.clientY<rb.top+28&&e.clientY>rb.top-40) $('#rungs').scrollTop-=7; else if(e.clientY>rb.bottom-28&&e.clientY<rb.bottom+4) $('#rungs').scrollTop+=7;
  if(drag.from) $('#palette').classList.toggle('hot',inPalette(e.clientX,e.clientY));

function calcCW(){ const w=$('#rungs').clientWidth-12-30-10; return Math.max(54,Math.min(84,Math.floor(w/COLS))); }
function cellSVG(cell,r,c,cw,inSpan,brEmpty){
  const m=cw/2,y=22; let s=`<svg width="${cw}" height="44" viewBox="0 0 ${cw} 44">`;
  const tag=cell&&S.tags[cell.a]?S.tags[cell.a]:'';
  if(!cell){
    if(c<OUTC){
      if(r===0||inSpan) s+=`<path class="wl" d="M0 ${y}H${m}"/><path class="wr" d="M${m} ${y}H${cw}"/>`;
      s+=`<path class="plus" d="M${m-4} ${y}H${m+4}M${m} ${y-4}V${y+4}"/>`;
    } else s+=`<path class="wl" d="M0 ${y}H${m-14}"/><path class="ph" d="M${m-5} 10Q${m-13} ${y} ${m-5} 34M${m+5} 10Q${m+13} ${y} ${m+5} 34"/>`;
    return s+'</svg>';
  }
  const t=cell.t;
  if(t==='NO'||t==='NC'){
    s+=`<path class="wl" d="M0 ${y}H${m-8}"/><path class="wr" d="M${m+8} ${y}H${cw}"/><path class="sym" d="M${m-8} 11V33M${m+8} 11V33"/>`;
    if(t==='NC') s+=`<path class="sym" d="M${m-10} 31L${m+10} 13"/>`;
    s+=`<text class="ad" x="${m}" y="9">${cell.a}</text><text class="tg" x="${m}" y="43">${tag.slice(0,12)}</text>`;
  } else if(t==='COIL'||t==='SET'||t==='RST'){
    s+=`<path class="wl" d="M0 ${y}H${m-13}"/><path class="wr" d="M${m+13} ${y}H${cw}"/><path class="sym" d="M${m-5} 10Q${m-14} ${y} ${m-5} 34M${m+5} 10Q${m+14} ${y} ${m+5} 34"/>`;
    if(t!=='COIL') s+=`<text class="cl" x="${m}" y="26">${t==='SET'?'S':'R'}</text>`;
    s+=`<text class="ad" x="${m}" y="9">${cell.a}</text><text class="tg" x="${m}" y="43">${tag.slice(0,12)}</text>`;
  } else {
    s+=`<path class="wl" d="M0 ${y}H${m-26}"/><path class="wr" d="M${m+26} ${y}H${cw}"/><rect class="bx" x="${m-26}" y="3" width="52" height="38" rx="4"/>`;
    s+=`<text class="bt" x="${m}" y="17">${t} ${cell.a}</text><text class="bv" x="${m}" y="33"></text>`;
  }
  return s+'</svg>';
}
function tvStatic(o){ return (o.t==='TON'||o.t==='TOF')?`PT ${o.pv.toFixed(1)}s`:`PV ${o.pv}`; }
function renderLadder(){
  const box=$('#rungs'); const sc=box.scrollTop; box.innerHTML=''; LIVE=[];
  const cw=S.cw=calcCW();
  S.prog.rungs.forEach((rg,i)=>{
    const rows=rg.br?2:1, sp=branchSpan(rg);
    const el=document.createElement('div'); el.className='rung'; el.dataset.i=i;
    el.innerHTML=`<div class="gut"><span class="rn">R${i+1}</span><button class="rm">⋮</button></div><div class="grid" style="width:${cw*COLS+8}px;height:${rows*44}px"><div class="rail" style="left:0"></div><div class="rail" style="left:${cw*COLS+4}px"></div></div>`;
    const g=el.querySelector('.grid'); const L={cells:[[],[]],vl:null,vr:null,grid:g};
    for(let r=0;r<rows;r++) for(let c=0;c<COLS;c++){
      if(r===1&&c===OUTC) continue;
      const cell=rg.c[r][c]; const inSp=!!sp&&c>=sp.from&&c<=sp.to;
      const d=document.createElement('div'); d.dataset.r=r; d.dataset.c=c;
      d.style.cssText=`left:${4+c*cw}px;top:${r*44}px;width:${cw}px`;
      d._b='cell'+(cell?' full':(c===OUTC?' eo':' ec')); d.className=d._b;
      d.innerHTML=cellSVG(cell,r,c,cw,inSp); d._cell=cell; d._tv=d.querySelector('.bv'); if(d._tv) d._tv.textContent=tvStatic(cell);
      g.appendChild(d); L.cells[r][c]=d;
    }
    if(sp){ for(const [k,x] of [['vl',sp.from*cw+4],['vr',(sp.to+1)*cw+4]]){ const v=document.createElement('div'); v.className='vw'; v.style.cssText=`left:${x-1.5}px;top:22px;height:44px`; g.appendChild(v); L[k]=v; } }
    box.appendChild(el); LIVE.push(L);
  });
  if(S.prog.rungs.length<8&&!S.view){ const b=document.createElement('button'); b.id='addr'; b.textContent=tx('＋ Satır Ekle','＋ Add Rung'); box.appendChild(b); }
  box.scrollTop=sc; refreshTool();
}
function updateLive(){
  const res=plc.res, live=res.length===S.prog.rungs.length&&(S.running||world.err||world.done);
  S.prog.rungs.forEach((rg,i)=>{ const L=LIVE[i]; if(!L) return; const R=res[i], rows=rg.br?2:1, sp=branchSpan(rg);
    L.grid.classList.toggle('on',!!live);
    for(let r=0;r<rows;r++) for(let c=0;c<COLS;c++){
      const el=L.cells[r][c]; if(!el) continue; let k=el._b;
      if(live&&R){ let lp,rp,ps=false;
        if(c<OUTC){ lp=!!(R.in[r]&&R.in[r][c]); rp=!!(R.out[r]&&R.out[r][c]); ps=!!el._cell&&rp; }
        else { lp=rp=R.outIn; ps=R.outIn&&!!el._cell; }
        if(lp) k+=' lp'; if(rp) k+=' rp'; if(ps) k+=' ps';
        const o=el._cell; if(o&&el._tv){ const st=(o.t==='TON'||o.t==='TOF')?plc.T[o.a]:plc.C[o.a];
          if(st&&st.q) k+=' qq';
          el._tv.textContent=(o.t==='TON'||o.t==='TOF')?`${(st?st.et/1000:0).toFixed(1)}/${o.pv.toFixed(1)}s`:`${st?st.cv:(o.t==='CTD'?o.pv:0)}/${o.pv}`; }
      } else if(el._tv&&el._cell) el._tv.textContent=tvStatic(el._cell);
      if(el.className!==k) el.className=k;
    }
    if(sp&&L.vl){ const on=live&&R&&(R.in[0][sp.from]); const on2=live&&R&&(R.out[0][sp.to]||R.out[1][sp.to]);
      L.vl.classList.toggle('on',!!on); L.vr.classList.toggle('on',!!on2); }
  });
}

function allowed(t){
  const GI=tx('GİRİŞLER (I)','INPUTS (I)'),GQ=tx('ÇIKIŞLAR (Q)','OUTPUTS (Q)'),GM=tx('HAFIZA (M)','MEMORY (M)'),GT=tx('ZAMANLAYICI (T)','TIMERS (T)'),GC=tx('SAYICI (C)','COUNTERS (C)');
  const lv=S.lv, g=[]; const I=lv.io.I.map(d=>d.a), Q=lv.io.Q.map(d=>d.a);
  const M=[...Array(lv.M)].map((_,i)=>'M0.'+i), T=[...Array(lv.T)].map((_,i)=>'T'+(i+1)), C=[...Array(lv.C)].map((_,i)=>'C'+(i+1));
  const add=(n,l)=>{ if(l.length) g.push([n,l]); };
  if(t==='NO'||t==='NC'){ add(GI,I); add(GQ,Q); add(GM,M); add(GT,T); add(GC,C); }
  else if(t==='COIL'||t==='SET'){ add(GQ,Q); add(GM,M); }
  else if(t==='RST'){ add(GQ,Q); add(GM,M); add(GT,T); add(GC,C); }
  else if(t==='TON'||t==='TOF') add('ZAMANLAYICI (T)',T);
  else add('SAYICI (C)',C);
  return g;
}
function openEditor(i,r,c,cell,isNew){
  const t=cell.t, groups=allowed(t); let sel=cell.a||(groups[0]&&groups[0][1][0]); let pv=cell.pv;

    sh.innerHTML=`<div style="display:flex;align-items:center;gap:10px"><div class="pal sel" style="flex:0 0 62px;height:46px">${palSym(t)}</div><div><h3>${BN[t]}</h3><div style="font-size:11px;color:var(--dim)">${tx('Adres seç ve istersen etiket yaz','Choose an address and optionally type a tag')}</div></div></div>`+
    groups.map(([n,l])=>`<div class="grp">${n}</div><div class="chips">${l.map(a=>`<button class="chip ${a===sel?'sel':''}" data-a="${a}">${a}<small>${S.tags[a]||'—'}</small></button>`).join('')}</div>`).join('')+

    (tm?`<div class="fld"><label>${tx('Süre','Time')}</label><div class="step"><button class="btn" data-s="-">−</button><b>${pv.toFixed(1)} ${tx('sn','s')}</b><button class="btn" data-s="+">＋</button></div></div>`:'')+
    (ct?`<div class="fld"><label>${tx('Hedef (PV)','Preset (PV)')}</label><div class="step"><button class="btn" data-s="-">−</button><b>${pv}</b><button class="btn" data-s="+">＋</button></div></div>`:'')+
    `<div class="brow">${isNew?'':'<button class="btn dan" id="mDel">'+tx('🗑 Sil','🗑 Delete')+'</button>'}<button class="btn wide" id="mCan">${tx('İptal','Cancel')}</button><button class="btn pri wide" id="mOk">${tx('✓ Tamam','✓ OK')}</button></div>`;
  };
  draw(); openSheet();
  sh.onclick=e=>{
    const ch=e.target.closest('.chip'); if(ch){ const tg=$('#tgIn'); if(tg) S.tags[sel]=tg.value.trim()||S.tags[sel]||''; sel=ch.dataset.a; Snd.click(); draw(); return; }

    if(e.target.id==='mOk'){ if(!sel){ toast(tx('Bu blok için kullanılabilir adres yok','No available address for this block')); return; }

      const nc={t:t,a:sel}; if(tm||ct) nc.pv=pv; S.prog.rungs[i].c[r][c]=nc; saveProg(); renderLadder(); Snd.place(); closeAll(); }
  };
}

  ctx.fillStyle='#0b0f14'; rr(x0-8,by-bh/2-6,100*us+16,bh+12,8); ctx.fill();

  ctx.save(); ctx.beginPath(); ctx.rect(x0,by-bh/2,100*us,bh); ctx.clip(); ctx.strokeStyle='#323e4b'; ctx.lineWidth=2; const sp=16, off=(w.beltOff*us)%sp;
  for(let x=x0-sp+off;x<x0+100*us;x+=sp){ ctx.beginPath(); ctx.moveTo(x,by-bh/2); ctx.lineTo(x,by+bh/2); ctx.stroke(); } ctx.restore();
  ctx.strokeStyle='#5d6e80'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x0,by-bh/2); ctx.lineTo(x0+100*us,by-bh/2); ctx.moveTo(x0,by+bh/2); ctx.lineTo(x0+100*us,by+bh/2); ctx.stroke();
  ctx.fillStyle=w.motor?'#39ff6a':'#46576b'; [x0,x0+100*us].forEach(x=>{ctx.beginPath();ctx.arc(x,by,5,0,7);ctx.fill();});
  ctx.fillStyle='#6b7c8f'; ctx.font='700 14px system-ui'; ctx.textAlign='center'; ctx.fillText(w.motor?'▶▶':'▷▷',x0+10,by-bh/2-8);
  // depo
  const dx=X(100)+8; ctx.fillStyle='#14202b'; ctx.strokeStyle='#4da3ff'; ctx.lineWidth=2; rr(dx,by-bh/2-4,W-dx-4,bh+8,6); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#4da3ff'; ctx.font='800 8px system-ui'; ctx.fillText(tx('DEPO','STORE'),dx+(W-dx-4)/2,by-3); ctx.font='800 13px ui-monospace,monospace'; ctx.fillStyle='#dfe8f2'; ctx.fillText(w.delivered,dx+(W-dx-4)/2,by+12);
  // istasyonlar / kabin
  sc.valves.forEach(v=>{ const vx=X(v.x), on=!!w.q[v.a], spray=v.kind==='spray';
    if(spray){ ctx.fillStyle='rgba(120,140,160,.10)'; ctx.strokeStyle='#5d6e80'; ctx.lineWidth=2; rr(X(v.x-13),by-bh/2-34,26*us,bh+44,6); ctx.fill(); ctx.stroke(); ctx.fillStyle='#7d8a99'; ctx.font='700 8px system-ui'; ctx.fillText(tx('BOYA KABİNİ','PAINT BOOTH'),vx,by-bh/2-38); }
    ctx.fillStyle='#2b3744'; ctx.fillRect(vx-3,by-bh/2-30,6,20); ctx.fillStyle=on?(spray?'#ff8c2a':'#4da3ff'):'#59697b'; ctx.beginPath(); ctx.moveTo(vx-7,by-bh/2-10); ctx.lineTo(vx+7,by-bh/2-10); ctx.lineTo(vx,by-bh/2-2); ctx.fill();
    if(on){ ctx.strokeStyle=spray?'rgba(255,140,42,.8)':'rgba(77,163,255,.85)'; ctx.lineWidth=spray?10:3; ctx.setLineDash([4,3]); ctx.lineDashOffset=-w.t*40; ctx.beginPath(); ctx.moveTo(vx,by-bh/2-2); ctx.lineTo(vx,by); ctx.stroke(); ctx.setLineDash([]); }
    ctx.fillStyle='#7d8a99'; ctx.font='700 8px system-ui'; ctx.fillText(v.a,vx,spray?by+bh/2+14:by-bh/2-32); });
  if(sc.fan){ const fx=X(sc.valves[0].x)+14*us-8, fy=by-bh/2-24, on=!!w.q[sc.fan.a]; ctx.save(); ctx.translate(fx,fy); ctx.rotate(w.fanAng); ctx.fillStyle=on?'#39ff6a':'#59697b'; for(let i=0;i<3;i++){ ctx.rotate(Math.PI*2/3); ctx.beginPath(); ctx.ellipse(0,-6,3,6,0,0,7); ctx.fill(); } ctx.restore(); ctx.fillStyle='#7d8a99'; ctx.font='700 8px system-ui'; ctx.fillText('FAN '+sc.fan.a,fx,fy+17); }
  // kutular
  for(const b of w.boxes){ let x=X(b.x),y=by,a=1,k=1;
    if(b.st==='pushed'||b.st==='bin'){ y=by+b.py*push; if(b.st==='bin') a=Math.max(0,1-Math.max(0,b.ft-1.2)/0.6); }
    if(b.st==='end'){ x=X(100)+4+b.ft*30; a=Math.max(0,1-b.ft/0.8); }
    if(b.st==='removed'){ y=by-b.ft*34; a=Math.max(0,1-b.ft/0.6); k=1+b.ft*.5; }
    const s=BWp*k; ctx.globalAlpha=a; ctx.fillStyle='#b9822f'; ctx.strokeStyle='#6b4a14'; ctx.lineWidth=1.5; rr(x-s/2,y-s/2,s,s,3); ctx.fill(); ctx.stroke();
    ctx.fillStyle='rgba(255,230,160,.5)'; ctx.fillRect(x-s/2+2,y-1.5,s-4,3);
    if(b.fill>0){ const col=sc.valves.some(v=>v.kind==='spray')?'255,120,30':'60,150,255'; ctx.fillStyle=`rgba(${col},${Math.min(.85,b.fill*.85)})`; rr(x-s/2+2,y-s/2+2,s-4,s-4,2); ctx.fill(); }
    if(sc.divertEvery){ ctx.fillStyle='#1d1304'; ctx.font='800 10px system-ui'; ctx.textAlign='center'; ctx.fillText(b.id,x,y+3.5); }
    ctx.globalAlpha=1; }
  // sensörler
  sc.sensors.forEach(s=>{ const sx=X(s.x), on=w.sensorOn(s.a); const t=by-bh/2-10, bt=by+bh/2+2;
    ctx.strokeStyle=on?'#ffb020':'rgba(255,77,77,.65)'; ctx.lineWidth=on?2.5:1.5; ctx.setLineDash([3,3]); ctx.beginPath(); ctx.moveTo(sx,t+8); ctx.lineTo(sx,bt); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle='#3a4757'; ctx.fillRect(sx-7,t,14,8); ctx.fillRect(sx-7,bt,14,8);
    ctx.fillStyle=on?'#ffb020':'#ff4d4d'; ctx.beginPath(); ctx.arc(sx,t+4,2.5,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(sx,bt+4,2.5,0,7); ctx.fill();
    if(on){ ctx.shadowColor='#ffb020'; ctx.shadowBlur=10; ctx.beginPath(); ctx.arc(sx,bt+4,3,0,7); ctx.fill(); ctx.shadowBlur=0; }
    ctx.fillStyle='#8da0b4'; ctx.font='700 8px ui-monospace,monospace'; ctx.textAlign='center'; ctx.fillText(s.a,sx,bt+19); });
  // pistonlar
  sc.pistons.forEach(p=>{ const px=X(p.x), e=w.ext[p.a]; const hy=by-bh/2-46, front=by-BWp/2-2+e*push;
    ctx.fillStyle='#4a5b6e'; rr(px-11,hy,22,26,3); ctx.fill(); ctx.strokeStyle='#8da0b4'; ctx.lineWidth=2; ctx.stroke();
    ctx.fillStyle=w.q[p.a]?'#39ff6a':'#2b3744'; ctx.fillRect(px-4,hy+4,8,4);
    ctx.fillStyle='#a9b8c8'; ctx.fillRect(px-3,hy+26,6,Math.max(2,front-6-(hy+26))); ctx.fillStyle='#d4dde7'; rr(px-13,front-6,26,6,2); ctx.fill();
    ctx.fillStyle='#7d8a99'; ctx.font='700 8px ui-monospace,monospace'; ctx.textAlign='center'; ctx.fillText(p.a,px,hy-3); });
  // lambalar
  sc.lamps.forEach((l,i)=>{ const lx=W-24-i*38, ly=by-bh/2-52, on=!!w.q[l.a], c=LC[l.c]; ctx.fillStyle='#2b3744'; ctx.fillRect(lx-3,ly+10,6,12);
    ctx.fillStyle=on?c[0]:c[1]; ctx.strokeStyle='#59697b'; ctx.lineWidth=2; if(on){ctx.shadowColor=c[0];ctx.shadowBlur=16;} ctx.beginPath(); ctx.arc(lx,ly,10,0,7); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle='#8da0b4'; ctx.font='700 7.5px system-ui'; ctx.textAlign='center'; ctx.fillText(tg(l.n),lx,ly+31); });
  // panel
  ctx.fillStyle='#0c1117'; ctx.fillRect(0,H-panelH,W,panelH); ctx.strokeStyle='#2a3542'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(0,H-panelH); ctx.lineTo(W,H-panelH); ctx.stroke();
  const ops=lv.io.I.filter(d=>d.k==='btn'||d.k==='sw'); hits=[];
  ops.forEach((d,i)=>{ const cx=(i+1)*W/(ops.length+1), cy=H-panelH+24, on=!!w.iv[d.a]||(flash[d.a]>0);
    const col=d.n==='START'?'#39ff6a':d.n==='STOP'?'#ff4d4d':d.k==='sw'?'#ffb020':'#4da3ff';
    ctx.fillStyle='#1a222b'; ctx.beginPath(); ctx.arc(cx,cy,21,0,7); ctx.fill();
    if(d.k==='sw'){ ctx.fillStyle=on?'#3d2a07':'#10161d'; ctx.strokeStyle=col; ctx.lineWidth=2; rr(cx-17,cy-9,34,18,9); ctx.fill(); ctx.stroke(); ctx.fillStyle=on?col:'#59697b'; ctx.beginPath(); ctx.arc(on?cx+8:cx-8,cy,7,0,7); ctx.fill(); }
    else { ctx.fillStyle=on?col:'#10161d'; ctx.strokeStyle=col; ctx.lineWidth=3; if(on){ctx.shadowColor=col;ctx.shadowBlur=14;} ctx.beginPath(); ctx.arc(cx,cy,15,0,7); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0; }
    ctx.fillStyle='#cfe0f2'; ctx.font='800 9px system-ui'; ctx.textAlign='center'; ctx.fillText(d.n,cx,H-panelH+51); 
    hits.push({a:d.a,x:cx,y:cy,r:28}); });
  // HUD
  ctx.font='700 10px system-ui'; let cx=6,cy=6; w.goalList().forEach(gl=>{ const tx=(gl.ok?'✔ ':'○ ')+gl.l, tw=ctx.measureText(tx).width+12; if(cx+tw>W-6){cx=6;cy+=19;}
    ctx.fillStyle=gl.ok?'rgba(14,58,27,.9)':'rgba(0,0,0,.5)'; ctx.strokeStyle=gl.ok?'#39ff6a':'#3a4757'; ctx.lineWidth=1; rr(cx,cy,tw,16,8); ctx.fill(); ctx.stroke(); ctx.fillStyle=gl.ok?'#39ff6a':'#aab6c3'; ctx.textAlign='left'; ctx.fillText(tx,cx+6,cy+11.5); cx+=tw+5; });
  if(w.err){ ctx.strokeStyle='rgba(255,77,77,.9)'; ctx.lineWidth=5; ctx.strokeRect(2,2,W-4,H-4); }
  if(w.done){ ctx.strokeStyle='rgba(57,255,106,.9)'; ctx.lineWidth=5; ctx.strokeRect(2,2,W-4,H-4); }
}
cv.addEventListener('pointerdown',e=>{ const r=cv.getBoundingClientRect(), x=e.clientX-r.left, y=e.clientY-r.top;
  for(const h of hits){ if(Math.hypot(x-h.x,y-h.y)<=h.r){ Snd.init(); Snd.click(); if(!S.running){ toast(tx('Önce ▶ RUN ile simülasyonu başlat','Start the simulation with ▶ RUN first')); return; } world.press(h.a); flash[h.a]=0.25; return; } } });

/* ---------- Ana döngü ---------- */
let last=performance.now(), acc=0, fr=0;
function scanOnce(){
  const iv=world.sense(); for(const k in iv) plc.b[k]=iv[k];
  const qs=S.lv.io.Q.map(d=>d.a), before=qs.map(a=>!!plc.b[a]);
  plc.scan(S.prog,20); world.advance(plc.b,SCAN);
  let ch=false,hs=false; qs.forEach((a,i)=>{ if(!!plc.b[a]!==before[i]){ ch=true; if(world.sc.pistons.some(p=>p.a===a)) hs=true; } });
  if(ch) Snd.relay(); if(hs) Snd.hiss();
  if(world.err) onFail(); else if(world.done) onWin();
}
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  for(const k in flash) if(flash[k]>0) flash[k]-=dt;
  if(S.running){ acc+=dt*S.speed; let n=0; while(acc>=SCAN&&n<300&&S.running){ scanOnce(); acc-=SCAN; n++; } } else acc=0;
  const mOpen=$('#menu').classList.contains('show');
  if(mOpen&&S.mscr==='main') drawMenuAnim(now);
  if(!mOpen){ drawScene(); if((fr++&1)===0) updateLive(); }
  requestAnimationFrame(frame);
if(me()) pullProgress().catch(()=>{});
}
function relayout(){ resizeCanvas(); if(S.prog){ const cw=calcCW(); if(cw!==S.cw) renderLadder(); } }
window.addEventListener('resize',relayout); if(window.ResizeObserver) new ResizeObserver(relayout).observe($('#sceneWrap'));
$('#bSnd').textContent=save.sound?'🔊':'🔇';
LANG=save.lang||((navigator.language||'tr').toLowerCase().startsWith('tr')?'tr':'en'); save.lang=LANG; applyTheme(); applyStatic();
resizeCanvas(); loadLevel(save.last>=0&&save.last<TOTAL?save.last:0,true);
showMenu('main');
if(!save.intro){ card(`<h3>⚡ ${tx('Ladder Master\'a hoş geldin!','Welcome to Ladder Master!')}</h3>${HOW()}<div class="brow"><button class="btn pri wide" id="ok">${tx('Başlayalım','Let\'s go')}</button></div>`,e=>{ if(e.target.id==='ok'){ save.intro=true; persist(); closeAll(); showMenu('main'); } }); }
requestAnimationFrame(frame);
if(me()) pullProgress().catch(()=>{});
</script></body></html>
