--sheet:#ffffff;--selbg:#dceafd;--ttl:#0b3d1c;--sym:#4c5b6b;--bv:#0e7a33;--bxln:#7f8fa1;--rail:#7d8c9c;--toast:#2a3644;--act:#e3e9f0;--btn:#eef2f6;--ln2:#dfe5ec;--big:#ffffff;

.seg{display:flex;gap:6px;margin-bottom:6px}
.seg button{flex:1;height:42px;border-radius:10px;border:1.5px solid var(--ln);background:var(--chip);color:var(--tx);font-size:13.5px;font-weight:700}
.seg button.on{border-color:var(--neon);background:var(--okbg);color:var(--neon)}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--app);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{position:relative;height:100dvh;max-width:480px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);box-shadow:0 0 40px #000}

#cv{width:100%;height:100%;display:block}
#err{position:absolute;left:8px;right:8px;top:50%;transform:translateY(-50%);background:rgba(120,15,15,.95);border:2px solid var(--red);border-radius:10px;padding:10px 12px;display:none;z-index:5;box-shadow:0 0 18px rgba(255,77,77,.5)}

.ib{background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:8px;min-width:36px;height:34px;font-size:16px;padding:0 8px}
.ib:active{background:var(--act)}




#top{display:flex;align-items:center;gap:8px;padding:8px 10px 6px;background:var(--p1)}

#task b{color:var(--blu)}
#goals{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.gl{transition:background .25s,color .25s,border-color .25s}
.gl.ok{animation:glok .5s}
@keyframes glok{40%{transform:scale(1.12)}}
.gl{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:99px;border:1px solid var(--ln);background:var(--chip);color:var(--tx3)}
.gl.ok{border-color:var(--okln);background:var(--okbg);color:var(--neon)}

#io:empty{display:none}
.iob{flex:1 0 auto;min-width:92px;height:52px;border-radius:12px;border:2px solid var(--c);background:#121920;color:#e6edf5;display:flex;align-items:center;justify-content:center;gap:9px;padding:0 12px;touch-action:manipulation}
.iob .lt{width:22px;height:22px;border-radius:50%;border:2.5px solid var(--c);background:transparent;flex:0 0 22px;transition:background .08s}
.iob.sw .lt{width:34px;height:20px;border-radius:10px;position:relative;flex:0 0 34px}
.iob.sw .lt::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#59697b;transition:left .12s}
.iob.on.sw .lt::after{left:16px;background:var(--c)}
.iob.on{background:color-mix(in srgb,var(--c) 18%,#121920);box-shadow:0 0 14px color-mix(in srgb,var(--c) 45%,transparent)}
.iob.on:not(.sw) .lt{background:var(--c)}
.iob .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.1}
.iob .tx b{font-size:14px;letter-spacing:.3px}
.iob .tx small{font:600 10.5px ui-monospace,monospace;color:#8da0b4}
.iob:active{transform:scale(.97)}
.iob.idle{opacity:.55}
#ctrl{display:flex;gap:8px;align-items:center;padding:8px 10px;background:var(--p1);border-bottom:1px solid var(--ln)}
#ctrl .ib.big{height:46px;min-width:52px;font-size:17px;font-weight:800;border-radius:12px}
#ctrl .hintb{font-size:21px}
#run{flex:1;height:46px;border-radius:12px;border:0;font-weight:900;font-size:18px;letter-spacing:1px;color:#06210f;background:var(--neon);box-shadow:0 0 14px rgba(57,255,106,.35)}
#run.on{background:var(--red);color:#fff;box-shadow:0 0 12px rgba(255,77,77,.4)}
#pill{font-size:10px;font-weight:800;padding:3px 7px;border-radius:99px;background:var(--bar);color:var(--dim);border:1px solid var(--ln)}
#pill.run{background:var(--okbg);color:var(--neon);border-color:var(--okln)}
#pill.bad{background:var(--danbg);color:var(--red);border-color:var(--danln)}
#editor{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--ed)}
#ehead{display:flex;align-items:center;gap:8px;padding:7px 10px;font-size:12.5px;color:var(--dim);border-bottom:1px solid var(--ln2)}
#ehead .sp{flex:1;line-height:1.25}
#ehead .sp b{color:var(--tx)}
.sm{background:var(--p2);border:1px solid var(--ln);color:var(--tx);border-radius:7px;height:28px;padding:0 9px;font-size:12px}
#rungs{flex:1;overflow-y:auto;overflow-x:auto;padding:6px 6px 14px;-webkit-overflow-scrolling:touch}
.rung{display:flex;align-items:flex-start;margin-bottom:5px}
.gut{width:30px;flex:0 0 30px;height:44px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1px 0}
.rn{font-size:10px;color:var(--dim);font-family:ui-monospace,monospace}
.rm{background:var(--chip);border:1px solid var(--ln);color:var(--dim);border-radius:6px;width:24px;height:22px;font-size:13px;line-height:1;padding:0}
.grid{position:relative;background:repeating-linear-gradient(0deg,transparent 0 43px,var(--gridl) 43px 44px)}
.rail{position:absolute;top:0;bottom:0;width:4px;background:var(--rail);border-radius:2px}
.grid.on .rail{background:var(--neon);box-shadow:0 0 8px var(--neon)}
.cell{position:absolute;height:44px;border-radius:5px}
.cell svg{display:block;overflow:visible}
.cell svg *{fill:none;stroke-linecap:round}
.cell .wl,.cell .wr{stroke:var(--wire);stroke-width:2.5}
.cell .sym{stroke:var(--sym);stroke-width:2.5}
.cell .ad{fill:var(--tx2);stroke:none;font:600 9.5px ui-monospace,Menlo,monospace;text-anchor:middle}
.cell .tg{fill:var(--dim);stroke:none;font:8.5px system-ui;text-anchor:middle}
.cell .ph{stroke:var(--ph);stroke-width:1.5;stroke-dasharray:3 3}
.cell .plus{stroke:var(--ph);stroke-width:2}
.cell .bx{fill:var(--bx);stroke:var(--bxln);stroke-width:2}
.cell .bt{fill:var(--tx2);stroke:none;font:700 10px ui-monospace,monospace;text-anchor:middle}
.cell .bv{fill:var(--bv);stroke:none;font:600 9.5px ui-monospace,monospace;text-anchor:middle}
.cell .cl{fill:var(--tx2);stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.cell.lp .wl,.cell.rp .wr{stroke:var(--neon);filter:drop-shadow(0 0 3px var(--neon))}
.cell.ps .sym{stroke:var(--neon);filter:drop-shadow(0 0 3px var(--neon))}
.cell.ps .bx{stroke:var(--neon);fill:var(--bxon)}
.cell.ps .cl{fill:var(--neon)}
.cell.qq .bx{fill:var(--qq)}
.vw{position:absolute;width:3px;background:var(--wire);border-radius:2px}
.vw.on{background:var(--neon);box-shadow:0 0 6px var(--neon)}
#rungs[data-tool="c"] .cell.ec,#rungs[data-tool="o"] .cell.eo{background:rgba(77,163,255,.12);outline:1.5px dashed var(--blu);animation:pl 1s infinite}
@keyframes pl{50%{background:rgba(77,163,255,.25)}}
#addr{margin:2px 0 0 30px;width:calc(100% - 30px);height:34px;border:1.5px dashed var(--ph);background:transparent;color:var(--dim);border-radius:8px;font-size:12px}
#palette{flex:0 0 66px;display:flex;gap:6px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));overflow-x:auto;background:var(--p1);border-top:2px solid var(--ln)}
.pal{flex:0 0 64px;font-size:10.5px!important;border-radius:9px;background:var(--p2);border:1.5px solid var(--ln);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px;font-size:9px}
.pal svg{display:block}
.pal svg *{fill:none;stroke:var(--sym);stroke-width:2.2;stroke-linecap:round}
.pal svg text{fill:var(--tx2);stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.pal.sel{border-color:var(--blu);background:var(--selbg);box-shadow:0 0 10px rgba(77,163,255,.5)}
.ov{position:absolute;inset:0;background:var(--ov);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.show{display:flex}
.ov.mid{align-items:center}
#ovCard{z-index:30}
.sheet{width:100%;max-height:88%;overflow-y:auto;background:var(--sheet);border:1px solid var(--ln);border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));animation:up .18s ease-out}
.card{width:90%;max-height:90%;overflow-y:auto;background:var(--sheet);border:1px solid var(--ln);border-radius:16px;padding:16px;text-align:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3,.card h3{margin:0 0 4px;font-size:16px}
.grp{font-size:10px;color:var(--dim);margin:10px 0 4px;letter-spacing:.8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1.5px solid var(--ln);color:var(--tx);border-radius:9px;padding:5px 9px;font:600 12px ui-monospace,monospace;text-align:left;min-width:62px}
.chip small{display:block;font:9px system-ui;color:var(--dim)}
.chip.sel{border-color:var(--neon);background:var(--okbg);box-shadow:0 0 8px rgba(57,255,106,.35)}
.fld{display:flex;gap:8px;align-items:center;margin-top:10px}
.fld label{font-size:11px;color:var(--dim);flex:0 0 70px}
.fld input{flex:1;height:34px;background:var(--in);border:1.5px solid var(--ln);border-radius:8px;color:var(--tx);padding:0 10px;font-size:14px;user-select:text;-webkit-user-select:text}
.step{display:flex;align-items:center;gap:10px}
.step b{font:700 16px ui-monospace,monospace;min-width:64px;text-align:center;color:var(--amb)}
.btn{height:42px;border-radius:10px;border:1.5px solid var(--ln);background:var(--btn);color:var(--tx);font-size:14px;font-weight:700;padding:0 14px}
.btn.pri{background:var(--neon);color:#06210f;border-color:var(--neon)}
.btn.dan{background:var(--danbg);border-color:var(--danln);color:var(--redt)}
.btn.wide{flex:1}
.brow{display:flex;gap:8px;margin-top:14px}
.mi{display:block;width:100%;text-align:left;height:46px;margin-bottom:6px;background:var(--chip);border:1.5px solid var(--ln);border-radius:10px;color:var(--tx);font-size:14px;padding:0 14px}
#menu{background:var(--bg)}
#menu .sheet{height:100%;max-height:100%;border-radius:0;background:var(--bg);border:0}
.cat{margin:14px 0 6px;font-size:11px;font-weight:800;letter-spacing:1px;color:var(--amb)}
.cat small{display:block;color:var(--dim);font-weight:500;letter-spacing:0}
.lvs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lv{aspect-ratio:1;border-radius:12px;background:var(--p2);border:1.5px solid var(--ln);color:var(--tx);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:800}
.lv small{font-size:10px;color:var(--amb);letter-spacing:1px;min-height:12px}
.lv.lock{opacity:.4}
.lv.cur{border-color:var(--neon)}
.stars{font-size:30px;letter-spacing:6px;color:var(--wire);margin:6px 0}
.stars .f{color:var(--amb);text-shadow:0 0 12px var(--amb)}
#toast{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);background:var(--toast);border:1px solid var(--wire);color:var(--tx);font-size:12.5px;padding:8px 14px;border-radius:99px;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:1}
p.t{font-size:13px;line-height:1.5;color:var(--tx3);text-align:left;margin:8px 0}

.pal{touch-action:pan-x}
#doneBar{flex:0 0 66px;display:none;align-items:center;gap:10px;padding:8px 10px;background:var(--okbg);border-top:2px solid var(--okln);font-size:12.5px;line-height:1.3}
#doneBar span{flex:1}
#doneBar b{color:var(--neon)}
#ghost{position:fixed;left:0;top:0;width:72px;height:64px;border-radius:12px;background:var(--selbg);border:2px solid var(--blu);box-shadow:0 10px 26px rgba(0,0,0,.55),0 0 16px rgba(77,163,255,.6);display:none;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--tx);pointer-events:none;z-index:99;opacity:.96;animation:gpop .14s ease-out}
@keyframes gpop{from{scale:.6;opacity:.3}}
#ghost svg *{fill:none;stroke:var(--tx2);stroke-width:2.2;stroke-linecap:round}
#ghost svg text{fill:var(--tx2);stroke:none;font:700 11px ui-monospace,monospace;text-anchor:middle}
.cell.dz{background:rgba(57,255,106,.25)!important;outline:2px solid var(--neon)!important;animation:none!important}
.cell.dragsrc{opacity:.35}
.cell.full{touch-action:none;cursor:grab}
.cell.dz.sw{background:rgba(255,176,32,.25)!important;outline-color:var(--amb)!important}
#palette.trash{background:var(--danbg);border-top-color:var(--red)}
#palette.trash>*{opacity:.15}
#palette.trash::after{content:attr(data-trash);position:absolute;left:0;right:0;text-align:center;line-height:54px;color:var(--redt);font-weight:800;font-size:14px}
#palette.trash.hot{background:var(--danhot);box-shadow:inset 0 0 20px rgba(255,77,77,.6)}
#palette{position:relative}
#menu{background:radial-gradient(120% 70% at 50% 0%,var(--mglow) 0%,var(--bg) 55%)}
#menu .sheet{background:transparent}
.mm{display:flex;flex-direction:column;gap:10px;min-height:100%;padding-bottom:10px}
#mcv{width:100%;height:150px;display:block}
.mm-title{text-align:center;font-weight:900;font-size:40px;letter-spacing:3px;line-height:1;color:var(--ttl);text-shadow:0 0 10px var(--neon),0 0 28px rgba(57,255,106,.55);margin-top:2px}
.mm-title span{display:block;font-size:26px;letter-spacing:10px;color:var(--amb);text-shadow:0 0 12px rgba(255,176,32,.6);margin-top:4px}
.mm-sub{text-align:center;font-size:10.5px;letter-spacing:2.5px;color:var(--dim);margin-bottom:6px}
.pts{align-self:center;background:var(--okbg);border:1.5px solid var(--okln);color:var(--neon);font-weight:800;border-radius:99px;padding:6px 16px;font-size:14px;margin-bottom:6px}
.bigbtn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:52px;border-radius:14px;border:1.5px solid var(--ln);background:var(--big);color:var(--tx);font-size:16px;font-weight:800}
.bigbtn small{font-weight:500;color:var(--dim);font-size:11px}
.bigbtn.play{min-height:62px;font-size:22px;letter-spacing:2px;color:#06210f;border:0;background:linear-gradient(90deg,#22d957,#39ff6a);box-shadow:0 0 24px rgba(57,255,106,.45)}
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topbar h3{flex:1;margin:0;font-size:17px}
.topbar .pp{color:var(--neon);font-weight:800;font-size:13px}
.ccard{display:flex;gap:12px;align-items:center;width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--ln);background:var(--card);text-align:left;color:var(--tx);margin-bottom:10px}
.ccard .ic{flex:0 0 58px;height:58px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--icb);border:1.5px solid currentColor}

#goals{gap:6px;margin-top:10px}
.gl{height:32px;display:inline-flex;align-items:center;gap:4px;padding:0 12px 0 8px;border-radius:var(--sh-s);border:1px solid var(--md-outlineVariant);background:transparent;color:var(--md-onSurfaceVariant);font:600 13px var(--font)}
.gl .ms{font-size:18px}
.gl.ok{background:var(--md-primaryContainer);color:var(--md-onPrimaryContainer);border-color:transparent}

/* --- sahne kartı --- */
#sceneWrap{margin:8px 12px 0;border-radius:var(--sh-xl);overflow:hidden;background:var(--md-surfaceContainerLowest);height:clamp(140px,22vh,210px)}
#err{border-radius:var(--sh-xl);background:var(--md-errorContainer);color:var(--md-onErrorContainer);border:0;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:16px}
#err b{font-size:15px;font-weight:700}

/* --- giriş butonları (START/STOP/şalter) --- */
#io{background:transparent;border:0;padding:10px 12px 4px;gap:10px}
.iob{height:56px;border:0;border-radius:var(--sh-l);background:var(--md-surfaceContainerHigh);color:var(--md-onSurface);gap:10px;padding:0 16px;transition:border-radius .3s var(--ease-sp),background .15s,transform .2s var(--ease-sp)}
.iob .lt{width:12px;height:12px;flex:0 0 12px;border:0;background:color-mix(in srgb,var(--c) 35%,var(--md-outline))}
.iob .tx b{font-size:15px;font-weight:800;letter-spacing:.4px}
.iob .tx small{color:var(--md-onSurfaceVariant);font:600 11px ui-monospace,monospace}
.iob:active{transform:none;border-radius:var(--sh-xl)}
.iob.on{background:color-mix(in srgb,var(--c) 26%,var(--md-surfaceContainerHigh));box-shadow:none;border-radius:var(--sh-xl)}
.iob.on:not(.sw) .lt{background:var(--c);box-shadow:0 0 10px var(--c)}
.iob.sw .lt{width:52px;height:32px;flex:0 0 52px;border-radius:16px;background:var(--md-surfaceContainerHighest);border:2px solid var(--md-outline)}
.iob.sw .lt::after{top:6px;left:6px;width:16px;height:16px;background:var(--md-outline);transition:all .3s var(--ease-sp)}
.iob.on.sw .lt{background:var(--c);border-color:var(--c)}
.iob.on.sw .lt::after{left:22px;top:2px;width:24px;height:24px;background:#fff}
.iob.idle{opacity:.6}
html[data-theme=light] #io{background:transparent}

/* --- kontrol çubuğu --- */
#ctrl{background:transparent;border:0;padding:10px 12px 10px;gap:10px}
#run{height:56px;border-radius:var(--sh-l);font:800 17px var(--font);letter-spacing:.8px;background:var(--md-primary);color:var(--md-onPrimary);box-shadow:0 3px 8px color-mix(in srgb,var(--md-primary) 30%,transparent);display:flex;align-items:center;justify-content:center;gap:8px;transition:border-radius .4s var(--ease-sp),background .25s,transform .2s var(--ease-sp)}
#run .ms{font-size:28px}
#run.on{background:var(--md-error);color:var(--md-onError);border-radius:var(--sh-xxl);box-shadow:0 3px 8px color-mix(in srgb,var(--md-error) 30%,transparent)}
#run:active{border-radius:var(--sh-xl);transform:scale(.98)}
html[data-theme=light] #run:not(.on){background:var(--md-primary)}
#ctrl .ib.big{width:56px;height:56px;min-width:56px;border-radius:var(--sh-l);background:var(--md-secondaryContainer);color:var(--md-onSecondaryContainer);font:800 16px var(--font)}
#ctrl .ib.big:active{border-radius:var(--sh-xl)}
#ctrl .hintb{background:var(--md-tertiaryContainer)!important;color:var(--md-onTertiaryContainer)!important}

/* --- editör --- */
#editor{background:var(--md-surfaceContainerLow);border-radius:var(--sh-xl) var(--sh-xl) 0 0;margin-top:2px}
#ehead{border:0;color:var(--md-onSurfaceVariant);font-size:12.5px;padding:10px 14px 4px}
#ehead b{color:var(--md-onSurface)}
.sm{height:36px;border-radius:var(--sh-full);border:1px solid var(--md-outlineVariant);background:transparent;color:var(--md-onSurfaceVariant);font:600 13px var(--font);padding:0 14px 0 10px;display:inline-flex;align-items:center;gap:4px}
.sm .ms{font-size:18px}
.rm{width:32px;height:32px;border-radius:var(--sh-full);background:transparent;border:0;color:var(--md-onSurfaceVariant)}
.rm .ms{font-size:20px}
.grid{background:none}
#addr{border-radius:var(--sh-l);border:1.5px dashed var(--md-outlineVariant);color:var(--md-onSurfaceVariant);height:44px;font:600 13px var(--font);display:flex;align-items:center;justify-content:center;gap:6px}
#rungs[data-tool="c"] .cell.ec,#rungs[data-tool="o"] .cell.eo{background:color-mix(in srgb,var(--md-primary) 12%,transparent);outline:2px dashed var(--md-primary);border-radius:var(--sh-m)}
.cell.dz{background:color-mix(in srgb,var(--md-primary) 28%,transparent)!important;outline:2.5px solid var(--md-primary)!important;border-radius:var(--sh-l)}
.cell.dz.sw{background:color-mix(in srgb,var(--md-tertiary) 28%,transparent)!important;outline-color:var(--md-tertiary)!important}
.cell .bx{rx:8}

/* --- palet: yüzen araç çubuğu --- */
#palette{flex-basis:84px;background:var(--md-surfaceContainerLow);border:0;padding:8px 12px calc(10px + env(safe-area-inset-bottom));gap:8px}
.pal{flex:0 0 66px;height:66px;border-radius:var(--sh-l);background:var(--md-surfaceContainerHighest);border:0;color:var(--md-onSurface);gap:2px;transition:border-radius .35s var(--ease-sp),background .2s,transform .3s var(--ease-sp)}
.pal svg *{stroke:var(--md-onSurfaceVariant)}
.pal svg text{fill:var(--md-onSurface)}
.pal span{font:700 11px var(--font)}
.pal.sel{background:var(--md-primary);color:var(--md-onPrimary);border-radius:var(--sh-xl);box-shadow:0 4px 12px color-mix(in srgb,var(--md-primary) 35%,transparent);transform:translateY(-4px)}
.pal.sel svg *{stroke:var(--md-onPrimary)}.pal.sel svg text{fill:var(--md-onPrimary)}
.pal:active{border-radius:var(--sh-xl)}
.pal .nw{background:var(--md-tertiary);color:var(--md-onTertiary);border-radius:var(--sh-s);font:800 9px var(--font);box-shadow:none;top:-6px;right:-6px;padding:3px 6px}
#palette.trash{background:var(--md-errorContainer)}
#palette.trash::after{color:var(--md-onErrorContainer);font:700 15px var(--font);line-height:66px}
#palette.trash.hot{background:var(--md-error)}
#palette.trash.hot::after{color:var(--md-onError)}
#doneBar{background:var(--md-primaryContainer);color:var(--md-onPrimaryContainer);border:0;border-radius:var(--sh-xl) var(--sh-xl) 0 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));flex-basis:84px}
#doneBar b{color:var(--md-onPrimaryContainer)}

/* --- butonlar --- */
.btn{height:48px;border-radius:var(--sh-full);border:0;background:var(--md-surfaceContainerHighest);color:var(--md-primary);font:700 15px var(--font);padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:border-radius .35s var(--ease-sp),transform .2s var(--ease-sp)}
.btn:active{border-radius:var(--sh-m);transform:none}
.btn.pri{background:var(--md-primary);color:var(--md-onPrimary);border:0}
html[data-theme=light] .btn.pri{background:var(--md-primary);border:0}
.btn.dan{background:var(--md-errorContainer);color:var(--md-onErrorContainer);border:0}
.btn .ms{font-size:20px}
.brow{gap:10px;margin-top:18px}
.bigbtn{min-height:60px;border-radius:var(--sh-xl);border:0;background:var(--md-surfaceContainerHigh);color:var(--md-onSurface);font:700 16px var(--font);gap:12px;justify-content:flex-start;padding:0 22px;transition:border-radius .35s var(--ease-sp),transform .25s var(--ease-sp),background .2s}
.bigbtn .ms{font-size:24px;color:var(--md-primary)}
.bigbtn:active{border-radius:var(--sh-l);transform:scale(.98)}
.bigbtn.play{min-height:88px;font:900 26px var(--font);letter-spacing:1.5px;justify-content:center;background:var(--md-primary);color:var(--md-onPrimary);border-radius:var(--sh-xxl);box-shadow:0 6px 18px color-mix(in srgb,var(--md-primary) 35%,transparent)}
.bigbtn.play .ms{color:var(--md-onPrimary);font-size:40px}
html[data-theme=light] .bigbtn.play{background:var(--md-primary)}
.bigbtn small{color:var(--md-onSurfaceVariant)}
.brow2{gap:10px}
.brow2 .bigbtn{flex-direction:column;justify-content:center;align-items:center;min-height:88px;gap:6px;padding:10px;border-radius:var(--sh-xl)}
.brow2 .bigbtn .ms{font-size:28px}
.brow2 .bigbtn:first-child{background:var(--md-tertiaryContainer);color:var(--md-onTertiaryContainer)}
.brow2 .bigbtn:first-child .ms{color:var(--md-onTertiaryContainer)}
.brow2 .bigbtn:last-child{background:var(--md-secondaryContainer);color:var(--md-onSecondaryContainer)}
.brow2 .bigbtn:last-child .ms{color:var(--md-onSecondaryContainer)}
.instb{background:var(--md-tertiaryContainer)!important;color:var(--md-onTertiaryContainer)!important;border:0!important}
.instb .ms{color:var(--md-onTertiaryContainer)!important}
.mi{height:56px;border-radius:var(--sh-l);border:0;background:var(--md-surfaceContainerHigh);color:var(--md-onSurface);font:600 15px var(--font);display:flex;align-items:center;gap:14px;padding:0 18px;margin-bottom:8px;transition:border-radius .3s var(--ease-sp)}
.mi .ms{color:var(--md-onSurfaceVariant)}
.mi:active{border-radius:var(--sh-xl)}
.mi .sp{flex:1}
/* M3 switch (liste sonu) */
.swt{width:52px;height:32px;border-radius:16px;background:var(--md-surfaceContainerHighest);border:2px solid var(--md-outline);position:relative;flex:0 0 52px;transition:all .3s var(--ease-sp)}
.swt::after{content:"";position:absolute;left:6px;top:6px;width:16px;height:16px;border-radius:50%;background:var(--md-outline);transition:all .3s var(--ease-sp)}
.swt.on{background:var(--md-primary);border-color:var(--md-primary)}
.swt.on::after{left:22px;top:2px;width:24px;height:24px;background:var(--md-onPrimary)}

/* --- diyalog, alt sayfa, snackbar --- */
.ov{background:var(--ov)}
.card{background:var(--md-surfaceContainerHigh);color:var(--md-onSurface);border:0;border-radius:var(--sh-xl);padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.28);animation:cpop .45s var(--ease-sp)}
.card h3,.sheet h3{font:700 22px var(--font);letter-spacing:-.2px;margin-bottom:6px}
.sheet{background:var(--md-surfaceContainerLow);border:0;border-radius:var(--sh-xl) var(--sh-xl) 0 0;padding:10px 18px calc(18px + env(safe-area-inset-bottom));animation:up .4s var(--ease-sl)}
.sheet::before{content:"";display:block;width:32px;height:4px;border-radius:2px;background:var(--md-outline);opacity:.5;margin:4px auto 14px}
#menu .sheet::before{display:none}
p.t{color:var(--md-onSurfaceVariant);font-size:14px}
.grp{font:700 12px var(--font);letter-spacing:.8px;color:var(--md-primary);margin:16px 0 8px}
.chip{height:auto;min-height:44px;border-radius:var(--sh-s);border:1px solid var(--md-outlineVariant);background:transparent;color:var(--md-onSurface);font:700 13px ui-monospace,monospace;padding:6px 12px;transition:border-radius .3s var(--ease-sp),background .2s}
.chip small{color:var(--md-onSurfaceVariant);font:500 10.5px var(--font)}
.chip.sel{background:var(--md-secondaryContainer);color:var(--md-onSecondaryContainer);border-color:transparent;border-radius:var(--sh-l);box-shadow:none}
.chip.sel small{color:var(--md-onSecondaryContainer)}
.fld input{height:56px;border-radius:var(--sh-xs) var(--sh-xs) 0 0;border:0;border-bottom:2px solid var(--md-onSurfaceVariant);background:var(--md-surfaceContainerHighest);color:var(--md-onSurface);font:500 16px var(--font);padding:0 14px}
.fld input:focus{outline:0;border-bottom-color:var(--md-primary)}
.fld label{color:var(--md-onSurfaceVariant);font:600 12px var(--font)}
.step b{color:var(--md-primary);font:800 18px var(--font)}
.step .btn{width:48px;padding:0;background:var(--md-secondaryContainer);color:var(--md-onSecondaryContainer)}
#toast{background:var(--md-inverseSurface);color:var(--md-inverseOnSurface);border:0;border-radius:var(--sh-m);font:500 14px var(--font);padding:14px 18px;bottom:104px;box-shadow:0 4px 14px rgba(0,0,0,.3);transition:opacity .2s,transform .35s var(--ease-sp);transform:translateX(-50%) translateY(12px)}
#toast.show{transform:translateX(-50%) translateY(0)}
html[data-theme=light] #toast{color:var(--md-inverseOnSurface)}
#ghost{border-radius:var(--sh-l);background:var(--md-primaryContainer);border:0;color:var(--md-onPrimaryContainer);box-shadow:0 10px 24px rgba(0,0,0,.35)}
#ghost svg *{stroke:var(--md-onPrimaryContainer)}#ghost svg text{fill:var(--md-onPrimaryContainer)}
#tip{background:var(--md-inverseSurface);color:var(--md-inverseOnSurface);border:0;border-radius:var(--sh-l)}
#tip::after{background:var(--md-inverseSurface);border:0}
#tip .th svg *{stroke:var(--md-inversePrimary)}#tip .th svg text{fill:var(--md-inversePrimary)}
#tip p{color:var(--md-inverseOnSurface);opacity:.9}#tip small{color:var(--md-inverseOnSurface);opacity:.7}
#tip .tx2{color:var(--md-inversePrimary)}

/* --- menüler --- */
#menu{background:var(--md-surface)}
.mm{gap:12px}
.mm-title{font-family:var(--font);font-weight:900;font-size:54px;letter-spacing:-1.5px;line-height:.9;color:var(--md-primary);text-shadow:none;font-variation-settings:"wdth" 120,"opsz" 144;margin-top:6px}
.mm-title span{font-size:30px;letter-spacing:10px;color:var(--md-tertiary);text-shadow:none;font-weight:800;font-variation-settings:"wdth" 151;margin-top:8px}
html[data-theme=light] .mm-title{text-shadow:none}
.mm-sub{font:700 11px var(--font);letter-spacing:2.2px;color:var(--md-onSurfaceVariant)}
.pts{background:var(--md-primaryContainer);color:var(--md-onPrimaryContainer);border:0;border-radius:var(--sh-full);height:40px;display:inline-flex;align-items:center;gap:6px;padding:0 18px;font:800 16px var(--font)}
.acct{height:40px;border-radius:var(--sh-full);border:1px solid var(--md-outlineVariant);color:var(--md-onSurface);display:inline-flex;align-items:center;gap:8px;padding:0 16px 0 6px;font:600 14px var(--font)}
.acct .av2{width:28px;height:28px;border-radius:50%;background:var(--md-tertiaryContainer);color:var(--md-onTertiaryContainer);display:inline-flex;align-items:center;justify-content:center;font:800 14px var(--font)}
.ver{font:600 12px var(--font);color:var(--md-onSurfaceVariant);opacity:.8}
.topbar{gap:4px;margin:-4px -6px 14px}
.topbar h3{font:700 22px var(--font);letter-spacing:-.2px}
.topbar .pp{background:var(--md-primaryContainer);color:var(--md-onPrimaryContainer);border-radius:var(--sh-full);padding:6px 12px;font:800 13px var(--font)}
.mapbar{background:var(--md-surface)}
.pcard{background:var(--md-surfaceContainerLow);border:0;border-radius:var(--sh-xl);padding:16px 18px}
.pic{border:0;border-radius:var(--sh-l);background:var(--md-surfaceContainerHighest)}
.prof .av{background:var(--md-tertiaryContainer);color:var(--md-onTertiaryContainer);border:0;width:88px;height:88px;font-size:38px;border-radius:var(--sh-xxl)}
.prof span{color:var(--md-primary)}
.myr{background:var(--md-primaryContainer);color:var(--md-onPrimaryContainer);border:0;border-radius:var(--sh-xl);padding:14px 18px}
.lbr{background:var(--md-surfaceContainerLow);border:0;border-radius:var(--sh-l);padding:12px 14px;min-height:56px}
.lbr:first-child{border-radius:var(--sh-xl) var(--sh-xl) var(--sh-l) var(--sh-l)}
.lbr .sc{color:var(--md-primary)}
.lbr.me{background:var(--md-secondaryContainer);color:var(--md-onSecondaryContainer)}
.seg{gap:2px}
.seg button{height:48px;border:0;border-radius:var(--sh-s);background:var(--md-surfaceContainerHighest);color:var(--md-onSurface);font:600 14px var(--font);display:flex;align-items:center;justify-content:center;gap:6px;transition:border-radius .35s var(--ease-sp),background .2s}
.seg button:first-child{border-radius:var(--sh-full) var(--sh-s) var(--sh-s) var(--sh-full)}
.seg button:last-child{border-radius:var(--sh-s) var(--sh-full) var(--sh-full) var(--sh-s)}
.seg button.on{background:var(--md-secondaryContainer);color:var(--md-onSecondaryContainer);border-radius:var(--sh-full)}
.seg button .ms{font-size:20px}
.gcard{background:var(--md-surfaceContainerLow);border:0;border-radius:var(--sh-xl)}
.hstep{background:var(--md-surfaceContainerLow);border:0;border-radius:var(--sh-l);padding:14px 16px}
.hstep:first-of-type{border-radius:var(--sh-xl) var(--sh-xl) var(--sh-l) var(--sh-l)}
.hstep h4{color:var(--md-primary);font:800 14px var(--font);display:flex;align-items:center;gap:8px}
.hstep h4 i{font-style:normal;width:24px;height:24px;border-radius:50%;background:var(--md-primary);color:var(--md-onPrimary);display:inline-flex;align-items:center;justify-content:center;font:800 13px var(--font)}
.elb{height:40px;border-radius:var(--sh-s);border:1px solid var(--md-outlineVariant);background:transparent;color:var(--md-onSurface);font:600 13px var(--font)}
.elb.on{background:var(--md-secondaryContainer);color:var(--md-onSecondaryContainer);border-color:transparent}
.ex{background:var(--md-surfaceContainerLowest);border:0;border-radius:var(--sh-l)}
.solv{background:var(--md-surfaceContainerLowest);border:0;border-radius:var(--sh-l)}
.nwt{color:var(--md-tertiary);font:800 12px var(--font);display:flex;align-items:center;gap:6px}
.gain{color:var(--md-primary);text-shadow:none;font:900 40px var(--font);font-variation-settings:"wdth" 120}
.stars .f{color:var(--md-primary)}

/* --- yol haritası: M3 Expressive şekiller --- */
.rdp .rb{stroke:var(--md-surfaceContainerHigh)}
.rdp .rl{stroke:var(--md-surfaceContainerLow)}
.rdp .rdn{stroke:var(--md-primary)}
.nd{width:64px;height:64px;border:0!important;border-radius:0;background:none!important;box-shadow:none!important;color:var(--md-onSurfaceVariant);font:900 20px var(--font);animation:ndin .5s var(--ease-sp) both}
.nd::before{content:"";position:absolute;inset:0;background:var(--md-surfaceContainerHighest);clip-path:var(--shp,circle(50%));transition:transform .5s var(--ease-sp);z-index:-1;animation:none;border:0;opacity:1}
.nd b{position:relative}
.nd.dn{color:var(--md-onPrimaryContainer)}
.nd.dn::before{background:var(--md-primaryContainer)}
.nd.cur{width:84px;height:84px;color:var(--md-onPrimary);font-size:26px;animation:ndin .5s var(--ease-sp) both}
.nd.cur::before{background:var(--md-primary);animation:spin 9s linear infinite;inset:0;border:0;opacity:1}
.nd.cur::after{content:"";position:absolute;inset:-10px;clip-path:var(--shp);background:var(--md-primary);opacity:.18;animation:spin 14s linear infinite reverse;z-index:-2}
.nd.lk{opacity:1;color:var(--md-onSurfaceVariant)}
.nd.lk::before{background:var(--md-surfaceContainerHigh)}
.nd.lk .ms{font-size:22px;opacity:.7}
.nd.ex{width:72px;height:72px}
.nd.ex::before{background:var(--md-errorContainer)}
.nd.ex.dn{color:var(--md-onError)}.nd.ex.dn::before{background:var(--md-error)}
.nd.ex.cur{color:var(--md-onError)}.nd.ex.cur::before{background:var(--md-error)}
.nd.ex.cur::after{background:var(--md-error)}
.nd.lk.ex{color:var(--md-onErrorContainer)}.nd.lk.ex::before{background:var(--md-errorContainer)}
.nd i{background:var(--md-primary);color:var(--md-onPrimary);width:22px;height:22px;right:-2px;top:-2px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.nd i .ms{font-size:16px}
.nd em{background:var(--md-tertiaryContainer);color:var(--md-onTertiaryContainer);border-radius:var(--sh-s);font:800 12px var(--font);top:-34px;padding:4px 10px}
.nd u{left:-6px;bottom:-4px}
.nd u .ms{font-size:20px;color:var(--md-error)}
.nd s.tp{height:5px;width:18px;bottom:8px}
.exl{color:var(--md-error);font:800 10.5px var(--font)}
.fog{background:linear-gradient(var(--md-surface),color-mix(in srgb,var(--md-surface) 0%,transparent));color:var(--md-onSurfaceVariant);font:700 13px var(--font)}
.dec{opacity:.35;filter:grayscale(.3)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes ndin{from{opacity:0;transform:translate(-50%,-50%) scale(.3) rotate(-40deg)}to{transform:translate(-50%,-50%)}}
.nd:active::before{transform:scale(.88)}

/* --- canlı izleme renkleri (enerji = primary) --- */
.cell .wl,.cell .wr{stroke:var(--md-outline)}
.cell .sym{stroke:var(--md-onSurfaceVariant)}
.cell .ad{fill:var(--md-onSurface)}
.cell .bx{fill:var(--md-surfaceContainerHigh);stroke:var(--md-outline)}
.cell .bt{fill:var(--md-onSurface)}
.cell .bv{fill:var(--md-primary)}
.cell .cl{fill:var(--md-onSurface)}
.cell.lp .wl,.cell.rp .wr{stroke:var(--md-primary);filter:none}
.cell.ps .sym{stroke:var(--md-primary);filter:none}
.cell.ps .bx{stroke:var(--md-primary);fill:var(--md-primaryContainer)}
.cell.ps .cl{fill:var(--md-primary)}
.rail{background:var(--md-outline);border-radius:2px}
.grid.on .rail{background:var(--md-primary);box-shadow:none}
.vw{background:var(--md-outline)}.vw.on{background:var(--md-primary);box-shadow:none}

/* --- hareket --- */
@keyframes cpop{from{transform:scale(.8);opacity:0}}
@keyframes up{from{transform:translateY(60px);opacity:.4}}
.scrIn>*{animation:scr .5s var(--ease-sl) both}
@keyframes scr{from{transform:translateY(24px);opacity:0}}
.cell.pop{animation:cellpop .5s var(--ease-sp)}

/* ---------- PLC (sanal scan cycle) ---------- */
class PLC{
  constructor(){ this.reset(); }
  reset(){ this.b={}; this.T={}; this.C={}; this.res=[]; this.ed=new WeakMap(); this.first=true; this.tm=0; }
  rd(a){ const k=a[0]; if(k==='T') return !!(this.T[a]&&this.T[a].q); if(k==='C') return !!(this.C[a]&&this.C[a].q); return !!this.b[a]; }
  /* word (sayı) okuma: VW, AIW, C (sayaç değeri), T (100 ms birim), QB/IB (8 bit), SAAT */
  wv(a){ if(typeof a==='number') return a; if(a==null) return 0;
    if(isByte(a)){ const pre=a[0]+a[2]+'.'; let v=0; for(let i=0;i<8;i++) if(this.b[pre+i]) v|=1<<i; return v; }
    if(/^C\d/.test(a)) return this.C[a]?this.C[a].cv:0;
    if(/^T\d/.test(a)) return this.T[a]?Math.floor(this.T[a].et/100):0;
    return +this.b[a]||0; }
  ww(a,v){ v=Math.trunc(v)||0;
    if(isByte(a)){ if(a[0]==='I') return; v&=255; const pre=a[0]+a[2]+'.'; for(let i=0;i<8;i++) this.b[pre+i]=!!(v&(1<<i)); return; }
    this.b[a]=((v&0xFFFF)^0x8000)-0x8000; }
  scan(prog,dt){ this.tm+=dt; this.b['SM0.0']=true; this.b['SM0.1']=this.first; this.b['SM0.5']=(this.tm%1000)<500;
    this.res=[]; for(const rg of prog.rungs) this.res.push(this.rung(rg,dt)); this.first=false; }
  step(x,inp){ if(!x||isOut(x.t)) return inp;
    switch(x.t){
      case 'NO': return inp&&this.rd(x.a);
      case 'NC': return inp&&!this.rd(x.a);
      case 'P': { const pr=!!this.ed.get(x); this.ed.set(x,inp); return inp&&!pr; }
      case 'N': { const pr=!!this.ed.get(x); this.ed.set(x,inp); return !inp&&pr; }
      case 'NOT': return !inp;
      case 'CMP': return inp&&cmpOk(this.wv(x.a),x.op,x.pv);
    } return inp; }
  rung(rg,dt){
    const Rs={in:[[],[]],out:[[],[]],outIn:false};
    const sp=branchSpan(rg); let p=true,c=0;
    while(c<OUTC){
      if(sp&&c===sp.from){
        let pa=p,pb=p;
        for(let k=sp.from;k<=sp.to;k++){ Rs.in[0][k]=pa; pa=this.step(rg.c[0][k],pa); Rs.out[0][k]=pa; Rs.in[1][k]=pb; pb=this.step(rg.c[1][k],pb); Rs.out[1][k]=pb; }
        p=pa||pb; c=sp.to+1;
      } else { Rs.in[0][c]=p; p=this.step(rg.c[0][c],p); Rs.out[0][c]=p; c++; }
    }
    Rs.outIn=p;
    const o=rg.c[0][OUTC]; if(o&&isOut(o.t)) this.exec(o,p,dt);
    return Rs;
  }
  exec(o,p,dt){
    const a=o.a;
    switch(o.t){
      case 'COIL': this.b[a]=p; break;
      case 'SET': if(p) this.b[a]=true; break;
      case 'RST': if(p){
        if(a[0]==='T'){ const t=this.T[a]; if(t){ t.et=0; t.q=false; } }
        else if(a[0]==='C'){ const c=this.C[a]; if(c){ c.cv=c.type==='CTD'?c.pv:0; c.q=c.type==='CTD'?c.cv<=0:c.cv>=c.pv; } }
        else this.b[a]=false; } break;
      case 'TON': { let t=this.T[a]; if(!t||t.type!=='TON') t=this.T[a]={type:'TON',et:0,q:false,pv:0};
        t.pv=(o.pv||2)*1000; if(p){ t.et=Math.min(t.et+dt,t.pv); t.q=t.et>=t.pv; } else { t.et=0; t.q=false; } break; }
      case 'TONR': { let t=this.T[a]; if(!t||t.type!=='TONR') t=this.T[a]={type:'TONR',et:0,q:false,pv:0};
        t.pv=(o.pv||2)*1000; if(p) t.et=Math.min(t.et+dt,t.pv); t.q=t.et>=t.pv; break; }
      case 'TOF': { let t=this.T[a]; if(!t||t.type!=='TOF') t=this.T[a]={type:'TOF',et:0,q:false,pv:0};
        t.pv=(o.pv||2)*1000; if(p){ t.q=true; t.et=0; } else if(t.q){ t.et+=dt; if(t.et>=t.pv){ t.et=t.pv; t.q=false; } } break; }
      case 'CTU': case 'CTD': { let c=this.C[a]; const pv=o.pv||3;
        if(!c||c.type!==o.t) c=this.C[a]={type:o.t,cv:o.t==='CTD'?pv:0,pv:pv,q:false,pi:false};
        c.pv=pv; if(p&&!c.pi){ if(o.t==='CTU') c.cv=Math.min(c.cv+1,999); else c.cv=Math.max(c.cv-1,-99); } c.pi=p;
        c.q=o.t==='CTU'?c.cv>=c.pv:c.cv<=0; break; }
      default: if(!p) break; {
        const v=this.wv(a), k=o.pv||0;
        switch(o.t){
          case 'MOV': this.ww(a,o.src?this.wv(o.src):k); break;
          case 'ADD': this.ww(a,v+k); break;
          case 'SUB': this.ww(a,v-k); break;
          case 'MUL': this.ww(a,v*k); break;
          case 'DIV': if(k) this.ww(a,Math.trunc(v/k)); break;
          case 'INC': this.ww(a,v+1); break;
          case 'DEC': this.ww(a,v-1); break;
          case 'SHL': this.ww(a,isByte(a)?(v<<k)&255:(v<<k)); break;
          case 'SHR': this.ww(a,isByte(a)?(v&255)>>k:(v&0xFFFF)>>>k); break;
          case 'WAND': this.ww(a,v&k); break;
          case 'WOR': this.ww(a,v|k); break;
          case 'INV': this.ww(a,~v); break;
          case 'SEG': this.ww(a,SEGT[this.wv(o.src)&15]); break;
          case 'RTC': this.ww(a,+this.b.SAAT||0); break;
        } }
    }
  }
}

/* ---------- FABRİKA DÜNYASI ---------- */
class World{
  constructor(lv){ this.lv=lv; const s=lv.scene;
    this.sc=Object.assign({speed:20,gap:1.2,sensors:[],pistons:[],valves:[],lamps:[],endDrop:'err',rules:[]},s); this.reset(); }
  mk(id){ return {id,x:0,st:'belt',py:0,fill:0,wait:0,ft:0,chk:false}; }
  reset(){
    this.t=0; this.boxes=this.sc.noBelt?[]:[this.mk(1)]; this.nid=1; this.spawnT=0; this.err=null; this.done=false; this.settle=0;
    this.delivered=0; this.diverted=0; this.filled=0; this.cntRises=0; this.batches=0;
    this.sw={}; this.pulse={}; this.ext={}; this.f={}; this.gd=this.lv.goals.map(()=>false); this.iv={};
    this.sc.pistons.forEach(p=>{this.ext[p.a]=0;});
    this.motor=false; this.pm=false; this.beltOff=0; this.fanAng=0; this.idleT=0; this.spill=0; this.nofan=0;
    this.startPressed=false; this.startFall=null; this.pS=false; this.noStart=0; this.pP=false; this.stopWatch=0; this.stopPressT=null;
    this.pc=false; this.pendB=null; this.parkT=0; this.lpT=0; this.pA=false; this.ackSeen=false; this.pl=false;
    this.lrT=0; this.loT=0; this.andT=0; this.orT=0; this.atT=0; this.oa=0; this.ob=0; this.pkS=null; this.pLd=false; this.pSrc=false; this.srcFall=null; this.pLt=false; this.pLc=false; this.startAt=null; this.sdLamp=0; this.mFall=null; this.prevSp=false; this.prevFan=false; this.sprayOffT=null; this.q={}; this.shake=0;
    this.rs=this.sc.rules.map(()=>({})); this.hold={}; this.mv={}; this.ms=this.sc.mach&&typeof MACH!=='undefined'?MACH[this.sc.mach.kind].init(this.sc.mach,this):null; this.cnt={}; this.pv=this.sc.proc?this.sc.proc.v0:0; this.hour=this.sc.clock?this.sc.clock.h0:0; this.spd=this.sc.speed;
  }
  fail(m){ if(!this.err&&!this.done) this.err=m; return false; }
  press(a){ const d=this.lv.io.I.find(x=>x.a===a); if(!d) return; if(d.k==='btn') this.pulse[a]=0.3; else if(d.k==='sw') this.sw[a]=!this.sw[a]; }
  sensorOn(a){ const s=this.sc.sensors.find(s=>s.a===a); if(!s) return false; return this.boxes.some(b=>b.st==='belt'&&Math.abs(b.x-s.x)<=BW); }
  sense(){
    const iv={}; if(this.ms) MACH[this.sc.mach.kind].sense(this,this.sc.mach,this.ms);
    for(const d of this.lv.io.I){
      if(d.k==='btn') iv[d.a]=(this.pulse[d.a]||0)>0;
      else if(d.k==='sw') iv[d.a]=!!this.sw[d.a];
      else if(d.k==='sensor') iv[d.a]=this.sensorOn(d.a);
      else if(d.k==='hold') iv[d.a]=!!this.hold[d.a];
      else if(d.k==='m') iv[d.a]=!!this.mv[d.a];
      else if(d.k==='limit'){ const p=this.sc.pistons.find(p=>p.lim===d.a); iv[d.a]=!!p&&this.ext[p.a]>=0.98; }
    }
    if(this.sc.proc) iv[this.sc.proc.ai]=Math.round(Math.max(0,Math.min(1,this.pv))*32000);
    if(this.sc.clock) iv.SAAT=this.hour;
    this.iv=iv; return iv;
  }
  advance(q,dt){
    if(this.err||this.done) return;
    const sc=this.sc; this.q=q; this.t+=dt;
    for(const k in this.pulse) if(this.pulse[k]>0) this.pulse[k]=Math.max(0,this.pulse[k]-dt);
    this.motor=!!q[sc.motor];
    if(sc.speedW){ this.spd=Math.max(0,Math.min(60,+q[sc.speedW]||0)); }
    if(sc.clock){ this.hour=Math.floor(sc.clock.h0+this.t*sc.clock.rate)%24; }
    if(this.ms){ const m=MACH[sc.mach.kind].step(this,q,dt,sc.mach,this.ms); if(typeof m==='string') return this.fail(m); }
    if(sc.proc){ const P=sc.proc, on=Array.isArray(P.a)?P.a.some(a=>q[a]):q[P.a]; this.pv+=((on?P.up:0)-P.down+(P.drift?P.drift*Math.sin(this.t*P.dw):0))*dt; if(P.out) this.pv-=(q[P.out]?P.outRate:0)*dt;
      if(this.pv>=P.max) return this.fail(P.maxMsg); if(this.pv<=P.min) return this.fail(P.minMsg); }
    for(const p of sc.pistons){ const tg=q[p.a]?1:0, e=this.ext[p.a], d=tg-e, st=PIST_V*dt; this.ext[p.a]=Math.abs(d)<=st?tg:e+Math.sign(d)*st; }
    // v1.2.0c: limit şalterli piston — tam ilerleyince geri dönmeli; iterken bant durmalı
    for(const p of sc.pistons){ if(!p.lim) continue; const k='_pl'+p.a, k2='_pb'+p.a;
      if(this.ext[p.a]>=0.98){ this[k]=(this[k]||0)+dt; if(this[k]>0.8) return this.fail(tx(`Hata: Piston tam ilerledi ama geri dönmedi! Limit (${p.lim}) gelince pistonu geri çek.`,`Error: The piston reached full stroke but did not retract! Pull it back when the limit (${p.lim}) is reached.`)); } else this[k]=0;
      if(sc.pistStop&&this.ext[p.a]>0.3&&q[sc.motor]){ this[k2]=(this[k2]||0)+dt; if(this[k2]>0.3) return this.fail(tx('Hata: Piston iterken bant çalışıyor! Kutu sensöre gelince bant durmalı.','Error: The belt is running while the piston pushes! The belt must stop when the box reaches the sensor.')); } else this[k2]=0; }
    if(this.motor){ const v=sc.speedW?this.spd:sc.speed; this.beltOff=(this.beltOff+v*dt)%1000; for(const b of this.boxes) if(b.st==='belt') b.x+=v*dt; }
    if(sc.fan&&q[sc.fan.a]) this.fanAng+=dt*14;
    // piston itme
    for(const p of sc.pistons){ if(this.ext[p.a]>0.3){ for(const b of this.boxes){ if(b.st==='belt'&&Math.abs(b.x-p.x)<=6){
      b.st='pushed'; b.py=0;
      if(sc.divertIf&&!this.iv[sc.divertIf]) return this.fail(tx('Hata: Onay anahtarı kapalıyken kutu ayrıldı!','Error: Box diverted while the approval key was OFF!'));
      if(sc.divertEvery&&b.id%sc.divertEvery!==0) return this.fail(tx('Hata: Yanlış kutu ayrıldı! Yalnızca her '+sc.divertEvery+'. kutu ayrılmalı.','Error: Wrong box diverted! Only every '+sc.divertEvery+'th box should be diverted.'));
      if(sc.waitRange){ if(b.wait<sc.waitRange[0]) return this.fail(tx('Hata: Piston çok erken itti! Kutu sensörde beklemeliydi.','Error: Piston pushed too early! The box had to wait at the sensor.')); if(b.wait>sc.waitRange[1]) return this.fail(tx('Hata: Kutu sensörde çok uzun bekletildi!','Error: Box was held at the sensor too long!')); }
    } } } }
    for(const b of this.boxes){
      if(b.st==='pushed'){ const e=Math.max(...sc.pistons.map(p=>this.ext[p.a]),0); b.py=Math.min(1,Math.max(b.py+4*dt,e)); if(b.py>=1){ b.st='bin'; b.ft=0; this.diverted++; } }
      else if(b.st==='bin'||b.st==='end'||b.st==='removed') b.ft+=dt;
    }
    this.boxes=this.boxes.filter(b=>!((b.st==='end'&&b.ft>0.8)||(b.st==='removed'&&b.ft>0.6)||(b.st==='bin'&&b.ft>1.8)));
    // bekleme süresi
    if(sc.waitSensor){ const s=sc.sensors.find(s=>s.a===sc.waitSensor); for(const b of this.boxes) if(b.st==='belt'&&Math.abs(b.x-s.x)<=BW) b.wait+=dt; }
    // bant sonu
    for(const b of this.boxes){ if(b.st==='belt'&&b.x>=100){
      if(sc.divertEvery&&b.id%sc.divertEvery===0) return this.fail(tx('Hata: '+b.id+'. kutu ayrılmadan bant sonuna ulaştı!','Error: Box #'+b.id+' reached the end of the belt without being diverted!'));
      if(sc.divertIf&&this.iv[sc.divertIf]) return this.fail(tx('Hata: Onay anahtarı açıkken kutu ayrılmadı!','Error: Box was not diverted while the approval key was ON!'));
      if(sc.endDrop==='deliver'){ b.st='end'; b.ft=0; this.delivered++; if(b.fill>=0.95) this.filled++; }
      else return this.fail((sc.endMsg||tx('Hata: Kutu ayrılmadan bant sonuna ulaştı!','Error: Box reached the end of the belt without being diverted!')));
    } }
    // valfler
    for(const v of sc.valves){
      if(q[v.a]){ const tg=this.boxes.find(b=>b.st==='belt'&&Math.abs(b.x-v.x)<=6);
        if(tg){ tg.fill+=dt/v.fillTime; this.spill=0; if(tg.fill>1.3) return this.fail(v.kind==='spray'?tx('Hata: Fazla boya sıkıldı!','Error: Too much paint sprayed!'):tx('Hata: Şişe taştı! Valf çok uzun açık kaldı.','Error: Bottle overflowed! Valve stayed open too long.')); }
        else { this.spill+=dt; if(this.spill>0.6) return this.fail(v.kind==='spray'?tx('Hata: Boş kabine boya püskürtüldü!','Error: Paint sprayed into an empty booth!'):tx('Hata: Valf boşta açıldı, sıvı döküldü!','Error: Valve opened with no bottle, liquid spilled!')); } }
      else this.spill=0;
      for(const b of this.boxes) if(b.st==='belt'&&b.x>v.x+6&&b.fill<0.95&&!b.chk){ b.chk=true; return this.fail(v.kind==='spray'?tx('Hata: Kutu boyanmadan kabinden çıktı!','Error: Box left the booth unpainted!'):tx('Hata: Şişe dolmadan istasyondan geçti!','Error: Bottle passed the station without being filled!')); }
    }
    // spawn
    if(!sc.noBelt&&this.nid<sc.boxes){ this.spawnT+=dt; if(this.spawnT>=sc.gap&&!this.boxes.some(b=>b.st==='belt'&&b.x<14)){ this.boxes.push(this.mk(++this.nid)); this.spawnT=0; } }
    if(!this.checks(q,dt)) return;
    this.pm=this.motor;
    // hedefler
    const gl=this.goalList(); for(let i=0;i<gl.length;i++){ if(this.gd[i]) continue; if(gl[i].live) this.gd[i]=true; else break; }   // hedefler ekrandaki sırayla tamamlanır
    // v1.2.0c: hedefler bitince 0,6 sn daha izle — son adımın sonucu (ör. C'ye basınca kasa gerçekten kapandı mı) kontrol edilsin
    // son kontrolde kutu sensörden ayrılırsa (bant yeniden kalktıysa) 'Sensörde dur' geri alınır
    if(this.gd.every(Boolean)){ const pi=this.lv.goals.findIndex(g=>g.k==='park'); if(pi>=0&&pi===this.lv.goals.length-1&&this.parkT===0){ this.gd[pi]=false; this.settle=0; } }
    if(this.gd.every(Boolean)){ this.settle=(this.settle||0)+dt; if(this.settle>=0.6){ this.done=true; return; } } else this.settle=0;
    const active=this.boxes.some(b=>b.st==='belt'||b.st==='pushed');
    if(!sc.noBelt&&this.nid>=sc.boxes&&!active){ this.idleT+=dt; if(this.idleT>4.5) return this.fail(tx('Hedefe ulaşılamadı: kutular bitti. Programı gözden geçir.','Goal not reached: out of boxes. Review your program.')); } else this.idleT=0;
    if(this.t>240) this.fail(tx('Zaman aşımı: görev süresi doldu.','Timeout: task time is up.'));
  }
  checks(q,dt){
    const sc=this.sc, iv=this.iv||{}, goals=this.lv.goals;
    if(sc.startA){
      const s=!!iv[sc.startA];
      if(s&&!this.pS){ this.startPressed=true; this.startFall=null; this.stopPressT=null; this.startAt=this.t; this.sdLamp=0; }
      if(!s&&this.pS) this.startFall=this.t;
      this.pS=s;
      if(sc.startFirst&&!this.startPressed&&this.motor){ this.noStart+=dt; if(this.noStart>0.4) return this.fail(tx('Hata: START\'a basılmadan bant çalıştı!','Error: Belt ran before START was pressed!')); }
      if(this.startPressed&&!s&&this.startFall!==null&&this.t-this.startFall>=0.8&&this.motor) this.f.seal=true;
    }
    if(sc.stopA){
      const s=!!iv[sc.stopA];
      if(s&&!this.pP){ this.stopWatch=this.pm?0.6:0; this.stopPressT=this.pm?this.t:null; }
      this.pP=s;
      if(this.stopWatch>0){ this.stopWatch-=dt; if(!this.motor){ this.f.stop=true; this.stopWatch=0; } }
    }
    if(sc.stopDelay&&this.pm&&!this.motor&&this.stopPressT!==null){
      const td=sc.stopDelay===true?3:sc.stopDelay, d=this.t-this.stopPressT; this.stopPressT=null;
      if(d>=td-0.4&&d<=td+0.6) this.f.stopDelay=true; else return this.fail(tx('Hata: Bant STOP\'tan '+fx(d.toFixed(1))+' sn sonra durdu. Gecikme ≈'+fx(td)+' sn olmalı!','Error: Belt stopped '+d.toFixed(1)+' s after STOP. Delay should be ≈'+td+' s!'));
    }
    if(sc.countSensor){
      if(this.motor&&!this.pm) this.cntRises=0;
      const on=this.sensorOn(sc.countSensor); if(on&&!this.pc) this.cntRises++; this.pc=on;
      if(this.motor&&this.cntRises>sc.batchN) return this.fail(tx('Hata: Bant '+sc.batchN+' kutudan sonra durmadı!','Error: Belt did not stop after '+sc.batchN+' boxes!'));
      if(!this.motor&&this.pm&&this.cntRises===sc.batchN) this.pendB=0.5;
    }
    if(this.pendB!==null){ this.pendB-=dt; if(this.pendB<=0){ this.pendB=null; if(q[sc.lampA]) this.batches++; else return this.fail(tx('Hata: Parti tamamlandı ama lamba yanmadı!','Error: Batch finished but the lamp did not light!')); } }
    const pk=goals.find(g=>g.k==='park');
    if(pk){ if(!this.motor&&this.sensorOn(pk.s)) this.parkT+=dt; else this.parkT=0; }
    if(sc.lampA&&pk){ if(this.parkT>0&&q[sc.lampA]) this.lpT+=dt; if(this.lpT>=0.3) this.f.lampPark=true; }
    if(sc.ackA){
      const a=!!iv[sc.ackA];
      if(a&&!this.pA){ if(this.pl) this.ackSeen=true;
        const s=sc.sensors[0]; if(!this.motor) for(const b of this.boxes) if(b.st==='belt'&&Math.abs(b.x-s.x)<=BW){ b.st='removed'; b.ft=0; } }
      this.pA=a;
      if(this.pl&&!q[sc.lampA]&&this.ackSeen&&this.f.lampPark) this.f.lampAck=true;
      this.pl=!!q[sc.lampA];
    }
    if(goals.some(g=>g.k==='lampRun')){
      if(this.motor&&q[sc.lampA]) this.lrT+=dt;
      if(this.lrT>=1) this.f.lampRun=true;      // v1.2.0d: lamba bantla birlikte yanınca hemen tamamlanır
      if(!this.motor&&this.t>0.3&&q[sc.lampA]){ this.loT+=dt; if(this.loT>0.4) return this.fail(tx('Hata: Bant durdu ama ÇALIŞIYOR lambası hâlâ yanıyor! Lamba motoru izlemeli.','Error: The belt stopped but the RUNNING lamp is still on! The lamp must follow the motor.')); } else this.loT=0;
    }
    if(goals.some(g=>g.k==='lampPush')){ const e=Math.max(...sc.pistons.map(p=>this.ext[p.a]),0); if(q[sc.lampA]&&e>0.4) this.f.lampPush=true; }
    if(sc.fan){

function palOf(sol,extra){ const s=new Set(['NO','NC','COIL','SET','RST'].concat(extra||[])); for(const rg of sol.rungs) for(const row of rg.c) for(const c of row) if(c) s.add(c.t); return ORDER.filter(t=>s.has(t)); }

const earlyLamp=(lamp,n,msg)=>(w,q)=>{ if(q[lamp]&&(w.cntRises||0)<n) return msg; };

const togRule=(btn,expFn,sen)=>(w,q,iv,dt,s)=>{ const b=!!iv[btn], m=!!w.motor, so=sen?w.sensorOn(sen):false;
  if(b&&!s.pb){ s.n=(s.n||0)+1; s.tp=w.t; s.ch=0; s.ok=false; }
  if(b&&m!==s.pm&&!so&&!s.ps) s.ch=(s.ch||0)+1;

/* ===================== DÖNÜŞTÜRME (SEG) ===================== */
const segRule=(exp,n)=>(w,q,iv,dt,s)=>{ if(w.t<0.06) return; const v=exp(w), want=SEGT[v&15], got=qb(q,'Q1.')&127;
  if(got!==want){ s.b=(s.b||0)+dt; if(s.b>0.2) return tx(`Hata: Gösterge ${v} göstermeli! SEG, sayıyı 7-segment desenine çevirir.`,`Error: The display must show ${v}! SEG turns a number into a 7-segment pattern.`); }
  else { s.b=0; if(!s.seen) s.seen={}; if(!s.seen[v]){ s.seen[v]=1; w.cnt.shown=Object.keys(s.seen).length-1; } } };

    hint:tx(`SM0.0 → SEG QB1 ← ${inc?'VW0':'C1'}. SEG, 0–9 arası sayıyı göstergenin a–g segmentlerine çevirir.`,`SM0.0 → SEG QB1 ← ${inc?'VW0':'C1'}. SEG turns a 0–9 number into the display's a–g segments.`),

};

/* ===================== KAYDIRMA (SHL / SHR) ===================== */
const chaseRule=(dir,tt,loop)=>(w,q,iv,dt,s)=>{ const v=qb(q,'Q0.')&15;
  if(v&&(v&(v-1))) return tx('Hata: Aynı anda yalnızca BİR lamba yanmalı!','Error: Only ONE lamp may be on at a time!');
  if(v&&v!==s.v){ const nx=dir>0?(s.v<<1)&15||(loop?1:0):(s.v>>1)||(loop?8:0);
    if(s.v&&v===nx){ const d=w.t-s.ts, mx=tt+0.3; if(s.k>=1&&(d<tt-0.15||d>mx)) return tx(`Hata: Işık her ${fx(tt)} sn'de bir adım kaymalı!`,`Error: The light must move one step every ${tt} s!`); s.k=(s.k||0)+1; w.cnt.step=s.k; }
    else if(s.v) return tx('Hata: Işık sırayla kaymalı!','Error: The light must move in order!');
    else s.k=s.k||0;
    s.v=v; s.ts=w.t; } };
const chase=(dir,loop)=>(r,k,n)=>{
  const {A,io}=mkCtx(r,n,['start'],['l0','l1','l2','l3']); const tt=pick(r,[0.5,1]), st=dir>0?1:8, op=dir>0?'SHL':'SHR';
  const rs=[R(['NO '+A.start,null,null,null,'MOV QB0 '+st]),R(['NC T1',null,null,null,'TON T1 '+tt]),R(['NO T1',null,null,null,op+' QB0 1'])];
  if(loop) rs.push(R([dir>0?'CMP QB0 >= 16':'CMP QB0 == 0',null,null,null,'MOV QB0 '+st]));
  const N=loop?7:3;
  const sc={noBelt:true,boxes:0,row:{pre:'Q0.',n:4},rules:[chaseRule(dir,tt,loop)]};
  if(loop) sc.rules.unshift((w,q,iv,dt,s)=>{ if(iv[A.start]) s.st=1; if(s.st&&w.t>1.2&&!(qb(q,'Q0.')&15)){ s.z=(s.z||0)+dt; if(s.z>0.25) return tx('Hata: Işık sona gelince başa dönmeli!','Error: When the light reaches the end it must wrap around!'); } else s.z=0; });
  return {title:loop?tx('Sonsuz Yürüyen Işık','Endless Running Light'):dir>0?tx(`Yürüyen Işık (SHL, ${fx(tt)} sn)`,`Running Light (SHL, ${tt} s)`):tx(`Ters Yürüyen Işık (SHR)`,`Reverse Running Light (SHR)`),
    task:loop?tx(`START (${A.start}) QB0'a ${st} yazsın. Her ${fx(tt)} sn'de ışık bir lamba ${dir>0?'sola (SHL)':'sağa (SHR)'} kaysın. Işık son lambadan çıkınca (QB0 ${dir>0?'≥ 16':'= 0'}) tekrar ${st} yaz ki sonsuza dek dönsün. 7 adım.`,`START (${A.start}) writes ${st} to QB0. Every ${tt} s the light moves one lamp ${dir>0?'left (SHL)':'right (SHR)'}. When it leaves the last lamp (QB0 ${dir>0?'≥ 16':'= 0'}) write ${st} again so it loops forever. 7 steps.`)
      :tx(`4 lamba QB0'a bağlı (Q0.0–Q0.3). START (${A.start}) QB0'a ${st} yazsın (MOV) — ${dir>0?'ilk':'son'} lamba yanar. T1 ile her ${fx(tt)} sn'de bir darbe üret ve QB0'ı 1 bit ${dir>0?'sola (SHL)':'sağa (SHR)'} kaydır.`,`4 lamps are wired to QB0 (Q0.0–Q0.3). START (${A.start}) writes ${st} to QB0 (MOV) — the ${dir>0?'first':'last'} lamp lights. Make a pulse every ${tt} s with T1 and shift QB0 by 1 bit ${dir>0?'left (SHL)':'right (SHR)'}.`),
    hint:tx(`${A.start} → MOV QB0 ← ${st} · KAPALI T1 → TON T1 (${fx(tt)} sn) — kendini sıfırlayan darbe · T1 → ${op} QB0 1`+(loop?` · CMP QB0 ${dir>0?'≥ 16':'= 0'} → MOV QB0 ← ${st}`:'')+'.',`${A.start} → MOV QB0 ← ${st} · NC T1 → TON T1 (${tt} s) — a self-resetting pulse · T1 → ${op} QB0 1`+(loop?` · CMP QB0 ${dir>0?'≥ 16':'= 0'} → MOV QB0 ← ${st}`:'')+'.'),
    io,M:0,T:1,C:0,words:['QB0'],wt:{QB0:'LAMBALAR'},pal:palOf({rungs:rs},dir>0?['SHR']:['SHL']),scene:sc,goals:[{k:'cnt',f:'step',n:N,l:T2('Adım','Step')}],sol:{rungs:rs},bot:at([[0.5,A.start]])};
};
const chaseSM=(r,k,n)=>{
  const {io}=mkCtx(r,n,[],['l0','l1','l2','l3']);
  const rs=[R(['NO SM0.1',null,null,null,'MOV QB0 1']),R(['NO SM0.5','P',null,null,'SHL QB0 1']),R(['CMP QB0 >= 16',null,null,null,'MOV QB0 1'])];

/* ===================== MANTIK İŞLEMLERİ (byte) ===================== */
const mirror=inv=>(r,k,n)=>{
  const {A,io}=mkCtx(r,n,['s1','s2','s3','s4'],['l0','l1','l2','l3']);
  const rs=[R(['NO SM0.0',null,null,null,'MOV QB0 IB0'])]; if(inv) rs.push(R(['NO SM0.0',null,null,null,'INV QB0']));
  const exp=(w,q,iv)=>(inv?~qb(iv,'I0.'):qb(iv,'I0.'))&15;
  const sc={noBelt:true,boxes:0,row:{pre:'Q0.',n:4},
    rules:[(w,q,iv,dt,s)=>{ if(w.t<0.06) return; const e=exp(w,q,iv), g=qb(q,'Q0.')&15; if(e!==g){ s.b=(s.b||0)+dt; if(s.b>0.2) return inv?tx('Hata: Her lamba kendi anahtarının TERSİNİ göstermeli (INV)!','Error: Each lamp must show the OPPOSITE of its key (INV)!'):tx('Hata: Lambalar anahtarları birebir göstermeli: QB0 = IB0!','Error: The lamps must mirror the keys exactly: QB0 = IB0!'); } else { s.b=0; const ib=qb(iv,'I0.'); if(ib!==s.ib){ if(s.ib!=null) w.cnt.chg=(w.cnt.chg||0)+1; s.ib=ib; } } }]};

const starDelta=(r,k,n)=>{
  const {A,io}=mkCtx(r,n,['start','stop'],['k1','k2','k3']); const t=pick(r,[2,2.5,3,4]);
  const sol={rungs:[R(['NO '+A.start,'NC '+A.stop,'COIL '+A.k1],['NO '+A.k1]),R(['NO '+A.k1,'TON T1 '+t]),R(['NO '+A.k1,'NC T1','NC '+A.k3,'COIL '+A.k2]),R(['NO T1','NC '+A.k2,'COIL '+A.k3])]};
  const sc=Object.assign({},MB,{mach:{kind:'stardelta',k1:A.k1,k2:A.k2,k3:A.k3},
    rules:[(w,q,iv,dt,s)=>{ const k1=!!q[A.k1],k2=!!q[A.k2],k3=!!q[A.k3];
      if(k1&&!s.k1){ s.t1=w.t; } s.k1=k1;
      if(k1&&s.t1!=null){ const d=w.t-s.t1;
        if(d>0.25&&d<t-0.35&&!k2) return tx('Hata: Motor önce YILDIZ (K2) bağlı kalkmalı!','Error: The motor must start in STAR (K2) first!');
        if(k3&&!s.k3){ if(Math.abs(d-t)>0.35) return tx(`Hata: Üçgene geçiş ${fx(t)} sn sonra olmalı (şu an ${fx(d.toFixed(1))} sn)!`,`Error: Switch to delta after ${t} s (now ${d.toFixed(1)} s)!`); w.f.delta=true; }
        if(d>0.5&&k2) w.f.star=true; }
      s.k3=k3; if(iv[A.stop]) s.st=w.t;
      if(s.st!=null&&(k1||k2||k3)&&w.t-s.st>0.3&&!iv[A.start]) return tx('Hata: STOP her şeyi kapatmalı!','Error: STOP must switch everything off!');
      if(s.st!=null&&w.f.delta&&!k1&&!k2&&!k3) w.f.stop=true;
      if(w.t<0.45&&(k1||k2||k3)) return tx('Hata: START\'a basılmadan kontaktör çekti!','Error: A contactor pulled in before START!'); }]});
  return {title:tx(`Yıldız-Üçgen Yol Verme (${fx(t)} sn)`,`Star-Delta Starter (${t} s)`),
    task:tx(`Büyük motor yıldız-üçgen kalkar: START (${A.start}) ile ana kontaktör K1 (${A.km||A.k1}) ve YILDIZ K2 (${A.k2}) çeksin. ${fx(t)} sn sonra K2 bıraksın, ÜÇGEN K3 (${A.k3}) çeksin. K2 ve K3 asla aynı anda çekmemeli (kısa devre!). STOP (${A.stop}) hepsini kapatsın.`,
      `A big motor starts star-delta: START (${A.start}) pulls in the main contactor K1 (${A.k1}) and STAR K2 (${A.k2}). After ${t} s K2 drops and DELTA K3 (${A.k3}) pulls in. K2 and K3 must never be on together (short circuit!). STOP (${A.stop}) switches everything off.`),
    hint:tx(`(START ∥ ${A.k1}) · KAPALI STOP → ${A.k1} · ${A.k1} → TON T1 (${fx(t)}) · ${A.k1} · KAPALI T1 · KAPALI ${A.k3} → ${A.k2} · T1 · KAPALI ${A.k2} → ${A.k3}. KAPALI kontaklarla karşılıklı kilitleme yap.`,`(START ∥ ${A.k1}) · NC STOP → ${A.k1} · ${A.k1} → TON T1 (${t}) · ${A.k1} · NC T1 · NC ${A.k3} → ${A.k2} · T1 · NC ${A.k2} → ${A.k3}. Interlock with NC contacts.`),
    io,M:0,T:1,C:0,pal:PAL_C,scene:sc,goals:[{k:'star',l:T2('Yıldız kalkış','Star start')},{k:'delta',l:T2('Üçgene geçiş','Switch to delta')},{k:'stop',l:T2('STOP','STOP')}],sol,bot:at([[0.5,A.start],[0.5+t+2,A.stop]])};
};

const reverseMotor=(r,k,n)=>{
  const {A,io}=mkCtx(r,n,['fwd','rev','stop'],['kf','kr']);
  const sol={rungs:[R(['NO '+A.fwd,'NC '+A.stop,'NC '+A.kr,'COIL '+A.kf],['NO '+A.kf]),R(['NO '+A.rev,'NC '+A.stop,'NC '+A.kf,'COIL '+A.kr],['NO '+A.kr])]};

      if(iv[A.rev]&&f) s.lt=w.t; if(s.lt!=null&&f&&!rv&&w.t-s.lt>0.5) w.f.lock=true;

    io,M:0,T:0,C:0,pal:PAL_B,scene:sc,goals:[{k:'fwd',l:T2('İleri','Forward')},{k:'lock',l:T2('Kilitleme testi','Interlock test')},{k:'rev',l:T2('Geri','Reverse')}],sol,bot:at([[0.5,A.fwd],[2,A.rev],[3,A.stop],[3.6,A.rev]])};

const ELEM_ORDER=['NO','NC','COIL','BR','SET','RST','MEM','TON','TOF','CTU','CTD','VW','CMP','P','N','NOT','SM','TONR','MOV','ADD','INC','SEG','SHL','WAND','RTC'];
const ELEM_OF=t=>({SUB:'ADD',MUL:'ADD',DIV:'ADD',DEC:'INC',SHR:'SHL',WOR:'WAND',INV:'WAND'})[t]||t;
function brSym(){ return '<svg width="34" height="24" viewBox="0 0 34 24"><path d="M2 4H32M8 4V20H26V4"/></svg>'; }
function memSym(){ return '<svg width="34" height="24" viewBox="0 0 34 24"><rect x="4" y="2" width="26" height="20" rx="3"/><text x="17" y="16">M</text></svg>'; }
function wSym(l){ return `<svg width="34" height="24" viewBox="0 0 34 24"><rect x="2" y="2" width="30" height="20" rx="3"/><text x="17" y="15.5" font-size="8">${l}</text></svg>`; }
function elSym(k){ return k==='BR'?brSym():k==='MEM'?memSym():k==='SM'?wSym('SM'):k==='VW'?wSym('VW'):palSym(k); }
// örnek satırı SVG olarak çiz: main = [[tip,adr],...] (son eleman çıkış), br = ilk sütunun altına paralel kol
function rungSVG(main,br){
  const W=290, cw=56, x0=10, y=20, H=br?76:42, outX=W-38;
  let g=`<path class="w" d="M${x0} ${y}H${outX}"/>`, k=`<path class="rl" d="M4 4V${H-4}M${W-4} 4V${H-4}"/><path class="w" d="M${W-4} ${y}H${outX+34}"/>`;
  const sym=(t,a,x,yy)=>`<svg x="${x}" y="${yy-12}" width="34" height="24" viewBox="0 0 34 24">${palSym(t).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</svg><text class="ad" x="${x+17}" y="${yy+22}"${a.length>7?' style="font-size:7.5px"':''}>${a}</text>`;
  const n=main.length-1;
  main.forEach(([t,a],i)=>{ const x=i<n?x0+12+i*cw:outX; g+=`<rect class="bg" x="${x}" y="${y-12}" width="34" height="24"/>`+sym(t,a,x,y); });
  if(br){ const yb=y+36, xe=x0+12+br.length*cw-10; g+=`<path class="w" d="M${x0} ${y}V${yb}H${xe}V${y}"/>`;
    br.forEach(([t,a],i)=>{ const x=x0+12+i*cw; g+=`<rect class="bg" x="${x}" y="${yb-12}" width="34" height="24"/>`+sym(t,a,x,yb); }); }
  return `<svg class="rs" viewBox="0 0 ${W} ${H+8}" width="100%">${k}${g}</svg>`;
}
function elemHTML(k,full){
  const E=ELEM[k];
  let ex=rungSVG(E.ex,E.br); if(E.ex2) ex+=rungSVG(E.ex2);
  return `<div class="el"><div class="eh"><div class="pal sel" style="flex:0 0 54px;height:42px">${elSym(k)}</div><b>${tx(E.t[0],E.t[1])}</b></div>
   <p class="t">${tx(E.d[0],E.d[1])}</p>${full?`<div class="ex"><small>${tx(E.e[0],E.e[1])}</small>${ex}</div>`:''}</div>`;
}
// bölümde kullanılan elemanlar (çözüme göre)
function levelElems(lv){
  const s=new Set(); for(const rg of lv.sol.rungs){ if(rg.br&&rg.c[1].some(Boolean)) s.add('BR'); for(const row of rg.c) for(const c of row) if(c){ s.add(ELEM_OF(c.t)); const ad=[c.a,c.src].filter(Boolean);
    if(c.a&&c.a[0]==='M') s.add('MEM'); if(ad.some(a=>/^SM/.test(a))) s.add('SM'); if(ad.some(a=>/^(VW|AIW|QB|IB)/.test(a))) s.add('VW'); } }
  return ELEM_ORDER.filter(k=>s.has(k));
}

/* v1.1.9: görev metni — ilk cümle hedef, kalanı madde madde; yöntemi ele veren (TON), (WOR maske 0101) gibi parantezler gizlenir (ipucunda var) */
const TASK_KW=new Set('TON TOF TONR CTU CTD CMP MOV INC DEC ADD SUB DIV MUL SEG SHL SHR INV WAND WOR NOT P N Set Reset S/R SM mühür histerezis kilitleme maske kenarıyla ile'.split(' '));
function fmtTask(t){
  t=t.replace(/\s*\(([^()]*)\)/g,(m,c)=>{ const w=c.split(/[\s,+\/]+/).filter(Boolean); return w.length&&w.every(x=>TASK_KW.has(x)||/^[\d≥≤≠<>=]+$/.test(x))&&!/[IQ]\d\.\d/.test(c)?'':m; });
  const ss=t.split(/(?<=[.!?])\s+(?=[A-ZÇĞİÖŞÜ0-9"'(])/).map(s=>s.trim()).filter(Boolean);
  const hl=s=>esc(s).replace(/\s?\(((?:SM|[IQM])\d\.\d|AIW\d|[QI]B\d)\)/g,' <b class="ad">$1</b>').replace(/(^|[^\w>])((?:SM|[IQM])\d\.\d|[TC]\d|VW\d|AIW\d|[QI]B\d)\b(?![^<]*<\/b>)/g,'$1<b>$2</b>');
  const li=ss.slice(1).map(s=>{ const tst=/^Test:/i.test(s); return `<li${tst?' class="ts"':''}>${hl(tst?s.replace(/^Test:\s*/i,''):s)}</li>`; }).join('');
  return `<p class="tg">${hl(ss[0]||'')}</p>`+(li?`<ul>${li}</ul>`:''); }

function canPlace(t,i,r,c){
  const rg=S.prog.rungs[i]; if(!rg||rg.c[r][c]) return 'dolu'; if(r===1&&!rg.br) return 'x';
  if(isOut(t)){ if(c!==OUTC||r!==0) return r===1?tx('Paralel kolda yalnızca kontak olur','Only contacts go on a parallel branch'):tx('Bobin / zamanlayıcı / sayıcı en sağ sütuna konur','Coils / timers / counters go in the rightmost column'); }
  else if(c===OUTC) return tx('Kontaklar sol sütunlara konur','Contacts go in the left columns');
  return posMsg(i,r,c);
}
/* soldan sağa kuralı: solu boşken sağa blok konmaz; çıkış, hatta en az bir kontak olunca gelir */
function posMsg(i,r,c){ const rg=S.prog.rungs[i], row=rg.c[r];
  if(r===0){ if(c<OUTC&&c>0&&!row[c-1]) return tx('Soldan sağa kur: önce soldaki boş yere blok koy','Build left to right: fill the empty spot on the left first');
    if(c===OUTC&&!row[0]) return tx('Önce soldan bir kontak koy — çıkış en sona gelir','Place a contact on the left first — the output comes last'); return ''; }
  if(c<OUTC&&!rg.c[0][c]) return tx('Paralel kol, üstteki bir kontağın altına konur','A branch block goes under a contact on the main line');
  if(c<OUTC&&row.some(Boolean)&&!row[c-1]&&!row[c+1]) return tx('Paralel kol bitişik olmalı: mevcut kol bloğunun yanına koy','A branch must be continuous: place it next to the existing branch block');
  return ''; }
const posOK=(i,r,c)=>{ const rg=S.prog.rungs[i]; if(!rg||rg.c[r][c]||(r===1&&!rg.br)) return false; return !posMsg(i,r,c); };

function dropAction(d,i,r,c){
  if(!d.from) return canPlace(d.t,i,r,c)||'new';
  const f=d.from; if(f.i===i&&f.r===r&&f.c===c) return 'x';
  const rs=S.prog.rungs, src=rs[f.i].c[f.r][f.c], dst=rs[i].c[r][c];
  if(r===1&&!rs[i].br) return 'x';
  rs[f.i].c[f.r][f.c]=null;
  let res;
  if(!dst) res=canPlace(src.t,i,r,c)||'move';
  else { rs[i].c[r][c]=null; const a=canPlace(src.t,i,r,c), b=canPlace(dst.t,f.i,f.r,f.c); rs[i].c[r][c]=dst; res=a||b?(a||b):'swap'; }
  rs[f.i].c[f.r][f.c]=src; return res;
}

    (sh7?`<div class="fld"><label>${tx('Kaç bit','Bits')}</label><div class="step"><button class="btn" data-s="-">${I('remove')}</button><b>${pv}</b><button class="btn" data-s="+">${I('add')}</button></div></div>`:'')+
    (isNum()?`<div class="fld"><label>${t==='CMP'?tx('Sınır (IN2)','Limit (IN2)'):t==='MOV'?tx('Yazılacak sayı','Number to write'):tx('Sayı','Number')}</label><div class="step"><button class="btn" data-s="-">${I('remove')}</button><input id="pvIn" type="number" inputmode="numeric" value="${pv}" style="width:96px;text-align:center"><button class="btn" data-s="+">${I('add')}</button></div></div>`:'')+
    (mk?`<div class="fld"><label>${tx('Maske','Mask')} = ${pv}</label><div class="chips bits" style="flex-wrap:nowrap;gap:3px">${[7,6,5,4,3,2,1,0].map(b=>`<button class="chip ${pv&(1<<b)?'sel':''}" data-b="${b}" style="min-width:0;flex:1;padding:5px 0;justify-content:center;text-align:center">${pv&(1<<b)?1:0}<small>${isB?sel[0]+sel[2]+'.'+b:'b'+b}</small></button>`).join('')}</div></div>`:'')+
    `<div class="brow">${isNew?'':'<button class="btn dan" id="mDel">'+I('delete')+'</button>'}<button class="btn wide" id="mCan">${tx('İptal','Cancel')}</button><button class="btn pri wide" id="mOk">${tx('Tamam','OK')}</button></div>`;
  };
  const keep=()=>{ const tg=$('#tgIn'); if(tg&&sel) S.tags[sel]=tg.value.trim(); const pi=$('#pvIn'); if(pi){ const v=parseInt(pi.value,10); if(!isNaN(v)) pv=Math.max(-32768,Math.min(32767,v)); } };
  draw(); openSheet();
  sh.onclick=e=>{
    const ch=e.target.closest('[data-a]'); if(ch){ keep(); const was=sel; sel=ch.dataset.a; if(t==='CMP'&&cell.pv===undefined&&/^AIW/.test(sel)!==/^AIW/.test(was||'')) pv=/^AIW/.test(sel)?16000:1; Snd.click(); draw(); return; }
    const sc=e.target.closest('[data-src]'); if(sc){ keep(); src=sc.dataset.src||null; Snd.click(); draw(); return; }
    const oc=e.target.closest('[data-op]'); if(oc){ keep(); op=oc.dataset.op; Snd.click(); draw(); return; }
    const bc=e.target.closest('[data-b]'); if(bc){ keep(); pv^=1<<(+bc.dataset.b); Snd.click(); draw(); return; }
    const st=e.target.closest('[data-s]'); if(st){ keep(); const up=st.dataset.s==='+';
      if(tm) pv=Math.max(0.5,Math.min(30,pv+(up?0.5:-0.5))); else if(ct) pv=Math.max(1,Math.min(20,pv+(up?1:-1))); else if(sh7) pv=Math.max(1,Math.min(7,pv+(up?1:-1)));
      else pv=Math.max(-32768,Math.min(32767,pv+(up?stp():-stp())));
      Snd.click(); draw(); return; }
    if(e.target.closest('#mCan')){ closeAll(); return; }
    if(e.target.closest('#mDel')){ S.prog.rungs[i].c[r][c]=null; if(r===0) compact(i); saveProg(); renderLadder(); Snd.click(); closeAll(); return; }
    if(e.target.closest('#mOk')){ keep();
      if(!sel){ toast(tx('Bu blok için kullanılabilir adres yok','No available address for this block')); return; }
      if(t==='SEG'&&!src){ toast(tx('Kaynak seç','Pick a source')); return; }
      if(t==='DIV'&&!pv){ toast(tx('Sıfıra bölünemez','Cannot divide by zero')); return; }
      const nc={t,a:sel}; if(tm||ct||sh7||mk||isNum()) nc.pv=pv; if(t==='CMP') nc.op=op; if(hasSrc&&src) nc.src=src;
      place(nc); }
  };
}

function solLadder(lv){
  const nm=Math.max(2,...lv.sol.rungs.map(rg=>{ let n=0; while(n<OUTC&&rg.c[0][n]) n++; return n; }));
  const tags=defaultTags(lv), cw=60, x0=22, W=x0*2+cw*(nm+1), RH=62, BR=58;
  const inner=t=>palSym(t).replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
  const lbl=a=>(tags[a]||'').slice(0,11);
  return lv.sol.rungs.map((rg,ri)=>{
    const sp=branchSpan(rg), H=RH+(sp?BR:0), y=30;
    let g=`<text class="rn" x="2" y="11">R${ri+1}</text><path class="rl" d="M${x0-4} 4V${H-4}M${W-x0+4} 4V${H-4}"/><path class="w" d="M${x0-4} ${y}H${W-x0+4}"/>`;
    if(sp){ const xa=x0+sp.from*cw, xb=x0+(sp.to+1)*cw, yb=y+BR; g+=`<path class="w" d="M${xa} ${y}V${yb}H${xb}V${y}"/>`; }
    const cell=(c,col,yy)=>{ if(!c) return ''; const cx=x0+col*cw+cw/2;
      if(isOut(c.t)&&!['COIL','SET','RST'].includes(c.t)){
        const L=cellTxt(c), v=isTim(c.t)?`${fx(c.pv)} ${tx('sn','s')}`:L[1];
        return `<rect class="bx" x="${cx-28}" y="${yy-17}" width="56" height="34" rx="4"/><text class="bt" x="${cx}" y="${yy-3}"${L[0].length>8?' style="font-size:8px"':''}>${L[0]}</text><text class="bv" x="${cx}" y="${yy+11}"${v.length>8?' style="font-size:8px"':''}>${v}</text>`; }
      if(NOADDR.includes(c.t)) return `<rect class="bg" x="${cx-19}" y="${yy-13}" width="38" height="26"/><svg x="${cx-17}" y="${yy-12}" width="34" height="24" viewBox="0 0 34 24" class="sy">${inner(c.t)}</svg>`;
      if(c.t==='CMP') return `<rect class="bg" x="${cx-19}" y="${yy-13}" width="38" height="26"/><svg x="${cx-17}" y="${yy-12}" width="34" height="24" viewBox="0 0 34 24" class="sy"><path d="M0 12H8M26 12H34M8 3V21M26 3V21"/><text x="17" y="17" font-size="12">${OPSYM[c.op]}</text></svg><text class="ad" x="${cx}" y="${yy-17}">${c.a}</text><text class="ad" x="${cx}" y="${yy+24}" style="font-size:8.5px">${OPSYM[c.op]} ${c.pv}</text>`;
      return `<rect class="bg" x="${cx-19}" y="${yy-13}" width="38" height="26"/><svg x="${cx-17}" y="${yy-12}" width="34" height="24" viewBox="0 0 34 24" class="sy">${inner(c.t)}</svg><text class="ad" x="${cx}" y="${yy-17}">${c.a}</text><text class="tg" x="${cx}" y="${yy+24}">${lbl(c.a)}</text>`; };
    for(let col=0;col<OUTC;col++) g+=cell(rg.c[0][col],col,y); g+=cell(rg.c[0][OUTC],nm,y);
    if(sp) for(let col=sp.from;col<=sp.to;col++) g+=cell(rg.c[1][col],col,y+BR);
    return `<svg class="sl" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
  }).join('');
}

  const sc=world.sc, st=S.lv.io.I.find(d=>d.n==='START'||d.k==='btn');

  idleT+=dt*S.speed; if(idleT>3.5){ idleT=-30; Hap.tap(); toast(tx(`Bant duruyor — devam etmek için START (${sc.startA}) butonuna bas`,`Belt is stopped — press START (${sc.startA}) to continue`)); }

function scanOnce(){
  const iv=world.sense(); for(const k in iv) plc.b[k]=iv[k];
  const qs=S.lv.io.Q.map(d=>d.a), before=qs.map(a=>!!plc.b[a]);
  plc.scan(S.prog,20); world.advance(plc.b,SCAN);
  let ch=false,hs=false; qs.forEach((a,i)=>{ if(!!plc.b[a]!==before[i]){ ch=true; if(world.sc.pistons.some(p=>p.a===a)) hs=true; } });
  if(ch) Snd.relay(); if(hs) Snd.hiss();
  if(world.err) onFail(); else if(world.done) onWin();
}
function frame(now){
  const dt=Math.min(0.1,(now-last)/1000); last=now;
  for(const k in flash) if(flash[k]>0) flash[k]-=dt;
  if(S.running){ acc+=dt*S.speed; let n=0; while(acc>=SCAN&&n<300&&S.running){ scanOnce(); acc-=SCAN; n++; } } else acc=0;
  const mOpen=$('#menu').classList.contains('show');
  if(mOpen&&S.mscr==='main') drawMenuAnim(now);
  if(S.running&&world&&!world.err&&!world.done) idleNudge(dt);
  if(!mOpen){ drawScene(); if((fr++&1)===0){ updateLive(); updatePanel(); } }
  requestAnimationFrame(frame);

      if(v){ if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight+1) return true; }
      else if(/(auto|scroll)/.test(cs.overflowX)&&el.scrollWidth>el.clientWidth+1) return true; } return false; };
  document.addEventListener('touchstart',e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; },{passive:true});
  document.addEventListener('touchmove',e=>{ if(e.touches.length>1){ e.preventDefault(); return; } const t=e.touches[0], dx=t.clientX-sx, dy=t.clientY-sy;
    if(!e.cancelable) return; const tg=e.target; if(tg.closest&&tg.closest('input,textarea')) return;
    if(!can(tg,Math.abs(dy)>=Math.abs(dx))) e.preventDefault(); },{passive:false});
  ['gesturestart','gesturechange'].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
})();

const NAV={exitAt:0};
function navBack(){
  if(document.body.classList.contains('dragging')){ dragClean(); return true; }
  if($('#ovSheet').classList.contains('show')){ $('#ovSheet').classList.remove('show'); S.tool=null; refreshTool(); return true; }
  if($('#ovCard').classList.contains('show')){ $('#ovCard').classList.remove('show'); return true; }
  if($('#menu').classList.contains('show')){
    const s=S.mscr;
    if(s==='set'&&S.setBack==='game'){ S.setBack=null; closeAll(); return true; }
    if(s&&s!=='main'){ showMenu('main'); return true; }
    return false;                                   // ana menüdeyiz
  }
  if(S.running) stopSim(true);                      // oyun ekranı → yol haritası
  showMenu('map'); return true;
}
try{
  history.replaceState({lm:0},''); history.pushState({lm:1},'');
  addEventListener('popstate',()=>{
    if(navBack()){ history.pushState({lm:1},''); return; }
    const now=Date.now();
    if(now-NAV.exitAt<2000) { history.back(); return; }   // iki kez üst üste → çık
    NAV.exitAt=now; toast(tx('Çıkmak için tekrar geri bas','Press back again to exit')); history.pushState({lm:1},'');
  });
}catch(_){}
